<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - IELTS Practice</title>

    <link rel="stylesheet" href="css/style.css">
    <script>
    const facultyId = sessionStorage.getItem("facultyId");

    if (!facultyId) {
        window.location.href = "faculty-login.html";
    }
</script>

</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
    <img src="assets/logo.png" alt="Universal Education Logo">
</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main class="dashboard-page">

        <div class="dashboard-container">

            <p class="small-heading">FACULTY PORTAL</p>

            <h1>Faculty Dashboard</h1>

            <p class="dashboard-subtitle">
                Manage students and IELTS practice tests.
            </p>

            <div class="dashboard-options">

                <a href="add-student.html" class="dashboard-card">
                    <div class="dashboard-icon">➕</div>
                    <h2>Add Student</h2>
                    <p>
                        Create student accounts and assign login credentials.
                    </p>
                    <span>Open →</span>
                </a>

                <a href="view-students.html" class="dashboard-card">
                    <div class="dashboard-icon">👥</div>
                    <h2>View Students</h2>
                    <p>
                        View student profiles and access their test results.
                    </p>
                    <span>Open →</span>
                </a>

            </div>

        </div>

    </main>

</body>
</html>
