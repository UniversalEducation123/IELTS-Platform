<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>



const SUPABASE_URL =
    "https://gehczgguwxqwfowmbedy.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =====================================
   NORMALIZE ANSWERS
===================================== */

function normalizeAnswer(answer) {

    return String(answer || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]/g, "");

}



/* =====================================
   CHECK ANSWER
===================================== */

function isCorrect(
    studentAnswer,
    acceptedAnswers
) {

    const student =
        normalizeAnswer(studentAnswer);


    if (!student) {
        return false;
    }


    return acceptedAnswers.some(
        function(answer) {

            return (
                student ===
                normalizeAnswer(answer)
            );

        }
    );

}



/* =====================================
   READING BAND
===================================== */

function calculateBand(correctCount) {

    if (correctCount >= 40) return "9.0";
    if (correctCount >= 39) return "8.5";
    if (correctCount >= 37) return "8.0";
    if (correctCount >= 36) return "7.5";
    if (correctCount >= 34) return "7.0";
    if (correctCount >= 32) return "6.5";
    if (correctCount >= 30) return "6.0";
    if (correctCount >= 27) return "5.5";
    if (correctCount >= 23) return "5.0";
    if (correctCount >= 19) return "4.5";
    if (correctCount >= 15) return "4.0";
    if (correctCount >= 12) return "3.5";
    if (correctCount >= 9) return "3.0";
    if (correctCount >= 6) return "2.5";

    return "2.0";
}



/* =====================================
   READ SAVED ANSWERS
===================================== */



function readGTReadingAnswers() {
    const answers = {};

    for (let i = 1; i <= 40; i++) {
        answers["q" + i] =
            sessionStorage.getItem("readingGT1_q" + i) || "";
    }

    // Questions 32–33 are saved together in Part 3.
    const combinedAnswer =
        sessionStorage.getItem("readingGT1_q32_33") || "";

    const selectedAnswers = combinedAnswer
        .split(",")
        .map(answer => answer.trim())
        .filter(Boolean);

    answers.q32 = selectedAnswers[0] || "";
    answers.q33 = selectedAnswers[1] || "";

    return answers;
}





/* =====================================
   ADD REVIEW ITEM
===================================== */

function addReviewItem(
    questionNumber,
    studentAnswer,
    correctAnswer,
    correct
) {

    const answerReview =
        document.getElementById(
            "answerReview"
        );


    if (!answerReview) {
        return;
    }


    const reviewItem =
        document.createElement("div");


    reviewItem.className =
        correct
            ? "answer-review-item correct"
            : "answer-review-item wrong";



    const header =
        document.createElement("div");


    header.className =
        "review-header";


    const question =
        document.createElement("strong");


    question.textContent =
        "Question " +
        questionNumber;


    const status =
        document.createElement("span");


    status.className =
        "review-status";


    status.textContent =
        correct
            ? "✓ Correct"
            : "✗ Wrong";


    header.appendChild(question);

    header.appendChild(status);


    reviewItem.appendChild(header);



    const studentLine =
        document.createElement("p");


    const studentLabel =
        document.createElement("strong");


    studentLabel.textContent =
        "Your answer: ";


    studentLine.appendChild(
        studentLabel
    );


    studentLine.appendChild(
        document.createTextNode(
            studentAnswer ||
            "Not answered"
        )
    );


    reviewItem.appendChild(
        studentLine
    );



    const correctLine =
        document.createElement("p");


    const correctLabel =
        document.createElement("strong");


    correctLabel.textContent =
        "Correct answer: ";


    correctLine.appendChild(
        correctLabel
    );


    correctLine.appendChild(
        document.createTextNode(
            correctAnswer
        )
    );


    reviewItem.appendChild(
        correctLine
    );


    answerReview.appendChild(
        reviewItem
    );

}



/* =====================================
   ANSWER KEY
===================================== */

const answerKey = {

    /* =================================
       PART 1
       QUESTIONS 1–14
    ================================= */

    q1: ["C"],

    q2: ["B"],

    q3: ["Several hundred miles"],

    q4: ["the road dangers", "road dangers"],

    q5: ["Slower traffic systems"],

    q6: [
        "By donating money",
        "make a decision",
        "donating money",
        "making a decision"
    ],

    q7: ["Walkers"],

    q8: ["TRUE"],

    q9: ["TRUE"],

    q10: ["FALSE"],

    q11: ["TRUE"],

    q12: ["NOT GIVEN"],

    q13: ["FALSE"],

    q14: ["FALSE"],



    /* =================================
       PART 2
       QUESTIONS 15–27
    ================================= */

    q15: ["I"],

    q16: ["IV"],

    q17: ["VIII"],

    q18: ["IX"],

    q19: ["VII"],

    q20: ["III"],

    q21: [
        "Immigration authorities"
    ],

    q22: [
        "An ELICOS course",
        "ELICOS"
    ],

    q23: [
        "The students",
        "students"
    ],

    q24: [
        "By bankdraft",
        "bankdraft",
        "bank draft"
    ],

    q25: [
        "It is refunded",
        "refunded"
    ],

    q26: [
        "Over 4 weeks",
        "over 4 weeks"
    ],

    q27: [
        "International Student Programs",
        "Manager",
        "Manager International Student Programs",
        "Manager, International Student Programs"
    ],



    /* =================================
       PART 3
       QUESTIONS 28–40
    ================================= */

    q28: ["B"],

    q29: ["D"],

    q30: ["E"],

    q31: ["A"],

    q32: ["II", "VI"],

    q34: ["Decreased"],

    q35: ["Disconnected"],

    q36: ["Problems"],

    q37: ["Growth"],

    q38: ["Join"],

    q39: ["Reserves"],

    q40: ["Cooperate"]

};


/* =====================================
   SCORE QUESTIONS 32–33
===================================== */

function scoreQuestions32And33(answers) {
    const selected = Array.isArray(answers.q32)
        ? answers.q32.map(normalizeAnswer)
        : [normalizeAnswer(answers.q32)];

    const correctOptions = ["ii", "vi"];

    return correctOptions.filter(option =>
        selected.includes(option)
    ).length;
}


/* =====================================
   MAIN SCORE CALCULATION
===================================== */

async function calculateReadingScore() {

    const answers =
        readGTReadingAnswers();


    let correctCount = 0;



    /* ===============================
       QUESTIONS 1–31
    =============================== */

    for (let i = 1; i <= 31; i++) {

        const key =
            "q" + i;


        const student =
            answers[key] || "";


        const accepted =
            answerKey[key] || [];


        const correct =
            isCorrect(
                student,
                accepted
            );


        if (correct) {

            correctCount++;

        }


        addReviewItem(
            i,
            student,
            accepted.join(" / "),
            correct
        );

    }




    /* ===============================
       QUESTIONS 32–33
       TWO SEPARATE ANSWERS
    =============================== */

    const student32 = normalizeAnswer(answers.q32);
    const student33 = normalizeAnswer(answers.q33);

    const correctOptions = ["ii", "vi"];

    const correct32 = correctOptions.includes(student32);
    const correct33 = correctOptions.includes(student33);

    if (correct32) correctCount++;
    if (correct33) correctCount++;

    addReviewItem(
        32,
        answers.q32,
        "II / VI",
        correct32
    );

    addReviewItem(
        33,
        answers.q33,
        "II / VI",
        correct33
    );



    /* ===============================
       QUESTIONS 34–40
    =============================== */

    for (let i = 34; i <= 40; i++) {

        const key =
            "q" + i;


        const student =
            answers[key] || "";


        const accepted =
            answerKey[key] || [];


        const correct =
            isCorrect(
                student,
                accepted
            );


        if (correct) {

            correctCount++;

        }


        addReviewItem(
            i,
            student,
            accepted.join(" / "),
            correct
        );

    }



    /* ===============================
       DISPLAY SCORE
    =============================== */

    const wrongCount =
        40 - correctCount;


    const bandScore =
        calculateBand(
            correctCount
        );


    document.getElementById(
        "correctAnswers"
    ).textContent =
        correctCount;


    document.getElementById(
        "wrongAnswers"
    ).textContent =
        wrongCount;


    document.getElementById(
        "totalScore"
    ).textContent =
        correctCount +
        " / 40";


    document.getElementById(
        "bandScore"
    ).textContent =
        bandScore;



    console.log(
        "FINAL GT READING TEST 1 SCORE:",
        correctCount + " / 40"
    );



/* ===============================
   SAVE RESULT AND ANSWER REVIEW
=============================== */

const readingAnswers = {};

for (let i = 1; i <= 31; i++) {
    const key = "q" + i;
    const studentAnswer = answers[key] || "";
    const acceptedAnswers = answerKey[key] || [];

    readingAnswers[key] = {
        userAnswer: studentAnswer,
        correctAnswer: acceptedAnswers,
        isCorrect: isCorrect(studentAnswer, acceptedAnswers)
    };
}

readingAnswers.q32 = {
    userAnswer: student32,
    correctAnswer: ["II", "VI"],
    isCorrect: ["ii", "vi"].includes(normalizeAnswer(student32))
};

readingAnswers.q33 = {
    userAnswer: student33,
    correctAnswer: ["II", "VI"],
    isCorrect: ["ii", "vi"].includes(normalizeAnswer(student33))
};

/* Questions 34–40 */
for (let i = 34; i <= 40; i++) {
    const key = "q" + i;
    const studentAnswer = answers[key] || "";
    const acceptedAnswers = answerKey[key] || [];

    readingAnswers[key] = {
        userAnswer: studentAnswer,
        correctAnswer: acceptedAnswers,
        isCorrect: isCorrect(studentAnswer, acceptedAnswers)
    };
}

await saveResultToSupabase(correctCount, readingAnswers);

}



/* =====================================
   SAVE RESULT TO SUPABASE
===================================== */

async function saveResultToSupabase(score, readingAnswers) {
    const studentId = sessionStorage.getItem("studentId");
    const studentName = sessionStorage.getItem("studentName") || "Student";

    if (!studentId || !Number.isFinite(Number(studentId))) {
        console.error("A valid student ID is missing.");
        return;
    }

    const testDate = new Date().toISOString().split("T")[0];

    const resultData = {
        student_id: Number(studentId),
        student_name: studentName,
        test_name: "GT Reading Test 1",
        test_date: testDate,
        reading_score: score,
        reading_answers: readingAnswers,
        is_submitted: true
    };

    const { data: existing, error: findError } = await supabaseClient
        .from("test_results")
        .select("id")
        .eq("student_id", Number(studentId))
        .eq("test_name", "GT Reading Test 1")
        .limit(1);

    if (findError) {
        console.error("Could not check for an existing GT result:", findError);
        return;
    }

    let saveError;

    if (existing && existing.length > 0) {
        const { error } = await supabaseClient
            .from("test_results")
            .update(resultData)
            .eq("id", existing[0].id);

        saveError = error;
    } else {
        const { error } = await supabaseClient
            .from("test_results")
            .insert(resultData);

        saveError = error;
    }

    if (saveError) {
        console.error("Error saving GT Reading Test 1:", saveError);
        return;
    }

    sessionStorage.setItem("readingGT1ResultSaved", "true");
    sessionStorage.setItem("readingGT1Submitted", "true");

    console.log("GT Reading Test 1 result and answers saved successfully.");
}


/* =====================================
   START
===================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        calculateReadingScore();

    }
);

</script>
