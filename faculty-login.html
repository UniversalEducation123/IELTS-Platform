<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - IELTS Practice</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <script src="../js/exam-inputs.js"></script>

    <header class="navbar">
        <a href="index.html" class="logo">
    <img src="assets/logo.png" alt="Universal Education Logo">
</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Back to Login</a>
        </nav>
    </header>

    <main class="login-page">

        <div class="login-container">

            <p class="small-heading">ADMINISTRATION PORTAL</p>

            <h1>Faculty Login</h1>

            <p class="login-subtitle">
                Sign in to manage students, tests, and results.
            </p>

            <form class="auth-form" id="facultyLoginForm">

                <label for="username">Faculty Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your faculty username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="primary-btn">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

        </div>

    </main>

    <script>
        const SUPABASE_URL = "https://gehczgguwxqwfowmbedy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        const facultyLoginForm =
            document.getElementById("facultyLoginForm");

        const loginMessage =
            document.getElementById("loginMessage");

        facultyLoginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            loginMessage.textContent = "Checking credentials...";

            const { data, error } = await supabaseClient
                .from("faculty")
                .select("*")
                .eq("username", username)
                .eq("password", password)
                .single();

            if (error || !data) {
                loginMessage.textContent =
                    "Incorrect username or password.";
                loginMessage.style.color = "red";
                return;
            }

            sessionStorage.setItem("facultyId", data.id);
            sessionStorage.setItem("facultyName", data.full_name || "");

            window.location.href = "faculty-dashboard.html";
        });
    </script>

</body>
</html>
