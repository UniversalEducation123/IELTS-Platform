<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 1 - IELTS Practice</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
    <img src="assets/logo.png" alt="Universal Education Logo">
</a>

        <nav>
            <a href="student-dashboard.html">Dashboard</a>
            <a href="student-login.html">Logout</a>
        </nav>
    </header>

    <main class="dashboard-page">

        <div class="dashboard-container">

            <p class="small-heading">IELTS MOCK TEST</p>

            <h1>Test 1 - Listening</h1>

            <p class="dashboard-subtitle">
                Full IELTS Practice Test
            </p>

            <div class="profile-card">

               
                <p>
                    Listen to the audio carefully and answer questions.
                </p>

                <br>

            
                <br>

                <button
    type="button"
    class="primary-btn"
    onclick="startFreshListeningTest();">
    Begin Test
</button>

            </div>

        </div>

    </main>

<script>
function startFreshListeningTest() {
    // Clear timer
    sessionStorage.removeItem("listeningTimeLeft");
    sessionStorage.removeItem("listeningTimerStarted");

    localStorage.removeItem("listeningTimeLeft");
    localStorage.removeItem("listeningTimerStarted");

    // Clear saved answers
    sessionStorage.removeItem("listeningPart1Answers");
    sessionStorage.removeItem("listeningPart2Answers");
    sessionStorage.removeItem("listeningPart3Answers");
    sessionStorage.removeItem("listeningPart4Answers");

    localStorage.removeItem("listeningPart1Answers");
    localStorage.removeItem("listeningPart2Answers");
    localStorage.removeItem("listeningPart3Answers");
    localStorage.removeItem("listeningPart4Answers");

    // Clear all Listening-related keys
    for (let i = sessionStorage.length - 1; i >= 0; i--) {
        const key = sessionStorage.key(i);

        if (key && (
            key.toLowerCase().includes("listening") ||
            key.toLowerCase().includes("answer")
        )) {
            sessionStorage.removeItem(key);
        }
    }

    for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);

        if (key && (
            key.toLowerCase().includes("listening") ||
            key.toLowerCase().includes("answer")
        )) {
            localStorage.removeItem(key);
        }
    }

    // Open actual Listening test
    window.location.href = "listening/listening-test-1.html";
}
</script>

</body>
</html>
