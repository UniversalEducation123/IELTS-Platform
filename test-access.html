<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Access</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .access-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            color: red;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
</head>

<body>

    <div class="access-box">
        <h2 id="testTitle">Test Access</h2>

        <p>Enter the password provided by your teacher.</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter password"
        >

        <button onclick="checkPassword()">Access Test</button>

        <p id="message"></p>
    </div>

    <script>

        const SUPABASE_URL = "https://gehczgguwxqwfowmbedy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

        const supabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
);

async function hashPassword(password) {
    const data = new TextEncoder().encode(password);

    const hashBuffer = await crypto.subtle.digest(
        "SHA-256",
        data
    );

    return Array.from(new Uint8Array(hashBuffer))
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
}

        const testPages = {
    "listening-test-1": {
        page: "listening/listening-test-1.html",
        title: "Listening Test 1"
    },

    "reading-test-1": {
        page: "test-1.html",
        title: "Reading Test 1"
    }
};

        const urlParams = new URLSearchParams(window.location.search);
        const testId = urlParams.get("test");

        const selectedTest = testPages[testId];

        if (!selectedTest) {
            document.getElementById("testTitle").textContent = "Invalid Test";
            document.getElementById("passwordInput").style.display = "none";
            document.querySelector("button").style.display = "none";
            document.querySelector("p").textContent = "This test link is invalid.";
        } else {
            document.getElementById("testTitle").textContent =
                selectedTest.title;
        }

        async function checkPassword() {
    if (!selectedTest) return;

    const enteredPassword =
        document.getElementById("passwordInput").value.trim();

    const message = document.getElementById("message");
    const button = document.querySelector("button");

    if (!enteredPassword) {
        message.textContent = "Please enter the password.";
        return;
    }

    button.disabled = true;
    message.textContent = "Checking password...";

    try {
        const passwordHash = await hashPassword(enteredPassword);

        const { data, error } = await supabase
            .from("test_access_codes")
            .select("*")
            .eq("test_id", testId)
            .eq("password_hash", passwordHash)
            .eq("is_used", false)
            .maybeSingle();

        if (error) {
            console.error(error);
            message.textContent = "Unable to verify password.";
            button.disabled = false;
            return;
        }

        if (!data) {
            message.textContent =
                "Incorrect password or this password has already been used.";
            button.disabled = false;
            return;
        }

        const { error: updateError } = await supabase
            .from("test_access_codes")
            .update({
                is_used: true
            })
            .eq("id", data.id)
            .eq("is_used", false);

        if (updateError) {
            console.error(updateError);
            message.textContent = "Could not activate this password.";
            button.disabled = false;
            return;
        }

        localStorage.setItem("access_" + testId, "true");

        window.location.href = selectedTest.page;

    } catch (error) {
        console.error(error);
        message.textContent = "Something went wrong.";
        button.disabled = false;
    }
}
    </script>

</body>
</html>
