<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Access</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .access-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            color: red;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <div class="access-box">
        <h2 id="testTitle">Test Access</h2>

        <p>Enter the password provided by your teacher.</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter password"
        >

        <button onclick="checkPassword()">Access Test</button>

        <p id="message"></p>
    </div>

    <script>

        const SUPABASE_URL = "https://gehczgguwxqwfowmbedy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

        const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const testPages = {
        "listening-test-1": {
            page: "listening/listening-test-1.html",
            title: "Listening Test 1"
        },

        "reading-test-1": {
            page: "test-1.html",
            title: "Reading Test 1"
        }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const testId = urlParams.get("test");
    const selectedTest = testPages[testId];

    const testTitle = document.getElementById("testTitle");
    const passwordInput = document.getElementById("passwordInput");
    const message = document.getElementById("message");

    if (!selectedTest) {
        testTitle.textContent = "Invalid Test";
        passwordInput.style.display = "none";
        document.querySelector("button").style.display = "none";
        message.textContent = "This test link is invalid.";
    } else {
        testTitle.textContent = selectedTest.title;
    }

    async function hashPassword(password) {
        const data = new TextEncoder().encode(password);

        const hashBuffer = await crypto.subtle.digest(
            "SHA-256",
            data
        );

        return Array.from(new Uint8Array(hashBuffer))
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("");
    }

    async function checkPassword() {
        if (!selectedTest) return;

        const enteredPassword = passwordInput.value.trim();

        if (!enteredPassword) {
            message.textContent = "Please enter the password.";
            return;
        }

        message.textContent = "Checking password...";

        try {
            const passwordHash = await hashPassword(enteredPassword);

            const { data, error } = await supabaseClient
                .from("test_access_codes")
                .select("*")
                .eq("test_id", testId)
                .eq("password_hash", passwordHash)
                .maybeSingle();

            if (error) {
                console.error("Supabase error:", error);
                message.textContent = "Unable to verify password.";
                return;
            }

            if (!data) {
                message.textContent = "Incorrect password.";
                return;
            }

            localStorage.setItem("access_" + testId, "true");

            window.location.href = selectedTest.page;

        } catch (error) {
            console.error("Password error:", error);
            message.textContent = "Something went wrong.";
        }
    }
</script>

</body>
</html>
