<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IELTS Practice Platform</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="Universal Education Logo">
        </a>

        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="login-page">

        <div class="login-container">

            <p class="small-heading">WELCOME BACK</p>

            <h1>Choose your login</h1>

            <p class="login-subtitle">
                Select how you would like to access the IELTS Practice Platform.
            </p>

            <div class="login-options">

                <!-- Student -->
                <a href="student-login.html" class="login-card student-card">

                    <div class="login-illustration">
                        <img src="assets/student.webp" alt="Student">
                    </div>

                    <h2>Student Login</h2>

                    <p>
                        Access practice tests and track your progress.
                    </p>

                    <span>Continue as Student →</span>

                </a>

                <!-- Faculty -->
                <a href="faculty-login.html" class="login-card faculty-card">

                    <div class="login-illustration">
                        <img src="assets/teacher.webp" alt="Faculty">
                    </div>

                    <h2>Faculty Login</h2>

                    <p>
                        Manage students, tests and writing reviews.
                    </p>

                    <span>Continue as Faculty →</span>

                </a>

            </div>

        </div>

    </main>

</body>
</html>
