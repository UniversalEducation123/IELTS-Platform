<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Writing Test Saved</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .writing-final-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 24px;
            padding-top: 20px;
        }

        .writing-final-card {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 50px 30px;
            text-align: center;
        }

        .writing-final-card h1 {
            margin: 0 0 16px;
            font-size: 30px;
        }

        .writing-final-card p {
            margin: 0 0 30px;
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        .writing-final-card .primary-btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
        }

        @media (max-width: 900px) {
            .writing-final-container {
                padding: 0 16px;
                margin: 40px auto;
            }

            .writing-final-card {
                padding: 40px 20px;
            }

            .writing-final-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>


<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="main-header">

        <div class="logo">
            IELTS Practice
        </div>

        <div class="header-right">

            <a href="../student-dashboard.html">
                Dashboard
            </a>

            <a href="../index.html">
                Logout
            </a>

        </div>

    </header>


    <!-- ================================
         FINAL MESSAGE
    ================================= -->

    <main class="writing-final-container">

        <section class="writing-final-card">

            <h1>
                Writing Test Saved Successfully
            </h1>

            <p>
                Your Writing Test 1 answers have been saved successfully.
            </p>

            <p> The faculty will check your test and update your results very soon. </p>

            <a
                href="../student-dashboard.html"
                class="primary-btn"
            >
                Back to Dashboard
            </a>

        </section>

    </main>

</body>

</html>
