<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - IELTS Practice</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="Universal Education Logo">
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="student-login.html" onclick="logout()">Logout</a>
        </nav>
    </header>

    <main class="dashboard-page">

        <div class="dashboard-container">

            <p class="small-heading">STUDENT PORTAL</p>

            <h1>Student Dashboard</h1>

            <p class="dashboard-subtitle">
                Welcome back. Choose a test to begin your practice.
            </p>

            <div class="dashboard-options">

                <!-- Listening Test -->
                <a
    href="test-1.html"
    class="dashboard-card"
    onclick="startFreshListeningTest()">

    <div class="dashboard-icon">🎧</div>

    <h2>Listening Test 1</h2>

    <p>
        Practice IELTS Academic Listening and check your score.
    </p>

    <span>Start Listening →</span>

</a>
                <!-- Reading Test -->
                <a href="reading/reading-test.html" class="dashboard-card">
                    <div class="dashboard-icon">📖</div>

                    <h2>Reading Test 1</h2>

                    <p>
                        Practice IELTS Academic Reading and check your score.
                    </p>

                    <span>Start Reading →</span>

                </a>

            </div>

        </div>

    </main>

    <script>
function startFreshListeningTest() {
    // Reset shared Listening timer
    sessionStorage.removeItem("listeningTimeLeft");
    sessionStorage.removeItem("listeningTimerStarted");

    // Reset saved answers
    sessionStorage.removeItem("listeningPart1Answers");
    sessionStorage.removeItem("listeningPart2Answers");
    sessionStorage.removeItem("listeningPart3Answers");
    sessionStorage.removeItem("listeningPart4Answers");

    // Reset pathname-based answer storage
    sessionStorage.removeItem(
        "listeningAnswers_/listening-test-1.html"
    );

    sessionStorage.removeItem(
        "listeningAnswers_/listening-test-2.html"
    );

    sessionStorage.removeItem(
        "listeningAnswers_/listening-test-3.html"
    );

    sessionStorage.removeItem(
        "listeningAnswers_/listening-test-4.html"
    );
}

function logout() {
    sessionStorage.removeItem("listeningTimeLeft");
    sessionStorage.removeItem("listeningTimerStarted");

    sessionStorage.removeItem("listeningPart1Answers");
    sessionStorage.removeItem("listeningPart2Answers");
    sessionStorage.removeItem("listeningPart3Answers");
    sessionStorage.removeItem("listeningPart4Answers");

    // Clear all Listening answer keys
    for (let i = sessionStorage.length - 1; i >= 0; i--) {
        const key = sessionStorage.key(i);

        if (key && key.startsWith("listeningAnswers_")) {
            sessionStorage.removeItem(key);
        }
    }
}

</script>

</body>
</html>
