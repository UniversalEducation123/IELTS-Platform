<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Test 2 Result</title>

    <style>
        * *{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:30px 15px;
    font-family:Arial,sans-serif;

    background:
        radial-gradient(circle at top left,
            rgba(139,154,110,.10),
            transparent 35%),
        radial-gradient(circle at bottom right,
            rgba(234,226,214,.55),
            transparent 35%),
        #F7F2EB;

    color:#4C4A46;
}

/* =====================================
   HEADER
===================================== */

.result-header{
    width:100%;
    max-width:900px;
    height:64px;
    margin:0 auto 24px;
    padding:0 22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,.72);
    backdrop-filter:blur(16px);

    border:1px solid #E7DED2;
    border-radius:16px;

    box-shadow:0 8px 20px rgba(76,74,70,.05);
}

.result-logo{
    font-size:20px;
    font-weight:700;
    color:#5F5B55;
}

.result-header-links{
    display:flex;
    align-items:center;
    gap:20px;
}

.result-header-links a{
    color:#6B6A63;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

.result-header-links a:hover{
    color:#8B9A6E;
}

/* =====================================
   RESULT CARD
===================================== */

.result-card{
    width:100%;
    max-width:750px;
    margin:auto;
    padding:40px 30px;

    background:rgba(255,255,255,.80);
    backdrop-filter:blur(14px);

    border:1px solid #ECE4D8;
    border-radius:24px;

    box-shadow:0 14px 34px rgba(76,74,70,.06);
}

h1{
    margin:0 0 30px;
    text-align:center;
    color:#5F5B55;
    font-size:32px;
}

h2{
    margin:40px 0 20px;
    color:#5F5B55;
    font-size:24px;
}

/* =====================================
   SCORE
===================================== */

.result-line{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:16px 5px;

    border-bottom:1px solid #ECE4D8;

    color:#5F5B55;
    font-size:18px;
}

.result-line span{
    font-weight:700;
    color:#72805A;
}

.band-line{
    margin-top:12px;
    padding-top:22px;

    border-top:2px solid #D9E2D0;
    font-size:21px;
}

.band-line span{
    font-size:26px;
    color:#72805A;
}

/* =====================================
   ANSWER REVIEW
===================================== */

.answer-review-section{
    margin-top:35px;
}

.answer-review-item{
    margin-bottom:14px;
    padding:16px;

    border-left:5px solid;
    border-radius:14px;
}

.answer-review-item.correct{
    background:#F4F7F1;
    border-left-color:#8B9A6E;
}

.answer-review-item.wrong{
    background:#FAF3F1;
    border-left-color:#A68C7A;
}

.review-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
}

.review-status{
    font-weight:700;
}

.correct .review-status{
    color:#72805A;
}

.wrong .review-status{
    color:#8D7564;
}

.answer-review-item p{
    margin:6px 0;
    color:#6B6A63;
    line-height:1.6;
}

.answer-review-item strong{
    color:#5F5B55;
}

/* =====================================
   BUTTON
===================================== */

.home-button{
    display:block;
    width:fit-content;

    margin:35px auto 0;
    padding:13px 28px;

    background:#8B9A6E;
    color:#FFFFFF;

    text-decoration:none;
    font-weight:600;

    border-radius:999px;
    transition:.25s;
}

.home-button:hover{
    background:#78885E;
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(139,154,110,.18);
}

/* =====================================
   MOBILE
===================================== */

@media (max-width:600px){

    body{
        padding:18px 12px;
    }

    .result-card{
        padding:30px 20px;
    }

    .result-header{
        height:auto;
        padding:16px;
        flex-direction:column;
        gap:12px;
    }

    h1{
        font-size:27px;
    }

    h2{
        font-size:21px;
    }

    .result-line{
        font-size:16px;
    }

    .review-header{
        flex-direction:column;
        gap:4px;
    }
}
        
    </style>
</head>

<body>

    <header class="result-header">

        <div class="result-logo">
            IELTS Practice

        <div class="result-header-links">

            </a>

                Logout
            </a>

        </div>

    </header>


    <div class="result-card">

        <h1>Listening Test 2 Result</h1>

        <div class="result-line">
            <strong>Correct Answers:</strong>
            <span id="correctAnswers">0</span>
        </div>

        <div class="result-line">
            <strong>Wrong Answers:</strong>
            <span id="wrongAnswers">0</span>
        </div>

        <div class="result-line">
            <strong>Total Score:</strong>
            <span id="totalScore">0 / 40</span>
        </div>

        <div class="result-line band-line">
            <strong>IELTS Band:</strong>
            <span id="bandScore">2.0</span>
        </div>

        <div class="answer-review-section">

            <h2>Answer Review</h2>

            <div id="answerReview"></div>

        </div>

        <a href="../submitted-tests.html" class="home-button">
            View Submitted Tests
        </a>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* ===============================
           SUPABASE CONNECTION
        =============================== */

        const SUPABASE_URL =
            "https://gehczgguwxqwfowmbedy.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* ===============================
           ANSWER NORMALIZATION
        =============================== */

        function normalizeAnswer(answer) {

            return String(answer || "")
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]/g, "");
        }


        function isCorrect(
            studentAnswer,
            acceptedAnswers
        ) {

            const student =
                normalizeAnswer(studentAnswer);

            if (!student) {
                return false;
            }

            return acceptedAnswers.some(
                function(answer) {

                    return student ===
                        normalizeAnswer(answer);

                }
            );
        }


        /* ===============================
           BAND SCORE
        =============================== */

        function calculateBand(correctCount) {

            if (correctCount >= 39) return "9.0";
            if (correctCount >= 37) return "8.5";
            if (correctCount >= 35) return "8.0";
            if (correctCount >= 32) return "7.5";
            if (correctCount >= 30) return "7.0";
            if (correctCount >= 26) return "6.5";
            if (correctCount >= 23) return "6.0";
            if (correctCount >= 18) return "5.5";
            if (correctCount >= 16) return "5.0";
            if (correctCount >= 13) return "4.5";
            if (correctCount >= 10) return "4.0";
            if (correctCount >= 8) return "3.5";
            if (correctCount >= 6) return "3.0";
            if (correctCount >= 4) return "2.5";

            return "2.0";
        }


        /* ===============================
           READ TEST 2 ANSWERS
        =============================== */

        function readTest2Answers() {

            const answers = {};

            for (
                let i = 1;
                i <= 40;
                i++
            ) {

                answers["q" + i] =
                    sessionStorage.getItem(
                        "listeningTest2_q" + i
                    ) || "";
            }

            /* ===============================
            QUESTION 1
            FIRST NAME + LAST NAME
            =============================== */

            const firstName =
                sessionStorage.getItem(
                    "listeningTest2_q1"
                ) || "";

            const lastName =
                sessionStorage.getItem(
                    "listeningTest2_q1_last"
                ) || "";

            answers.q1 =
                (firstName + " " + lastName)
                    .trim()
                    .replace(/\s+/g, " ");

            return answers;
        }


        /* ===============================
           ANSWER REVIEW
        =============================== */

        function addReviewItem(
            questionNumber,
            studentAnswer,
            correctAnswer,
            correct
        ) {

            const answerReview =
                document.getElementById(
                    "answerReview"
                );

            if (!answerReview) {
                return;
            }


            const reviewItem =
                document.createElement("div");


            reviewItem.className =
                correct
                    ? "answer-review-item correct"
                    : "answer-review-item wrong";


            const header =
                document.createElement("div");

            header.className =
                "review-header";


            const question =
                document.createElement("strong");

            question.textContent =
                "Question " +
                questionNumber;


            const status =
                document.createElement("span");

            status.className =
                "review-status";

            status.textContent =
                correct
                    ? "✓ Correct"
                    : "✗ Wrong";


            header.appendChild(question);
            header.appendChild(status);


            const yourAnswer =
                document.createElement("p");


            const yourLabel =
                document.createElement("strong");

            yourLabel.textContent =
                "Your answer: ";


            yourAnswer.appendChild(
                yourLabel
            );


            yourAnswer.appendChild(
                document.createTextNode(
                    studentAnswer &&
                    String(studentAnswer).trim() !== ""
                        ? studentAnswer
                        : "Not answered"
                )
            );


            const correctAnswerText =
                document.createElement("p");


            const correctLabel =
                document.createElement("strong");

            correctLabel.textContent =
                "Correct answer: ";


            correctAnswerText.appendChild(
                correctLabel
            );


            correctAnswerText.appendChild(
                document.createTextNode(
                    correctAnswer
                )
            );


            reviewItem.appendChild(header);

            reviewItem.appendChild(
                yourAnswer
            );

            reviewItem.appendChild(
                correctAnswerText
            );


            answerReview.appendChild(
                reviewItem
            );
        }


        /* ===============================
           TEST 2 ANSWER KEY
        =============================== */

        const answerKey = {

            q1: [
                "Andrew Sharpe"
            ],

            q2: [
                "Beaconsfield House"
            ],

            q3: [
                "0374 55793"
            ],

            q4: [
                "MH66G4"
            ],

            q5: [
                "credit card"
            ],

            q6: [
                "Gold Star"
            ],

            q7: [
                "Mid-winter"
            ],

            q8: [
                "16 January",
                "16th January",
                "January 16",
                "January 16th"
            ],

            q9: [
                "taxi"
            ],

            q10: [
                "bicycle"
            ],

            q11: [
                "D"
            ],

            q12: [
                "A"
            ],

            q13: [
                "C"
            ],

            q14: [
                "E"
            ],

            q15: [
                "E"
            ],

            q16: [
                "personal information"
            ],

            q17: [
                "skills"
            ],

            q18: [
                "general"
            ],

            q19: [
                "role-play"
            ],

            q20: [
                "video"
            ],

            q21: [
                "following the plan"
            ],

            q22: [
                "individual responsibilities"
            ],

            q23: [
                "advice service"
            ],

            q24: [
                "reference section"
            ],

            q25: [
                "methodology"
            ],

            q26: [
                "websites"
            ],

            q27: [
                "H"
            ],

            q28: [
                "B"
            ],

            q29: [
                "G"
            ],

            q30: [
                "E"
            ],

            q31: [
                "competition"
            ],

            q32: [
                "British Airways"
            ],

            q33: [
                "invented"
            ],

            q34: [
                "tides"
            ],

            q35: [
                "distilled water"
            ],

            q36: [
                "tension"
            ],

            q37: [
                "base cap"
            ],

            q38: [
                "A-frame"
            ],

            q39: [
                "rings"
            ],

            q40: [
                "boarding platform"
            ]

        };


        /* ===============================
           CALCULATE SCORE
        =============================== */

        async function calculateListeningScore() {

            const answers =
                readTest2Answers();


            let correctCount = 0;


            for (
                let i = 1;
                i <= 40;
                i++
            ) {

                const key =
                    "q" + i;


                const student =
                    answers[key] || "";


                const accepted =
                    answerKey[key] || [];


                const correct =
                    isCorrect(
                        student,
                        accepted
                    );


                if (correct) {
                    correctCount++;
                }


                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );
            }


            /* ===============================
               DISPLAY SCORE
            =============================== */

            const wrongCount =
                40 - correctCount;


            document.getElementById(
                "correctAnswers"
            ).textContent =
                correctCount;


            document.getElementById(
                "wrongAnswers"
            ).textContent =
                wrongCount;


            document.getElementById(
                "totalScore"
            ).textContent =
                correctCount +
                " / 40";


            document.getElementById(
                "bandScore"
            ).textContent =
                calculateBand(
                    correctCount
                );


            console.log(
                "FINAL LISTENING TEST 2 SCORE:",
                correctCount +
                " / 40"
            );


            /* ===============================
               SAVE RESULT
            =============================== */

            await saveResultToSupabase(
                correctCount
            );
        }


        /* ===============================
           SAVE RESULT TO SUPABASE
        =============================== */

        async function saveResultToSupabase(
            score
        ) {

            if (
                sessionStorage.getItem(
                    "listeningTest2ResultSaved"
                ) === "true"
            ) {

                console.log(
                    "Listening Test 2 result already saved."
                );

                return;
            }


            const studentId =
                sessionStorage.getItem(
                    "studentId"
                );


            const studentName =
                sessionStorage.getItem(
                    "studentName"
                );


            const resultData = {
                student_id:
                    studentId
                        ? Number(studentId)
                        : null,

                student_name:
                    studentName,

                test_name:
                    "Test 2",

                test_date:
                    new Date().toISOString().split("T")[0],

                listening_score:
                    score,

                is_submitted:
                    true
            };


            console.log(
                "Data being sent to Supabase:",
                resultData
            );


            const { error } =
                await supabaseClient
                    .from("test_results")
                    .insert(
                        resultData
                    );


            if (error) {

                console.error(
                    "Error saving Listening Test 2 result:",
                    error
                );

                return;
            }


            sessionStorage.setItem(
                "listeningTest2ResultSaved",
                "true"
            );


            console.log(
                "Listening Test 2 result saved successfully."
            );
        }


        /* ===============================
           START
        =============================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                calculateListeningScore();

            }
        );

    </script>

</body>
</html>
