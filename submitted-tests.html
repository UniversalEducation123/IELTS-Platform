<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submitted Tests</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * *{
    box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:Arial,sans-serif;
            color:#3f4b45;

            background:
                radial-gradient(circle at 12% 18%, rgba(216,139,168,.18), transparent 28%),
                radial-gradient(circle at 86% 14%, rgba(199,163,230,.16), transparent 24%),
                radial-gradient(circle at 84% 82%, rgba(140,183,155,.18), transparent 30%),
                linear-gradient(135deg,#fff8fa,#f6fbf7,#fbf8ff);
        }

        /* ---------- Header ---------- */

        header{
            position:sticky;
            top:0;
            z-index:100;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:18px 8%;

            background:rgba(255,255,255,.78);
            backdrop-filter:blur(18px);

            border-bottom:1px solid rgba(255,255,255,.7);
            box-shadow:0 8px 24px rgba(112,64,82,.06);
        }

        header h1{
            margin:0;
            font-size:24px;
            color:#704052;
        }

        .back-button{
            background:linear-gradient(
                135deg,
                rgba(216,139,168,.15),
                rgba(199,163,230,.15)
            );

            color:#8f5c96;
            border:1px solid rgba(199,163,230,.35);

            padding:10px 18px;
            border-radius:999px;

            font-weight:600;
            cursor:pointer;
            transition:.25s ease;
        }

        .back-button:hover{
            transform:translateY(-2px);
        }

        /* ---------- Layout ---------- */

        .container{
            max-width:1050px;
            margin:40px auto;
            padding:0 20px;
        }

        .student-heading{
            margin-bottom:30px;
        }

        .student-heading h2{
            margin:0 0 6px;
            color:#704052;
            font-size:34px;
        }

        .student-heading p{
            margin:0;
            color:#6d8075;
            font-size:16px;
        }

        /* ---------- Test Cards ---------- */

        .test-card{
            position:relative;
            overflow:hidden;

            background:rgba(255,255,255,.75);
            backdrop-filter:blur(14px);

            border:1px solid rgba(255,255,255,.85);
            border-radius:24px;

            padding:28px;
            margin-bottom:24px;

            box-shadow:0 14px 35px rgba(90,70,80,.08);
        }

        .test-card::before{
            content:"";
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:5px;

            background:linear-gradient(
                90deg,
                #d88ba8,
                #c7a3e6,
                #8cb79b
            );
        }

        .test-card h2{
            margin:0;
            color:#7d4b64;
            font-size:24px;
        }

        .test-date{
            margin:8px 0 24px;
            color:#7b8a82;
            font-size:14px;
        }

        /* ---------- Score Grid ---------- */

        .score-grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:18px;
        }

        .score-item{
            background:linear-gradient(
                180deg,
                rgba(255,255,255,.9),
                rgba(248,245,251,.95)
            );

            border:1px solid rgba(236,226,238,.9);
            border-radius:18px;

            padding:22px 18px;
            text-align:center;
        }

        .score-item strong{
            display:block;
            margin-bottom:10px;

            color:#8f5c96;
            font-size:14px;
            letter-spacing:.5px;
        }

        .score-item span{
            display:block;
            font-size:30px;
            font-weight:700;
            color:#704052;
        }

        .score-item small{
            display:block;
            margin-top:8px;
            color:#718071;
            font-size:13px;
        }

        /* ---------- Faculty Review ---------- */

        .faculty-review{
            margin-top:18px;
            padding-top:18px;
            border-top:1px solid #ece6ee;
            text-align:left;
        }

        .faculty-review-title{
            display:block;
            margin-bottom:12px;
            color:#8f5c96;
            font-size:16px;
        }

        .faculty-review p{
            margin:8px 0;
            line-height:1.6;
            color:#55645d;
        }

        .faculty-feedback-label{
            margin-top:14px !important;
            color:#704052;
        }

        .faculty-feedback-text{
            margin-top:4px !important;

            white-space:pre-wrap;
            overflow-wrap:break-word;
            word-break:normal;

            line-height:1.7;
            color:#65786e;
        }

        /* ---------- Status ---------- */

        .status{
            margin-top:18px;
            padding:14px 16px;

            border-radius:14px;

            background:linear-gradient(
                135deg,
                rgba(140,183,155,.12),
                rgba(199,163,230,.08)
            );

            color:#5f7468;
            font-size:14px;
        }

        /* ---------- Empty & Loading ---------- */

        .no-tests,
        .loading{
            background:rgba(255,255,255,.72);
            backdrop-filter:blur(12px);

            border-radius:20px;
            padding:45px;

            text-align:center;

            box-shadow:0 10px 25px rgba(90,70,80,.06);

            color:#718071;
        }

        /* ---------- Mobile ---------- */

        @media (max-width:700px){

            header{
                padding:16px 20px;
            }

            header h1{
                font-size:20px;
            }

            .student-heading h2{
                font-size:28px;
            }

            .score-grid{
                grid-template-columns:1fr;
            }

            .test-card{
                padding:22px;
            }

        }
    </style>
</head>

<body>

<header>

    <h1>Submitted Tests</h1>

    <button
        type="button"
        class="back-button"
        onclick="goBack()">
        ← Back to Dashboard
    </button>

</header>


<div class="container">

    <div class="student-heading">

        <h2 id="studentName">
            Student
        </h2>

        <p>
            Your submitted tests and results
        </p>

    </div>


    <div
        id="loadingMessage"
        class="loading">

        Loading your submitted tests...

    </div>


    <div
        id="testsContainer"
        style="display:none;">

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://gehczgguwxqwfowmbedy.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


function goBack() {

    window.location.href =
        "student-dashboard.html";

}


async function loadSubmittedTests() {

    const studentId =
        sessionStorage.getItem("studentId");

    const studentName =
        sessionStorage.getItem("studentName") ||
        "Student";


    if (!studentId) {

        window.location.href =
            "student-login.html";

        return;
    }


    document.getElementById("studentName").textContent =
        studentName;


    const { data, error } =
        await supabaseClient
            .from("test_results")
            .select("*")
            .eq("student_id", Number(studentId))
            .eq("is_submitted", true)
            .order("test_date", {
                ascending: false
            });


    if (error) {

        console.error(error);

        document.getElementById("loadingMessage").textContent =
            "Error loading your submitted tests: " +
            error.message;

        return;
    }


    const { data: writingSubmissions, error: writingError } =
        await supabaseClient
            .from("writing_submissions")
            .select("*")
            .eq("student_id", String(studentId))
            .order("submitted_at", {
                ascending: false
            });


    if (writingError) {

        console.error(writingError);

        document.getElementById("loadingMessage").textContent =
            "Error loading writing submissions: " +
            writingError.message;

        return;
    }


    document.getElementById("loadingMessage").style.display =
        "none";

    const testsContainer =
        document.getElementById("testsContainer");

    testsContainer.style.display =
        "block";


    if ((!data || data.length === 0) &&
        (!writingSubmissions || writingSubmissions.length === 0)) {

        testsContainer.innerHTML = `
            <div class="no-tests">
                You have not submitted any tests yet.
            </div>
        `;

        return;
    }


    testsContainer.innerHTML = "";


/* =================================
   GROUP RESULTS BY TEST
================================= */

const groupedTests = {};

if (data && data.length > 0) {

    data.forEach(result => {

        const testName =
            result.test_name || "Test";

        const testKey =
            testName.trim().toLowerCase();


        /* Create test group if it doesn't exist */

        if (!groupedTests[testKey]) {

            groupedTests[testKey] = {
                test_name: testName,
                test_date: result.test_date || null,
                listening_score: null,
                reading_score: null
            };

        }


        const test =
            groupedTests[testKey];


        /* Keep the available test date */

        if (!test.test_date && result.test_date) {

            test.test_date =
                result.test_date;

        }


        /* Combine Listening scores */

        if (
            result.listening_score !== null &&
            result.listening_score !== undefined
        ) {

            test.listening_score =
                result.listening_score;

        }


        /* Combine Reading scores */

        if (
            result.reading_score !== null &&
            result.reading_score !== undefined
        ) {

            test.reading_score =
                result.reading_score;

        }

    });

}


/* =================================
   DISPLAY ONE CARD PER TEST
================================= */

Object.values(groupedTests).forEach(result => {


    /* =================================
       FIND WRITING SUBMISSION
    ================================= */

    const writingTestId =
        "writing-" +
        result.test_name
            .toLowerCase()
            .replace(/\s+/g, "-");


    const writingSubmission =
        writingSubmissions &&
        writingSubmissions.find(
            submission =>
                submission.test_id ===
                writingTestId
        );


    /* =================================
       WRITING SCORE
    ================================= */

    const writingScore =
        writingSubmission &&
        writingSubmission.overall_score !== null &&
        writingSubmission.overall_score !== undefined
            ? writingSubmission.overall_score
            : "Awaiting review";


    /* =================================
       WRITING STATUS
    ================================= */

    const statusText =
        writingSubmission
            ? (
                writingSubmission.status === "reviewed"
                    ? "Writing reviewed"
                    : "Writing submitted"
            )
            : "Writing not submitted";


    /* =================================
       LISTENING
    ================================= */

    const listeningSubmitted =
        result.listening_score !== null &&
        result.listening_score !== undefined;


    const listeningBand =
        listeningSubmitted
            ? getListeningBand(
                result.listening_score
            )
            : "Not submitted";


    /* =================================
       READING
    ================================= */

    const readingSubmitted =
        result.reading_score !== null &&
        result.reading_score !== undefined;


    const readingBand =
        readingSubmitted
            ? getReadingBand(
                result.reading_score
            )
            : "Not submitted";


    /* =================================
       CREATE TEST CARD
    ================================= */

    testsContainer.innerHTML += `

        <div class="test-card">

            <h2>
                ${escapeHTML(
                    result.test_name || "Test"
                )}
            </h2>


            <p class="test-date">

                Test Date:

                ${
                    result.test_date
                        ? new Date(
                            result.test_date +
                            "T00:00:00"
                        ).toLocaleDateString()
                        : "Not available"
                }

            </p>


            <div class="score-grid">


                <!-- =========================
                     LISTENING
                ========================== -->

                <div class="score-item">

                    <strong>
                        Listening
                    </strong>

                    <span>
                        ${listeningBand}
                    </span>

                    <small>
                        ${
                            listeningSubmitted
                                ? result.listening_score +
                                  " / 40"
                                : ""
                        }
                    </small>

                </div>


                <!-- =========================
                     READING
                ========================== -->

                <div class="score-item">

                    <strong>
                        Reading
                    </strong>

                    <span>
                        ${readingBand}
                    </span>

                    <small>
                        ${
                            readingSubmitted
                                ? result.reading_score +
                                  " / 40"
                                : ""
                        }
                    </small>

                </div>


                <!-- =========================
                     WRITING
                ========================== -->

                <div class="score-item">

                    <strong>
                        Writing
                    </strong>

                    <span>
                        ${writingScore}
                    </span>

                    <small>
                        ${statusText}
                    </small>


                    ${
                        writingSubmission &&
                        writingSubmission.status === "reviewed"

                            ? `

                                <div
                                    class="faculty-review"
                                >

                                    <strong
                                        class="faculty-review-title"
                                    >
                                        Faculty Review
                                    </strong>


                                    <p>

                                        <b>Task 1:</b>

                                        ${
                                            writingSubmission.task1_score !== null &&
                                            writingSubmission.task1_score !== undefined
                                                ? writingSubmission.task1_score
                                                : "Not scored"
                                        }

                                    </p>


                                    <p>

                                        <b>Task 2:</b>

                                        ${
                                            writingSubmission.task2_score !== null &&
                                            writingSubmission.task2_score !== undefined
                                                ? writingSubmission.task2_score
                                                : "Not scored"
                                        }

                                    </p>


                                    <p
                                        class="faculty-feedback-label"
                                    >
                                        <b>
                                            Faculty Feedback:
                                        </b>
                                    </p>


                                   <p class="faculty-feedback-text">${
                                        writingSubmission.faculty_feedback
                                            ? escapeHTML(writingSubmission.faculty_feedback)
                                            : "No feedback provided."
                                    }</p>

                                </div>

                            `

                            : ""
                    }

                </div>

            </div>

        </div>

    `;

});

    if (writingSubmissions &&
        writingSubmissions.length > 0 &&
        (!data || data.length === 0)) {

        writingSubmissions.forEach(submission => {

            testsContainer.innerHTML += `

                <div class="test-card">

                    <h2>
                        Writing Test 1
                    </h2>

                    <p class="test-date">
                        Submitted:
                        ${
                            submission.submitted_at
                                ? new Date(
                                    submission.submitted_at
                                ).toLocaleString()
                                : "Not available"
                        }
                    </p>


                    <div class="score-grid">

                        <div class="score-item">

                            <strong>
                                Task 1
                            </strong>

                            <span>
                                ${
                                    submission.task1_score !== null
                                        ? submission.task1_score
                                        : "Awaiting review"
                                }
                            </span>

                        </div>


                        <div class="score-item">

                            <strong>
                                Task 2
                            </strong>

                            <span>
                                ${
                                    submission.task2_score !== null
                                        ? submission.task2_score
                                        : "Awaiting review"
                                }
                            </span>

                        </div>


                        <div class="score-item">

                            <strong>
                                Overall
                            </strong>

                            <span>
                                ${
                                    submission.overall_score !== null
                                        ? submission.overall_score
                                        : "Awaiting review"
                                }
                            </span>

                        </div>

                    </div>


                    <div class="status">

                        ${
                            submission.status === "reviewed"
                                ? "Faculty has reviewed your writing."
                                : "Your writing has been submitted and is awaiting faculty review."
                        }

                    </div>

                </div>

            `;

        });

    }

}

function getListeningBand(score) {

    if (score >= 39) return "9.0";
    if (score >= 37) return "8.5";
    if (score >= 35) return "8.0";
    if (score >= 32) return "7.5";
    if (score >= 30) return "7.0";
    if (score >= 26) return "6.5";
    if (score >= 23) return "6.0";
    if (score >= 18) return "5.5";
    if (score >= 16) return "5.0";
    if (score >= 13) return "4.5";
    if (score >= 11) return "4.0";
    if (score >= 9) return "3.5";
    if (score >= 7) return "3.0";
    if (score >= 5) return "2.5";
    if (score >= 1) return "2.0";

    return "0.0";
}


function getReadingBand(score) {

    if (score >= 39) return "9.0";
    if (score >= 37) return "8.5";
    if (score >= 35) return "8.0";
    if (score >= 32) return "7.5";
    if (score >= 30) return "7.0";
    if (score >= 26) return "6.5";
    if (score >= 23) return "6.0";
    if (score >= 18) return "5.5";
    if (score >= 16) return "5.0";
    if (score >= 13) return "4.5";
    if (score >= 11) return "4.0";
    if (score >= 9) return "3.5";
    if (score >= 7) return "3.0";
    if (score >= 5) return "2.5";
    if (score >= 1) return "2.0";

    return "0.0";
}



function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadSubmittedTests();

</script>

</body>
</html>
