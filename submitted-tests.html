<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submitted Tests</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* **{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#5F6558;
    background:#F7F2EB;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 8%;
    background:rgba(247,242,235,.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid #E3DCD1;
}

header h1{
    margin:0;
    font-size:24px;
    color:#4C4A46;
}

.back-button{
    padding:10px 18px;
    background:#FFFFFF;
    color:#4C4A46;
    border:1px solid #E3DCD1;
    border-radius:999px;
    font-weight:600;
    cursor:pointer;
    transition:.25s ease;
}

.back-button:hover{
    background:#EAE2D6;
    transform:translateY(-1px);
}

.container{
    max-width:1050px;
    margin:40px auto;
    padding:0 20px;
}

.student-heading{
    margin-bottom:30px;
}

.student-heading h2{
    margin:0 0 8px;
    font-size:34px;
    color:#4C4A46;
}

.student-heading p{
    margin:0;
    color:#7A7E74;
    font-size:16px;
}

.test-card{
    background:#FFFFFF;
    border:1px solid #E3DCD1;
    border-radius:18px;
    padding:28px;
    margin-bottom:24px;
    box-shadow:0 8px 22px rgba(76,74,70,.05);
    position:relative;
}

.test-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:4px;
    background:#8B9A6E;
    border-radius:18px 18px 0 0;
}

.test-card h2{
    margin:0;
    font-size:24px;
    color:#4C4A46;
}

.test-date{
    margin:8px 0 24px;
    color:#8A9085;
    font-size:14px;
}

.score-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
}

.score-item{
    background:#F4EFE7;
    border:1px solid #E3DCD1;
    border-radius:14px;
    padding:20px 16px;
    text-align:center;
}

.score-item strong{
    display:block;
    margin-bottom:8px;
    color:#7A7E74;
    font-size:13px;
    font-weight:600;
    letter-spacing:.3px;
}

.score-item span{
    display:block;
    font-size:30px;
    font-weight:700;
    color:#4C4A46;
}

.score-item small{
    display:block;
    margin-top:6px;
    color:#8A9085;
    font-size:12px;
}

.faculty-review{
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid #ECE5DA;
    text-align:left;
}

.faculty-review-title{
    display:block;
    margin-bottom:12px;
    color:#8B9A6E;
    font-size:16px;
    font-weight:700;
}

.faculty-review p{
    margin:8px 0;
    line-height:1.7;
    color:#5F6558;
}

.faculty-feedback-label{
    margin-top:14px !important;
    color:#4C4A46;
    font-weight:700;
}

.faculty-feedback-text{
    margin-top:4px !important;
    white-space:pre-wrap;
    overflow-wrap:break-word;
    color:#66635E;
    line-height:1.8;
}

.status{
    margin-top:18px;
    padding:14px 16px;
    background:#EEF3E8;
    border:1px solid #D8E2CC;
    border-radius:12px;
    color:#66725D;
    font-size:14px;
}

.no-tests,
.loading{
    background:#FFFFFF;
    border:1px solid #E3DCD1;
    border-radius:18px;
    padding:45px;
    text-align:center;
    color:#7A7E74;
    box-shadow:0 8px 20px rgba(76,74,70,.04);
}

.review-pdf-btn{
    display:inline-block;
    margin-top:14px;
    padding:10px 16px;

    background:#8B9A6E;
    color:#fff;

    border-radius:8px;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.review-pdf-btn:hover{
    background:#78875D;
}

.view-pdf-button{
    margin-top:14px;
    width:100%;
    padding:12px;
    background:#8B9A6E;
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}

.view-pdf-button:hover{
    background:#78875D;
}

.answer-review-button{
    margin-top:14px;
    width:100%;
    padding:12px;

    background:#FFFFFF;
    color:#6F7B57;
    border:1px solid #8B9A6E;
    border-radius:10px;

    font-weight:600;
    cursor:pointer;
    transition:.25s ease;
}

.answer-review-button:hover{
    background:#F4F6F1;
    transform:translateY(-1px);
}

.answer-review-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;

    background:rgba(76,74,70,.45);
    backdrop-filter:blur(5px);
    padding:30px 16px;
    overflow-y:auto;
}

.answer-review-modal-content{
    width:100%;
    max-width:760px;
    margin:20px auto;

    background:#FFFFFF;
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 50px rgba(76,74,70,.18);
}

.answer-review-modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;

    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid #E3DCD1;
}

.answer-review-modal-header h2{
    margin:0;
    color:#4C4A46;
}

.close-review-button{
    width:40px;
    height:40px;

    border:none;
    border-radius:50%;
    background:#F4EFE7;
    color:#4C4A46;

    font-size:22px;
    cursor:pointer;
}

.close-review-button:hover{
    background:#EAE2D6;
}

.saved-review-item{
    margin-bottom:14px;
    padding:16px 18px;
    border-left:4px solid;
    border-radius:14px;
}

.saved-review-item.correct{
    background:#F4F6F1;
    border-left-color:#8B9A6E;
}

.saved-review-item.wrong{
    background:#FBF8F4;
    border-left-color:#B09A7D;
}

.saved-review-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
}

.saved-review-status{
    font-weight:700;
    font-size:14px;
}

.saved-review-item.correct .saved-review-status{
    color:#6F7B57;
}

.saved-review-item.wrong .saved-review-status{
    color:#9B8568;
}

.saved-review-item p{
    margin:6px 0;
    color:#5F5B55;
    line-height:1.6;
}

.saved-review-item strong{
    color:#4C4A46;
}

@media (max-width:700px){

    .answer-review-modal-content{
        padding:22px;
        margin:10px auto;
    }

    .saved-review-header{
        flex-direction:column;
        align-items:flex-start;
    }

}

@media (max-width:700px){

    header{
        padding:16px 20px;
    }

    header h1{
        font-size:20px;
    }

    .student-heading h2{
        font-size:28px;
    }

    .score-grid{
        grid-template-columns:1fr;
    }

    .test-card{
        padding:22px;
    }

    .container{
        padding:0 16px;
    }

}
    </style>
</head>

<body>

<header>

    <h1>Submitted Tests</h1>

    <button
        type="button"
        class="back-button"
        onclick="goBack()">
        ← Back to Dashboard
    </button>

</header>

<div
    id="answerReviewModal"
    class="answer-review-modal"
    onclick="closeReviewOnBackground(event)">

    <div class="answer-review-modal-content">

        <div class="answer-review-modal-header">

            <h2> Reading Answer Review </h2>

            <button
                type="button"
                class="close-review-button"
                onclick="closeReadingReview()">
                ×
            </button>

        </div>

        <div id="savedReadingReviewContainer"></div>

    </div>

</div>

<div class="container">

    <div class="student-heading">

        <h2 id="studentName"> Student </h2>

        <p> Your submitted tests and results </p>

    </div>


    <div
        id="loadingMessage"
        class="loading">

        Loading your submitted tests...

    </div>


    <div
        id="testsContainer"
        style="display:none;">

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://gehczgguwxqwfowmbedy.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


function goBack() {

    window.location.href =
        "student-dashboard.html";

}

async function viewReviewedPDF(pdfPath){

    const { data, error } = await supabaseClient
        .storage
        .from("checked-writing-pdfs")
        .createSignedUrl(pdfPath, 300);

    if(error){
        alert("Reviewed PDF not found.");
        return;
    }

    window.open(data.signedUrl, "_blank");

}

function viewReadingReview(review) {

    const modal =
        document.getElementById("answerReviewModal");

    const container =
        document.getElementById(
            "savedReadingReviewContainer"
        );

    if (!modal || !container) {
        return;
    }

    container.innerHTML = "";

    /* =====================================
       QUESTIONS 1–19
    ===================================== */

    for (let i = 1; i <= 19; i++) {

        const item =
            review["q" + i];

        if (!item) continue;

        addSavedReadingReviewItem(
            container,
            i,
            item
        );
    }


    /* =====================================
       QUESTIONS 20–21
    ===================================== */

    const pairItem =
        review.q20 || review.q21;

    if (pairItem) {

        const userAnswers =
            Array.isArray(pairItem.userAnswer)
                ? pairItem.userAnswer
                : [];

        const correctAnswers =
            Array.isArray(pairItem.correctAnswer)
                ? pairItem.correctAnswer
                : [];

        // Use the saved result from the actual
        // Reading Test instead of recalculating it.
        const pairMarks =
            pairItem.score ?? 0;

        const pairTotal =
            pairItem.total ?? 2;

        const pairCorrect =
            pairItem.isCorrect === true;

        const pairStatus =
            pairItem.status ||
            (
                pairMarks === pairTotal
                    ? "correct"
                    : pairMarks > 0
                        ? "partial"
                        : "wrong"
            );

        const reviewItem =
            document.createElement("div");

        reviewItem.className =
            "saved-review-item " +
            (
                pairCorrect
                    ? "correct"
                    : "wrong"
            );

        let statusText = "";

        if (pairStatus === "correct") {

            statusText =
                "✓ " +
                pairMarks +
                "/" +
                pairTotal +
                " marks";

        } else if (pairStatus === "partial") {

            statusText =
                "◐ " +
                pairMarks +
                "/" +
                pairTotal +
                " marks";

        } else {

            statusText =
                "✗ " +
                pairMarks +
                "/" +
                pairTotal +
                " marks";
        }

        reviewItem.innerHTML = `
            <div class="saved-review-header">

                <strong>
                    Questions 20–21
                </strong>

                <span class="saved-review-status">
                    ${statusText}
                </span>

            </div>

            <p>
                <strong>Your answer:</strong>
                ${
                    userAnswers.length > 0
                        ? escapeHTML(
                            userAnswers.join(", ")
                          )
                        : "Not answered"
                }
            </p>

            <p>
                <strong>Correct answer:</strong>
                ${
                    escapeHTML(
                        correctAnswers.join(" / ")
                    )
                }
            </p>
        `;

        container.appendChild(reviewItem);
    }


    /* =====================================
       QUESTIONS 22–40
    ===================================== */

    for (let i = 22; i <= 40; i++) {

        const item =
            review["q" + i];

        if (!item) continue;

        addSavedReadingReviewItem(
            container,
            i,
            item
        );
    }


    modal.style.display = "block";

    document.body.style.overflow = "hidden";
}


function normalizeAnswer(answer) {

    return String(answer || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]/g, "");

}


function addSavedReadingReviewItem(
    container,
    questionNumber,
    item
) {

    if (!item) {
        return;
    }

    const userAnswer =
        item.userAnswer;

    const correctAnswer =
        item.correctAnswer;

    // Use the verdict saved by the actual Reading test.
    // Do not recalculate correctness here.
    const isCorrect =
        item.isCorrect === true;

    const displayedUserAnswer =
        Array.isArray(userAnswer)
            ? userAnswer.join(", ") || "Not answered"
            : userAnswer || "Not answered";

    const displayedCorrectAnswer =
        Array.isArray(correctAnswer)
            ? correctAnswer.join(" / ")
            : correctAnswer;

    const reviewItem =
        document.createElement("div");

    reviewItem.className =
        "saved-review-item " +
        (
            isCorrect
                ? "correct"
                : "wrong"
        );

    reviewItem.innerHTML = `

        <div class="saved-review-header">

            <strong>
                Question ${escapeHTML(questionNumber)}
            </strong>

            <span class="saved-review-status">

                ${
                    isCorrect
                        ? "✓ Correct"
                        : "✗ Incorrect"
                }

            </span>

        </div>

        <p>
            <strong>Your answer:</strong>
            ${escapeHTML(displayedUserAnswer)}
        </p>

        <p>
            <strong>Correct answer:</strong>
            ${escapeHTML(displayedCorrectAnswer)}
        </p>

    `;

    container.appendChild(reviewItem);
}


function viewListeningReview(review) {

    const modal =
        document.getElementById("answerReviewModal");

    const container =
        document.getElementById(
            "savedReadingReviewContainer"
        );

    if (!modal || !container) {
        return;
    }

    const modalTitle =
        modal.querySelector(
            ".answer-review-modal-header h2"
        );

    if (modalTitle) {
        modalTitle.textContent =
            "Listening Answer Review";
    }

    container.innerHTML = "";

    Object.keys(review).forEach(function(key) {

        const item = review[key];

        if (!item) {
            return;
        }

        const questionNumber =
            key.replace("q", "");

        const userAnswer =
            item.userAnswer;

        const correctAnswer =
            item.correctAnswer;

        // Use the final verdict saved by the test result page.
        // Do not recalculate it here.
        const isCorrect =
            item.isCorrect === true;

        const displayedUserAnswer =
            Array.isArray(userAnswer)
                ? userAnswer.join(", ") || "Not answered"
                : userAnswer || "Not answered";

        const displayedCorrectAnswer =
            Array.isArray(correctAnswer)
                ? correctAnswer.join(" / ")
                : correctAnswer;

        const reviewItem =
            document.createElement("div");

        reviewItem.className =
            "saved-review-item " +
            (
                isCorrect
                    ? "correct"
                    : "wrong"
            );

        reviewItem.innerHTML = `

            <div class="saved-review-header">

                <strong>
                    Question ${escapeHTML(questionNumber)}
                </strong>

                <span class="saved-review-status">

                    ${
                        isCorrect
                            ? "✓ Correct"
                            : "✗ Incorrect"
                    }

                </span>

            </div>

            <p>
                <strong>Your answer:</strong>
                ${escapeHTML(displayedUserAnswer)}
            </p>

            <p>
                <strong>Correct answer:</strong>
                ${escapeHTML(displayedCorrectAnswer)}
            </p>

        `;

        container.appendChild(reviewItem);
    });

    modal.style.display = "block";

    document.body.style.overflow = "hidden";
}


function closeReadingReview() {

    const modal =
        document.getElementById(
            "answerReviewModal"
        );

    if (modal) {
        modal.style.display = "none";
    }

    document.body.style.overflow = "";
}


function closeReviewOnBackground(event) {

    if (
        event.target &&
        event.target.id ===
            "answerReviewModal"
    ) {
        closeReadingReview();
    }

}

async function loadSubmittedTests() {

    const studentId =
        sessionStorage.getItem("studentId");

    const studentName =
        sessionStorage.getItem("studentName") ||
        "Student";


    if (!studentId) {

        window.location.href =
            "student-login.html";

        return;
    }


    document.getElementById("studentName").textContent =
        studentName;


    const { data, error } =
        await supabaseClient
            .from("test_results")
            .select("*")
            .eq("student_id", Number(studentId))
            .eq("is_submitted", true)
            .order("test_date", {
                ascending: false
            });


    if (error) {

        console.error(error);

        document.getElementById("loadingMessage").textContent =
            "Error loading your submitted tests: " +
            error.message;

        return;
    }


    const { data: writingSubmissions, error: writingError } =
        await supabaseClient
            .from("writing_submissions")
            .select("*")
            .eq("student_id", String(studentId))
            .order("submitted_at", {
                ascending: false
            });


    if (writingError) {

        console.error(writingError);

        document.getElementById("loadingMessage").textContent =
            "Error loading writing submissions: " +
            writingError.message;

        return;
    }


    document.getElementById("loadingMessage").style.display =
        "none";

    const testsContainer =
        document.getElementById("testsContainer");

    testsContainer.style.display =
        "block";


    if ((!data || data.length === 0) &&
        (!writingSubmissions || writingSubmissions.length === 0)) {

        testsContainer.innerHTML = `
            <div class="no-tests">
                You have not submitted any tests yet.
            </div>
        `;

        return;
    }


    testsContainer.innerHTML = "";


/* =================================
   GROUP RESULTS BY TEST
================================= */

const groupedTests = {};

if (data && data.length > 0) {

    data.forEach(result => {

    const testName =
        result.test_name || "Test";

    const normalizedTestName =
        testName.trim().toLowerCase();

    const isGTStudent =
        normalizedTestName.startsWith("gt ") ||
        normalizedTestName.includes("general training");

    // Combine GT Reading Test 1 with Test 1 only.
    const testKey =
        isGTStudent &&
        normalizedTestName === "gt reading test 1"
            ? "test 1"
            : normalizedTestName;

    const displayTestName =
        testKey === "test 1"
            ? "Test 1"
            : testName;


        /* Create test group if it doesn't exist */
        if (!groupedTests[testKey]) {

           groupedTests[testKey] = {
                test_name: displayTestName,
                test_date: result.test_date || null,

                listening_score: null,
                listening_answers: null,

                reading_score: null,
                reading_answers: null,

                speaking_score: null,
                final_mock_score: null
            };

        }


        const test =
            groupedTests[testKey];


        /* Keep the available test date */

        if (!test.test_date && result.test_date) {

            test.test_date =
                result.test_date;

        }


        /* Combine Listening scores */

        if (
            result.listening_score !== null &&
            result.listening_score !== undefined
        ) {

            test.listening_score =
                result.listening_score;

        }

        if (
            result.listening_answers !== null &&
            result.listening_answers !== undefined
        ) {
            test.listening_answers =
                result.listening_answers;
        }

        if (
            result.listening_answers !== null &&
            result.listening_answers !== undefined
        ) {

            test.listening_answers =
                result.listening_answers;

        }


        /* Combine Reading scores */

        if (
            result.reading_score !== null &&
            result.reading_score !== undefined
        ) {

            test.reading_score =
                result.reading_score;

        }

        if (
            result.reading_answers !== null &&
            result.reading_answers !== undefined
        ) {

            test.reading_answers =
                result.reading_answers;

        }

        /* Combine Speaking score */

        if (
            result.speaking_score !== null &&
            result.speaking_score !== undefined
        ) {

            test.speaking_score =
                result.speaking_score;

        }


        /* Combine Final Mock score */

        if (
            result.final_mock_score !== null &&
            result.final_mock_score !== undefined
        ) {

            test.final_mock_score =
                result.final_mock_score;

        }

    });

}


/* =================================
   DISPLAY ONE CARD PER TEST
================================= */

Object.values(groupedTests).forEach(result => {


    /* =================================
       FIND WRITING SUBMISSION
    ================================= */

    const writingTestId =
        "writing-" +
        result.test_name
            .toLowerCase()
            .replace(/\s+/g, "-");


    const writingSubmission =
        writingSubmissions &&
        writingSubmissions.find(
            submission =>
                submission.test_id ===
                writingTestId
        );


    /* =================================
       WRITING SCORE
    ================================= */

    const writingScore =
        writingSubmission &&
        writingSubmission.overall_score !== null &&
        writingSubmission.overall_score !== undefined
            ? writingSubmission.overall_score
            : "Awaiting review";


    /* =================================
       WRITING STATUS
    ================================= */

    const statusText =
        writingSubmission
            ? (
                writingSubmission.status === "reviewed"
                    ? "Writing reviewed"
                    : "Writing submitted"
            )
            : "Writing not submitted";


    /* =================================
       LISTENING
    ================================= */

    const listeningSubmitted =
        result.listening_score !== null &&
        result.listening_score !== undefined;


    const listeningBand =
        listeningSubmitted
            ? getListeningBand(
                result.listening_score
            )
            : "Not submitted";


    /* =================================
       READING
    ================================= */

    const readingSubmitted =
        result.reading_score !== null &&
        result.reading_score !== undefined;


    const readingBand =
        readingSubmitted
            ? getReadingBand(
                result.reading_score
            )
            : "Not submitted";

    /* =================================
    SPEAKING
    ================================= */

    const speakingSubmitted =
        result.speaking_score !== null &&
        result.speaking_score !== undefined;

    const speakingBand =
        speakingSubmitted
            ? Number(result.speaking_score).toFixed(1)
            : "Pending";


    /* =================================
    FINAL MOCK
    ================================= */

    const finalMockSubmitted =
        result.final_mock_score !== null &&
        result.final_mock_score !== undefined;

    const finalMockScore =
        finalMockSubmitted
            ? Number(result.final_mock_score).toFixed(1)
            : "Pending";
            
    /* =================================
       CREATE TEST CARD
    ================================= */

    testsContainer.innerHTML += `

        <div class="test-card">

            <h2>
                ${escapeHTML(
                    result.test_name || "Test"
                )}
            </h2>


            <p class="test-date">

                Test Date:

                ${
                    result.test_date
                        ? new Date(
                            result.test_date +
                            "T00:00:00"
                        ).toLocaleDateString()
                        : "Not available"
                }

            </p>


            <div class="score-grid">

    <!-- =========================
         LISTENING
    ========================== -->

    <div class="score-item">

        <strong>
            Listening
        </strong>

        <span>
            ${listeningBand}
        </span>

        <small>
            ${
                listeningSubmitted
                    ? result.listening_score + " / 40"
                    : ""
            }
        </small>

        ${
            listeningSubmitted &&
            result.listening_answers

                    <button
                        type="button"
                        class="answer-review-button"
                        onclick="viewListeningReview(${escapeHTML(JSON.stringify(result.listening_answers))})">
                        View Answer Review

                `

        }

        </div>


    <!-- =========================
         READING
    ========================== -->

    <div class="score-item">

        <strong>
            Reading
        </strong>

        <span>
            ${readingBand}
        </span>

        <small>
            ${
                readingSubmitted
                    ? result.reading_score + " / 40"
                    : ""
            }
        </small>

        ${
            readingSubmitted &&
            result.reading_answers
                ? `
                    <button
                        type="button"
                        class="answer-review-button"
                        onclick='viewReadingReview(${JSON.stringify(result.reading_answers)})'>
                        View Answer Review
                    </button>
                `
                : ""
        }

    </div>


    <!-- =========================
         WRITING
    ========================== -->

    <div class="score-item">

        <strong>
            Writing
        </strong>

        <span>
            ${writingScore}
        </span>

        <small>
            ${statusText}
        </small>


        ${
            writingSubmission &&
            writingSubmission.status === "reviewed"

                ? `

                    <div class="faculty-review">

                        <strong class="faculty-review-title">
                            Faculty Review
                        </strong>

                        <p>
                            <b>Task 1:</b>
                            ${
                                writingSubmission.task1_score !== null &&
                                writingSubmission.task1_score !== undefined
                                    ? writingSubmission.task1_score

                        </p>

                        <p>
                            <b>Task 2:</b>
                            ${
                                writingSubmission.task2_score !== null &&
                                writingSubmission.task2_score !== undefined
                                    ? writingSubmission.task2_score
                                    : "Not scored"
                            }
                        </p>

                        <p class="faculty-feedback-label">
                            <b>Faculty Feedback:</b>
                        </p>

                        <p class="faculty-feedback-text">
                            ${
                                writingSubmission.faculty_feedback
                                    ? escapeHTML(
                                        writingSubmission.faculty_feedback
                                      )
                                    : "No feedback provided."
                            }
                        </p>

                        ${
                            writingSubmission.checked_pdf
                                ? `
                                    <a
                                        href="#"
                                        class="review-pdf-btn"
                                        onclick="viewReviewedPDF('${writingSubmission.checked_pdf}'); return false;">
                                        📄 View Reviewed PDF
                                    </a>
                                `
                                : ""
                        }

                    </div>

                `
                : ""
        }

    </div>


    <!-- =========================
         SPEAKING
    ========================== -->

    <div class="score-item">

        <strong>
            Speaking
        </strong>

        <span>
            ${speakingBand}
        </span>

        <small>
            ${
                speakingSubmitted
                    ? "Score entered"
                    : "Awaiting faculty score"
            }
        </small>

    </div>


    <!-- =========================
         FINAL MOCK
    ========================== -->

    <div class="score-item">

        <strong>
            Final Mock
        </strong>

        <span>
            ${finalMockScore}
        </span>

        <small>
            ${
                finalMockSubmitted
                    ? "All 4 sections complete"
                    : "Pending"
            }
        </small>

    </div>

</div>

            </div>

        </div>

    `;

});

    if (writingSubmissions &&
        writingSubmissions.length > 0 &&
        (!data || data.length === 0)) {

        writingSubmissions.forEach(submission => {

            testsContainer.innerHTML += `

                <div class="test-card">

                    <h2>
                        Writing Test 1
                    </h2>

                    <p class="test-date">
                        Submitted:
                        ${
                            submission.submitted_at
                                ? new Date(
                                    submission.submitted_at
                                ).toLocaleString()
                                : "Not available"
                        }
                    </p>


                    <div class="score-grid">

                        <div class="score-item">

                            <strong>
                                Task 1
                            </strong>

                            <span>
                                ${
                                    submission.task1_score !== null
                                        ? submission.task1_score
                                        : "Awaiting review"
                                }
                            </span>

                        </div>


                        <div class="score-item">

                            <strong>
                                Task 2
                            </strong>

                            <span>
                                ${
                                    submission.task2_score !== null
                                        ? submission.task2_score
                                        : "Awaiting review"
                                }
                            </span>

                        </div>


                        <div class="score-item">

                            <strong>
                                Overall
                            </strong>

                            <span>
                                ${
                                    submission.overall_score !== null
                                        ? submission.overall_score
                                        : "Awaiting review"
                                }
                            </span>

                        </div>

                    </div>


                    <div class="status">

                        ${
                            submission.status === "reviewed"
                                ? "Faculty has reviewed your writing."
                                : "Your writing has been submitted and is awaiting faculty review."
                        }

                    </div>

                    ${
                        submission.status === "reviewed" &&
                        submission.checked_pdf
                            ? `
                            <button
                                class="view-pdf-button"
                                onclick="viewCheckedPDF('${submission.checked_pdf}')">
                                View Checked PDF
                            </button>
                            `
                            : ""
                    }

                </div>

            `;

        });

    }

}

function getListeningBand(score) {

    if (score >= 39) return "9.0";
    if (score >= 37) return "8.5";
    if (score >= 35) return "8.0";
    if (score >= 32) return "7.5";
    if (score >= 30) return "7.0";
    if (score >= 26) return "6.5";
    if (score >= 23) return "6.0";
    if (score >= 18) return "5.5";
    if (score >= 16) return "5.0";
    if (score >= 13) return "4.5";
    if (score >= 10) return "4.0";
    if (score >= 8) return "3.5";
    if (score >= 6) return "3.0";
    if (score >= 4) return "2.5";

    return "0.0";
}


function getReadingBand(score) {

    if (score >= 39) return "9.0";
    if (score >= 37) return "8.5";
    if (score >= 35) return "8.0";
    if (score >= 33) return "7.5";
    if (score >= 30) return "7.0";
    if (score >= 27) return "6.5";
    if (score >= 23) return "6.0";
    if (score >= 19) return "5.5";
    if (score >= 15) return "5.0";
    if (score >= 13) return "4.5";
    if (score >= 10) return "4.0";
    if (score >= 8) return "3.5";
    if (score >= 6) return "3.0";
    if (score >= 4) return "2.5";

    return "0.0";
}



function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

async function viewCheckedPDF(pdfPath) {

    const { data, error } = await supabaseClient
        .storage
        .from("checked-writing-pdfs")
        .createSignedUrl(pdfPath, 300);

    if (error) {
        console.error(error);
        alert("Unable to open the checked PDF.");
        return;
    }

    window.open(data.signedUrl, "_blank");
}

loadSubmittedTests();
