<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Practice Platform</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
    <img src="assets/logo.png" alt="Universal Education Logo">
</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-btn">Login</a>
        </nav>
    </header>

    <main class="hero">
        <div class="hero-content">

            <p class="small-heading">
                YOUR IELTS PREPARATION PARTNER
            </p>

            <h1>
                IELTS Practice Tests<br>
                Improve with confidence.
            </h1>

            <p class="hero-description">
                Take realistic IELTS practice tests, track your progress,
                and prepare for your next step.
            </p>

            <a href="login.html" class="primary-btn">
    Start Practicing
</a>

        </div>
    </main>

    <script>
    // Clear previous test attempts after logout

    // Listening Test 1
    for (let i = 1; i <= 40; i++) {
        sessionStorage.removeItem("listeningTest1_q" + i);
    }

    // Listening Test 2
    for (let i = 1; i <= 40; i++) {
        sessionStorage.removeItem("listeningTest2_q" + i);
    }

    // Reading Test 1
    for (let i = 1; i <= 40; i++) {
        sessionStorage.removeItem("readingTest1_q" + i);
    }

    // Reading Test 2
    for (let i = 1; i <= 40; i++) {
        sessionStorage.removeItem("readingTest2_q" + i);
    }

    // Clear Reading Test 2 timer
    sessionStorage.removeItem("readingTest2TimeLeft");
    sessionStorage.removeItem("readingTest2TimerStarted");

    // Clear Reading Test 1 timer if used
    sessionStorage.removeItem("readingTimeLeft");
    sessionStorage.removeItem("readingTimerStarted");

    // Clear Listening result guards
    sessionStorage.removeItem("listeningTest1ResultSaved");
    sessionStorage.removeItem("listeningTest2ResultSaved");

    // Clear Reading result/session data
    sessionStorage.removeItem("readingTest2ResultSaved");
    sessionStorage.removeItem("readingAnswerReview");
    sessionStorage.removeItem("readingScore");
    sessionStorage.removeItem("readingCorrect");
</script>

</body>
</html>
