<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE CONNECTION
========================================= */


const SUPABASE_URL =
    "https://gehczgguwxqwfowmbedy.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_9h-NB-3bSeofDt2PchapIw_me-RTx3z";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =========================================
   ANSWER NORMALIZATION
========================================= */


function normalizeAnswer(answer) {

    return String(answer || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]/g, "");

}



function isCorrect(
    studentAnswer,
    acceptedAnswers
) {

    const student =
        normalizeAnswer(studentAnswer);


    if (!student) {

        return false;

    }


    return acceptedAnswers.some(
        function(answer) {

            return student ===
                normalizeAnswer(answer);

        }
    );

}



/* =========================================
   IELTS BAND SCORE
========================================= */


function calculateBand(correctCount) {

    if (correctCount >= 39) return "9.0";

    if (correctCount >= 37) return "8.5";

    if (correctCount >= 35) return "8.0";

    if (correctCount >= 32) return "7.5";

    if (correctCount >= 30) return "7.0";

    if (correctCount >= 26) return "6.5";

    if (correctCount >= 23) return "6.0";

    if (correctCount >= 18) return "5.5";

    if (correctCount >= 16) return "5.0";

    if (correctCount >= 13) return "4.5";

    if (correctCount >= 10) return "4.0";

    if (correctCount >= 8) return "3.5";

    if (correctCount >= 6) return "3.0";

    if (correctCount >= 4) return "2.5";

    return "2.0";

}



/* =========================================
   READ TEST 3 ANSWERS
========================================= */


function readTest3Answers() {

    const answers = {};


    for (
        let i = 1;
        i <= 40;
        i++
    ) {

        answers["q" + i] =
            sessionStorage.getItem(
                "listeningTest3_q" + i
            ) || "";

    }


    return answers;

}



/* =========================================
   ANSWER REVIEW
========================================= */


function addReviewItem(
    questionNumber,
    studentAnswer,
    correctAnswer,
    correct
) {

    const answerReview =
        document.getElementById(
            "answerReview"
        );


    if (!answerReview) {

        return;

    }


    const reviewItem =
        document.createElement("div");


    reviewItem.className =
        correct
            ? "answer-review-item correct"
            : "answer-review-item wrong";



    const header =
        document.createElement("div");


    header.className =
        "review-header";



    const question =
        document.createElement("strong");


    question.textContent =
        "Question " +
        questionNumber;



    const status =
        document.createElement("span");


    status.className =
        "review-status";


    status.textContent =
        correct
            ? "✓ Correct"
            : "✗ Wrong";



    header.appendChild(question);

    header.appendChild(status);



    const yourAnswer =
        document.createElement("p");



    const yourLabel =
        document.createElement("strong");


    yourLabel.textContent =
        "Your answer: ";



    yourAnswer.appendChild(
        yourLabel
    );



    yourAnswer.appendChild(
        document.createTextNode(

            studentAnswer &&
            String(studentAnswer).trim() !== ""

                ? studentAnswer

                : "Not answered"

        )
    );



    const correctAnswerText =
        document.createElement("p");



    const correctLabel =
        document.createElement("strong");


    correctLabel.textContent =
        "Correct answer: ";



    correctAnswerText.appendChild(
        correctLabel
    );



    correctAnswerText.appendChild(
        document.createTextNode(
            correctAnswer
        )
    );



    reviewItem.appendChild(
        header
    );


    reviewItem.appendChild(
        yourAnswer
    );


    reviewItem.appendChild(
        correctAnswerText
    );


    answerReview.appendChild(
        reviewItem
    );

}



/* =========================================
   TEST 3 ANSWER KEY
========================================= */


const answerKey = {


    q1: [
        "c"
    ],


    q2: [
        "b"
    ],


    q3: [
        "b"
    ],


    q4: [
        "a"
    ],


    q5: [
        "c"
    ],


    q6: [
        "reservation"
    ],


    q7: [
        "forts"
    ],


    q8: [
        "dinner"
    ],


    q9: [
        "winds"
    ],


    q10: [
        "museums"
    ],


    /*
       Q11-Q13 are handled separately
       because the three answers are
       B, D and E in any order.
    */


    q14: [
        "b"
    ],


    q15: [
        "a"
    ],


    q16: [
        "website",
        "our website",
        "on our website"
    ],


    q17: [
        "birds"
    ],


    q18: [
        "dormitories"
    ],


    q19: [
        "private vehicles"
    ],


    q20: [
        "location devices"
    ],


    q21: [
        "literature"
    ],


    q22: [
        "physique"
    ],


    q23: [
        "master's ticket",
        "masters ticket"
    ],


    q24: [
        "command"
    ],


    q25: [
        "backing"
    ],


    q26: [
        "a"
    ],


    q27: [
        "c"
    ],


    q28: [
        "b"
    ],


    q29: [
        "plates"
    ],


    q30: [
        "seals"
    ],


    q31: [
        "urge"
    ],


    q32: [
        "punishment"
    ],


    q33: [
        "obsessive behaviour",
        "obsessive behavior"
    ],


    q34: [
        "reliability"
    ],


    q35: [
        "planning"
    ],


    q36: [
        "compulsion"
    ],


    q37: [
        "settings"
    ],


    q38: [
        "short-term",
        "short term"
    ],


    q39: [
        "underlying need",
        "need"
    ],


    q40: [
        "alternatives"
    ]

};



/* =========================================
   QUESTIONS 11-13
   B, D, E IN ANY ORDER
========================================= */


function checkQuestions11to13() {


    const studentAnswers = [

        normalizeAnswer(
            sessionStorage.getItem(
                "listeningTest3_q11"
            )
        ).toUpperCase(),

        normalizeAnswer(
            sessionStorage.getItem(
                "listeningTest3_q12"
            )
        ).toUpperCase(),

        normalizeAnswer(
            sessionStorage.getItem(
                "listeningTest3_q13"
            )
        ).toUpperCase()

    ];


    const correctAnswers = [
        "B",
        "D",
        "E"
    ];


    let matched = 0;


    const remainingCorrect =
        [...correctAnswers];


    studentAnswers.forEach(
        function(answer) {


            const index =
                remainingCorrect.indexOf(
                    answer
                );


            if (index !== -1) {

                matched++;

                remainingCorrect.splice(
                    index,
                    1
                );

            }

        }
    );


    return matched;

}



/* =========================================
   CALCULATE SCORE
========================================= */


async function calculateListeningScore() {


    const answers =
        readTest3Answers();


    let correctCount = 0;



    /* ===============================
       QUESTIONS 1-10
    =============================== */


    for (
        let i = 1;
        i <= 10;
        i++
    ) {


        const key =
            "q" + i;


        const student =
            answers[key] || "";


        const accepted =
            answerKey[key] || [];


        const correct =
            isCorrect(
                student,
                accepted
            );


        if (correct) {

            correctCount++;

        }


        addReviewItem(
            i,
            student,
            accepted.join(" / "),
            correct
        );

    }



    /* =========================================
   QUESTIONS 11-13
   B, D, E IN ANY ORDER
   EACH CORRECT SELECTED OPTION = 1 MARK
    ========================================= */

    const groupScore =
        checkQuestions11to13();

    correctCount += groupScore;


    /* ===============================
       QUESTIONS 14-40
    =============================== */

    /* =========================================
    ANSWER REVIEW: QUESTIONS 11-13
    ========================================= */

    const selected11to13 = [];

    for (let i = 11; i <= 13; i++) {
        const answer =
            sessionStorage.getItem(
                "listeningTest3_q" + i
            ) || "";

        if (answer.trim() !== "") {
            selected11to13.push(
                answer.trim().toUpperCase()
            );
        }
    }

    const correct11to13 = ["B", "D", "E"];

    const marks11to13 =
        checkQuestions11to13();

    const review11to13 =
        document.createElement("div");

    review11to13.className =
    marks11to13 === 3
        ? "answer-review-item correct"
        : marks11to13 > 0
            ? "answer-review-item partial"
            : "answer-review-item wrong";

    review11to13.innerHTML = `
        <div class="review-header">
            <strong>Questions 11–13</strong>
            <span class="review-status">
                ${marks11to13}/3 Marks
            </span>
        </div>

        <p>
            <strong>Your answers:</strong>
            ${
                selected11to13.length > 0
                    ? selected11to13.join(", ")
                    : "Not answered"
            }
        </p>

        <p>
            <strong>Correct answers:</strong>
            B, D, E
        </p>
    `;

    document
        .getElementById("answerReview")
        .appendChild(review11to13);


    for (
        let i = 14;
        i <= 40;
        i++
    ) {


        const key =
            "q" + i;


        const student =
            answers[key] || "";


        const accepted =
            answerKey[key] || [];


        const correct =
            isCorrect(
                student,
                accepted
            );


        if (correct) {

            correctCount++;

        }


        addReviewItem(
            i,
            student,
            accepted.join(" / "),
            correct
        );

    }



    /* ===============================
       DISPLAY SCORE
    =============================== */


    const wrongCount =
        40 - correctCount;



    document.getElementById(
        "correctAnswers"
    ).textContent =
        correctCount;



    document.getElementById(
        "wrongAnswers"
    ).textContent =
        wrongCount;



    document.getElementById(
        "totalScore"
    ).textContent =
        correctCount +
        " / 40";



    document.getElementById(
        "bandScore"
    ).textContent =
        calculateBand(
            correctCount
        );



    console.log(
        "FINAL LISTENING TEST 3 SCORE:",
        correctCount +
        " / 40"
    );



    /* ===============================
       SAVE RESULT
    =============================== */


    await saveResultToSupabase(
        correctCount
    );

}



/* =========================================
   SAVE RESULT TO SUPABASE
========================================= */


async function saveResultToSupabase(
    score
) {


    if (
        sessionStorage.getItem(
            "listeningTest3ResultSaved"
        ) === "true"
    ) {


        console.log(
            "Listening Test 3 result already saved."
        );


        return;

    }



    const studentId =
        sessionStorage.getItem(
            "studentId"
        );


    const studentName =
        sessionStorage.getItem(
            "studentName"
        ) || "Student";



    const resultData = {

        student_id:
            studentId
                ? Number(studentId)
                : null,


        student_name:
            studentName,


        test_name:
            "Test 3",


        test_date:
            new Date()
                .toISOString()
                .split("T")[0],


        listening_score:
            score,


        is_submitted:
            true

    };



    console.log(
        "Data being sent to Supabase:",
        resultData
    );



    const {
        error
    } =
        await supabaseClient
            .from("test_results")
            .insert(
                resultData
            );



    if (error) {


        console.error(
            "Error saving Listening Test 3 result:",
            error
        );


        return;

    }



    sessionStorage.setItem(
        "listeningTest3ResultSaved",
        "true"
    );



    console.log(
        "Listening Test 3 result saved successfully."
    );

}



/* =========================================
   START
========================================= */


document.addEventListener(
    "DOMContentLoaded",
    function() {

        calculateListeningScore();

    }
);


</script>
