<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>IELTS Listening Test 3 - Result</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<header class="main-header">

    <div class="logo">
        IELTS Practice
    </div>

    <div class="header-right">

        <a href="../student-dashboard.html">
            Dashboard
        </a>

        <a href="../index.html">
            Logout
        </a>

    </div>

</header>


<main class="listening-container">


    <section class="listening-card">

        <div class="question-box">

            <h1>Listening Test 3 Complete</h1>

            <p>
                Your IELTS Listening Test 3 has been submitted.
            </p>


            <div
                id="resultMessage"
                style="margin-top:25px; text-align:center;">

                Calculating your score...

            </div>


            <div
                id="scoreBox"
                style="
                    display:none;
                    margin-top:25px;
                    padding:25px;
                    background:#f5f5f5;
                    border:1px solid #ddd;
                    border-radius:10px;
                    text-align:center;
                ">

                <h2>Your Score</h2>

                <div
                    id="score"
                    style="
                        font-size:42px;
                        font-weight:bold;
                        color:#198754;
                        margin:15px 0;
                    ">
                </div>

                <p id="scoreDetails"></p>

            </div>


            <div
                class="part-navigation"
                style="margin-top:25px;">

                <a
                    href="../student-dashboard.html"
                    class="section-jump-button">

                    Back to Dashboard

                </a>

            </div>

        </div>

    </section>


</main>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://gehczgguwxqwfowmbedy.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_9h-NB-3bSeofDt2PchapIw_me-RTx3z";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   NORMALIZE ANSWER
========================================= */

function normalizeAnswer(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[–—]/g, "-")
        .replace(/\s+/g, " ");

}


/* =========================================
   GET ANSWER
========================================= */

function getAnswer(questionNumber) {

    return normalizeAnswer(
        sessionStorage.getItem(
            "listeningTest3_q" + questionNumber
        )
    );

}


/* =========================================
   ACCEPTED ANSWERS
========================================= */

const answerKey = {

    1: ["c"],
    2: ["b"],
    3: ["b"],
    4: ["a"],
    5: ["c"],

    6: ["reservation"],
    7: ["forts"],
    8: ["dinner"],
    9: ["winds"],
    10: ["museums"],

    14: ["b"],
    15: ["a"],

    16: [
        "website",
        "our website",
        "on our website"
    ],

    17: ["birds"],
    18: ["dormitories"],
    19: ["private vehicles"],
    20: ["location devices"],

    21: ["literature"],
    22: ["physique"],
    23: ["master's ticket", "masters ticket"],
    24: ["command"],
    25: ["backing"],

    26: ["a"],
    27: ["c"],
    28: ["b"],
    29: ["plates"],
    30: ["seals"],

    31: ["urge"],
    32: ["punishment"],

    33: [
        "obsessive behaviour",
        "obsessive behavior"
    ],

    34: ["reliability"],
    35: ["planning"],
    36: ["compulsion"],
    37: ["settings"],

    38: [
        "short-term",
        "short term"
    ],

    39: [
        "underlying need",
        "need"
    ],

    40: ["alternatives"]

};


/* =========================================
   CHECK NORMAL QUESTION
========================================= */

function isCorrect(questionNumber) {

    const studentAnswer =
        getAnswer(questionNumber);

    const accepted =
        answerKey[questionNumber] || [];

    return accepted.includes(studentAnswer);

}


/* =========================================
   CHECK QUESTIONS 11-13
   B, D, E IN ANY ORDER
========================================= */

function getGroupAnswer(questionNumber) {

    return normalizeAnswer(
        sessionStorage.getItem(
            "listeningTest3_q" + questionNumber
        )
    ).toUpperCase();

}


function checkQuestions11to13() {

    const studentAnswers = [
        getGroupAnswer(11),
        getGroupAnswer(12),
        getGroupAnswer(13)
    ];

    const correctAnswers = ["B", "D", "E"];

    let matched = 0;

    const remainingCorrect =
        [...correctAnswers];

    studentAnswers.forEach(function(answer) {

        const index =
            remainingCorrect.indexOf(answer);

        if (index !== -1) {

            matched++;

            remainingCorrect.splice(index, 1);

        }

    });

    return matched;

}


/* =========================================
   CALCULATE SCORE
========================================= */

function calculateScore() {

    let score = 0;


    /* Questions 1-10 */

    for (let i = 1; i <= 10; i++) {

        if (isCorrect(i)) {
            score++;
        }

    }


    /* Questions 11-13 */

score += checkQuestions11to13();


    /* Questions 14-40 */

    for (let i = 14; i <= 40; i++) {

        if (isCorrect(i)) {
            score++;
        }

    }


    return score;

}


/* =========================================
   SAVE RESULT
========================================= */

async function saveResult(score) {

    const studentId =
        sessionStorage.getItem("studentId");

    const studentName =
        sessionStorage.getItem("studentName") ||
        "Student";


    const resultData = {

        student_id:
            studentId ? Number(studentId) : null,

        student_name:
            studentName,

        test_name:
            "Test 3",

        test_date:
            new Date()
                .toISOString()
                .split("T")[0],

        listening_score:
            score,

        is_submitted:
            true

    };


    const {
        data,
        error
    } = await db
        .from("test_results")
        .insert([resultData])
        .select();


    if (error) {

        console.error(
            "Supabase error:",
            error
        );

        throw error;

    }


    return data;

}


/* =========================================
   SHOW RESULT
========================================= */

async function showResult() {

    const resultMessage =
        document.getElementById(
            "resultMessage"
        );

    const scoreBox =
        document.getElementById(
            "scoreBox"
        );

    const scoreElement =
        document.getElementById(
            "score"
        );

    const scoreDetails =
        document.getElementById(
            "scoreDetails"
        );


    try {

        const score =
            calculateScore();


        /* Prevent duplicate submission */

        if (
            sessionStorage.getItem(
                "listeningTest3ResultSaved"
            ) === "true"
        ) {

            resultMessage.textContent =
                "Your result has already been submitted.";

            scoreBox.style.display =
                "block";

            scoreElement.textContent =
                score + " / 40";

            scoreDetails.textContent =
                "Your Listening Test 3 result has already been recorded.";

            return;

        }


        await saveResult(score);


        sessionStorage.setItem(
            "listeningTest3ResultSaved",
            "true"
        );


        resultMessage.textContent =
            "Your result has been successfully submitted.";


        scoreBox.style.display =
            "block";


        scoreElement.textContent =
            score + " / 40";


        scoreDetails.textContent =
            "You answered " +
            score +
            " out of 40 questions correctly.";


    } catch (error) {

        console.error(error);


        resultMessage.innerHTML =
            "<span style='color:#b00000;'>" +
            "There was a problem saving your result. " +
            "Please contact your teacher." +
            "</span>";

    }

}


/* =========================================
   START
========================================= */

showResult();


</script>


</body>

</html>
