<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Result</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        * *{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:30px 16px;
    font-family:Arial,sans-serif;

    background:
        radial-gradient(circle at top left,
            rgba(168,101,131,.10),
            transparent 35%),
        radial-gradient(circle at bottom right,
            rgba(111,143,122,.10),
            transparent 35%),
        radial-gradient(circle at top right,
            rgba(142,122,181,.08),
            transparent 30%),
        #F9F8FA;

    color:#4F5E52;
}


/* =====================================
   HEADER
===================================== */

.result-header{
    width:100%;
    max-width:980px;
    height:68px;

    margin:0 auto 24px;
    padding:0 24px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,.78);
    backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,.85);
    border-radius:18px;

    box-shadow:0 8px 22px rgba(93,62,80,.05);
}

.result-logo{
    font-size:20px;
    font-weight:700;
    color:#5D3E50;
}

.result-header-links{
    display:flex;
    gap:22px;
}

.result-header-links a{
    color:#64746B;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.result-header-links a:hover{
    color:#8E7AB5;
}


/* =====================================
   MAIN CONTAINER
===================================== */

.result-container{
    max-width:820px;
    margin:0 auto;
}


/* =====================================
   RESULT CARD
===================================== */

.result-card{
    padding:38px 34px;

    background:rgba(255,255,255,.82);
    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,.9);
    border-radius:24px;

    box-shadow:0 14px 34px rgba(93,62,80,.06);

    text-align:center;
}


/* Student */

.student-name{
    font-size:22px;
    font-weight:700;
    color:#5D3E50;
    margin-bottom:28px;
}


/* Score */

.score-title{
    font-size:16px;
    color:#6F7C74;
    letter-spacing:.5px;
    text-transform:uppercase;
}

.score{
    margin:14px 0;

    font-size:64px;
    font-weight:700;
    color:#5D3E50;
    line-height:1;
}


/* Band */

.band{
    display:inline-block;

    margin:18px 0 24px;
    padding:12px 24px;

    border-radius:999px;

    background:rgba(111,143,122,.10);
    border:1px solid rgba(111,143,122,.18);

    color:#6F8F7A;
    font-size:24px;
    font-weight:700;
}


/* Message */

.result-message{
    max-width:560px;
    margin:0 auto;

    color:#5F6D64;
    font-size:16px;
    line-height:1.7;
}


/* =====================================
   BUTTONS
===================================== */

.button-container{
    margin-top:34px;
}

.dashboard-button{
    display:inline-block;

    padding:13px 28px;
    margin:5px;

    border-radius:999px;

    background:linear-gradient(
        135deg,
        #A86583,
        #8E7AB5
    );

    color:#FFFFFF;
    text-decoration:none;
    font-weight:600;

    transition:.25s ease;
}

.dashboard-button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(168,101,131,.18);
}


/* =====================================
   DETAILS
===================================== */

.details{
    margin-top:34px;
    padding-top:26px;

    border-top:1px solid #ECE4EA;
    text-align:left;
}

.details h2{
    margin:0 0 16px;
    color:#5D3E50;
    font-size:22px;
}

.details p{
    margin:10px 0;
    color:#5F6D64;
    line-height:1.7;
}


/* =====================================
   MOBILE
===================================== */

@media (max-width:600px){

    body{
        padding:18px 12px;
    }

    .result-header{
        height:auto;
        padding:16px;
        flex-direction:column;
        gap:12px;
    }

    .result-card{
        padding:28px 22px;
    }

    .student-name{
        font-size:20px;
    }

    .score{
        font-size:52px;
    }

    .band{
        font-size:20px;
        padding:10px 18px;
    }

    .dashboard-button{
        width:100%;
    }

}

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <header class="result-header">

        <div class="result-logo">
            IELTS Practice
        </div>

        <div class="result-header-links">

            <a href="../student-dashboard.html">
                Dashboard
            </a>

            <a href="../index.html">
                Logout
            </a>

        </div>

    </header>

    <main class="result-container">
        <section class="result-card">

            <div class="student-name" id="studentName">
                Student
            </div>

            <div class="score-title">
                Your Reading Score
            </div>

            <div class="score" id="readingScore">
                0 / 40
            </div>

            <div class="band" id="readingBand">
                IELTS Band: -
            </div>

            <p class="result-message" id="resultMessage">
                Calculating your result...
            </p>

            <div class="details">
                <h2>Result Details</h2>
                <p>
                    Correct Answers:
                    <strong id="correctAnswers">0</strong>
                </p>

                <p>
                    Incorrect Answers:
                    <strong id="incorrectAnswers">0</strong>
                </p>

                <p>
                    Total Questions:
                    <strong>40</strong>
                </p>
            </div>

            <div class="answer-review-section">
                <h2>Answer Review</h2>
                <div id="reviewContainer"></div>
            </div>

            <div class="button-container">
                <a href="../submitted-tests.html" class="dashboard-button">
                    View Submitted Tests
                </a>

            </div>

        </section>
    </main>

    <script>
        const studentName =
            sessionStorage.getItem("studentName") || "Student";

        document.getElementById("studentName").textContent = studentName;

        /*
         * These values will be supplied by reading-test.html
         * before redirecting to this page.
         */
        const savedScore = sessionStorage.getItem("readingScore");
        const savedCorrect = sessionStorage.getItem("readingCorrect");

        const score = savedScore !== null
            ? Number(savedScore)
            : 0;

        const correct = savedCorrect !== null
            ? Number(savedCorrect)
            : score;

        const incorrect = 40 - correct;

        function getReadingBand(correctAnswers) {
            if (correctAnswers >= 39) return 9.0;
            if (correctAnswers >= 37) return 8.5;
            if (correctAnswers >= 35) return 8.0;
            if (correctAnswers >= 33) return 7.5;
            if (correctAnswers >= 30) return 7.0;
            if (correctAnswers >= 27) return 6.5;
            if (correctAnswers >= 23) return 6.0;
            if (correctAnswers >= 19) return 5.5;
            if (correctAnswers >= 15) return 5.0;
            if (correctAnswers >= 13) return 4.5;
            if (correctAnswers >= 10) return 4.0;
            if (correctAnswers >= 8) return 3.5;
            if (correctAnswers >= 6) return 3.0;
            if (correctAnswers >= 4) return 2.5;
            return 2.0;
        }

        const band = getReadingBand(correct);

        const SUPABASE_URL =
            "https://gehczgguwxqwfowmbedy.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_9h-NB-3bSeofDt2PchapIw_me-RTx3z";

        const db =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        const studentId =
            sessionStorage.getItem("studentId");

        const resultData = {
            student_id:
                studentId
                    ? Number(studentId)
                    : null,

            student_name:
                studentName,

            test_name:
                "Test 1",

            test_date:
                new Date().toISOString().split("T")[0],

            reading_score:
                correct,

            is_submitted:
                true
        };

        db
            .from("test_results")
            .insert([resultData])
            .then(function(response) {
                if (response.error) {
                    console.error(
                        "Error saving Reading Test 1 result:",
                        response.error
                    );
                } else {
                    console.log(
                        "Reading Test 1 result saved successfully."
                    );
                }
            });

        document.getElementById("readingScore").textContent =
            correct + " / 40";

        document.getElementById("readingBand").textContent =
            "IELTS Band: " + band;

        document.getElementById("correctAnswers").textContent =
            correct;

        document.getElementById("incorrectAnswers").textContent =
            incorrect;

        document.getElementById("resultMessage").textContent =
            "Your Reading test result has been calculated successfully.";

            const reviewContainer = document.getElementById("reviewContainer");
const savedReview = sessionStorage.getItem("readingAnswerReview");

if (savedReview && reviewContainer) {
    const review = JSON.parse(savedReview);

    for (let i = 1; i <= 40; i++) {
        const item = review["q" + i];

        if (!item) continue;

        const userAnswer = item.userAnswer;
        const correctAnswer = item.correctAnswer;

        let isCorrect = false;

        if (Array.isArray(correctAnswer)) {
            const userAnswers = Array.isArray(userAnswer)
                ? userAnswer
                : [userAnswer];

            isCorrect = userAnswers.some(function(answer) {
                return correctAnswer.some(function(correct) {
                    return String(answer).trim().toLowerCase() ===
                           String(correct).trim().toLowerCase();
                });
            });
        } else {
            isCorrect =
                userAnswer !== null &&
                userAnswer !== undefined &&
                String(userAnswer).trim().toLowerCase() ===
                String(correctAnswer).trim().toLowerCase();
        }

        const reviewItem = document.createElement("div");

        reviewItem.className =
            "answer-review-item " +
            (isCorrect ? "correct" : "wrong");

        const displayedUserAnswer =
            Array.isArray(userAnswer)
                ? userAnswer.join(", ") || "Not answered"
                : userAnswer || "Not answered";

        const displayedCorrectAnswer =
            Array.isArray(correctAnswer)
                ? correctAnswer.join(" / ")
                : correctAnswer;

        reviewItem.innerHTML = `
            <strong>Question ${i}</strong>
            <span class="review-status">
                ${isCorrect ? "✓ Correct" : "✗ Incorrect"}
            </span>
            <p><strong>Your answer:</strong> ${displayedUserAnswer}</p>
            <p><strong>Correct answer:</strong> ${displayedCorrectAnswer}</p>
        `;

        reviewContainer.appendChild(reviewItem);
    }
}
    </script>

</body>
</html>
