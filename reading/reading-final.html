<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Result</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        *{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:30px 16px;
    font-family:Arial,sans-serif;
    color:#4C4A46;

    background:
        radial-gradient(circle at top left,
            rgba(139,154,110,.12), transparent 35%),
        radial-gradient(circle at bottom right,
            rgba(234,226,214,.55), transparent 35%),
        #F7F2EB;
}

/* =====================================
   HEADER
===================================== */

.result-header{
    width:100%;
    max-width:980px;
    height:68px;
    margin:0 auto 22px;
    padding:0 24px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,.72);
    backdrop-filter:blur(16px);

    border:1px solid rgba(224,216,203,.9);
    border-radius:18px;

    box-shadow:0 8px 22px rgba(76,74,70,.05);
}

.result-logo{
    font-size:20px;
    font-weight:700;
    color:#4C4A46;
}

.result-header-links{
    display:flex;
    gap:22px;
}

.result-header-links a{
    color:#6B6A66;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:.2s ease;
}

.result-header-links a:hover{
    color:#8B9A6E;
}

/* =====================================
   RESULT CARD
===================================== */

.result-card{
    width:100%;
    max-width:760px;
    margin:auto;

    padding:38px 32px;

    background:rgba(255,255,255,.82);
    backdrop-filter:blur(14px);

    border:1px solid rgba(231,225,214,.9);
    border-radius:24px;

    box-shadow:0 14px 34px rgba(76,74,70,.06);
}

h1{
    margin:0 0 32px;
    text-align:center;
    color:#4C4A46;
    font-size:32px;
}

h2{
    margin:40px 0 22px;
    color:#4C4A46;
    font-size:24px;
}

/* =====================================
   SCORE LINES
===================================== */

.result-line{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:16px 4px;
    border-bottom:1px solid #E7DFD3;

    font-size:17px;
    color:#5F5B55;
}

.result-line span{
    font-weight:700;
    color:#6F7B57;
}

.band-line{
    margin-top:12px;
    padding-top:22px;

    border-top:1px solid #DDD5C8;
    border-bottom:none;

    font-size:20px;
}

.band-line span{
    font-size:28px;
    color:#8B9A6E;
}

/* =====================================
   ANSWER REVIEW
===================================== */

.answer-review-section{
    margin-top:34px;
}

.answer-review-item{
    margin-bottom:14px;
    padding:16px 18px;

    border-left:4px solid;
    border-radius:14px;
}

.answer-review-item.correct{
    background:#F4F6F1;
    border-left-color:#8B9A6E;
}

.answer-review-item.wrong{
    background:#FBF8F4;
    border-left-color:#B09A7D;
}

.review-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
}

.review-status{
    font-weight:700;
    font-size:14px;
}

.correct .review-status{
    color:#6F7B57;
}

.wrong .review-status{
    color:#9B8568;
}

.answer-review-item p{
    margin:6px 0;
    color:#5F5B55;
    line-height:1.6;
}

.answer-review-item strong{
    color:#4C4A46;
}

/* =====================================
   BUTTON
===================================== */

.home-button{
    display:block;
    width:fit-content;

    margin:34px auto 0;
    padding:13px 28px;

    border-radius:999px;
    border:1px solid #8B9A6E;

    background:#8B9A6E;
    color:#FFFFFF;

    text-decoration:none;
    font-weight:600;
    transition:.25s ease;
}

.home-button:hover{
    background:#78855F;
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(139,154,110,.18);
}

/* =====================================
   MOBILE
===================================== */

@media (max-width:600px){

    body{
        padding:18px 12px;
    }

    .result-header{
        height:auto;
        padding:16px;
        flex-direction:column;
        gap:12px;
    }

    .result-card{
        padding:26px 20px;
    }

    h1{
        font-size:28px;
    }

    h2{
        font-size:21px;
    }

    .result-line{
        font-size:16px;
    }

    .review-header{
        flex-direction:column;
        align-items:flex-start;
    }
}

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <header class="result-header">

        <div class="result-logo">
            IELTS Practice
        </div>

        <div class="result-header-links">

            <a href="../student-dashboard.html">
                Dashboard
            </a>

            <a href="../index.html">
                Logout
            </a>

        </div>

    </header>

    <main class="result-container">
        <section class="result-card">

            <div class="student-name" id="studentName">
                Student
            </div>

            <div class="score-title">
                Your Reading Score
            </div>

            <div class="score" id="readingScore">
                0 / 40
            </div>

            <div class="band" id="readingBand">
                IELTS Band: -
            </div>

            <p class="result-message" id="resultMessage">
                Calculating your result...
            </p>

            <div class="details">
                <h2>Result Details</h2>
                <p>
                    Correct Answers:
                    <strong id="correctAnswers">0</strong>
                </p>

                <p>
                    Incorrect Answers:
                    <strong id="incorrectAnswers">0</strong>
                </p>

                <p>
                    Total Questions:
                    <strong>40</strong>
                </p>
            </div>

            <div class="answer-review-section">
                <h2>Answer Review</h2>
                <div id="reviewContainer"></div>
            </div>

            <div class="button-container">
                <a href="../submitted-tests.html" class="home-button">
                    View Submitted Tests
                </a>

            </div>

        </section>
    </main>

    <script>
        const studentName =
            sessionStorage.getItem("studentName") || "Student";

        document.getElementById("studentName").textContent = studentName;

        /*
         * These values will be supplied by reading-test.html
         * before redirecting to this page.
         */
        const savedScore = sessionStorage.getItem("readingScore");
        const savedCorrect = sessionStorage.getItem("readingCorrect");

        const score = savedScore !== null
            ? Number(savedScore)
            : 0;

        const correct = savedCorrect !== null
            ? Number(savedCorrect)
            : score;

        const incorrect = 40 - correct;

        function getReadingBand(correctAnswers) {
            if (correctAnswers >= 39) return 9.0;
            if (correctAnswers >= 37) return 8.5;
            if (correctAnswers >= 35) return 8.0;
            if (correctAnswers >= 33) return 7.5;
            if (correctAnswers >= 30) return 7.0;
            if (correctAnswers >= 27) return 6.5;
            if (correctAnswers >= 23) return 6.0;
            if (correctAnswers >= 19) return 5.5;
            if (correctAnswers >= 15) return 5.0;
            if (correctAnswers >= 13) return 4.5;
            if (correctAnswers >= 10) return 4.0;
            if (correctAnswers >= 8) return 3.5;
            if (correctAnswers >= 6) return 3.0;
            if (correctAnswers >= 4) return 2.5;
            return 2.0;
        }

        const band = getReadingBand(correct);

        const SUPABASE_URL =
            "https://gehczgguwxqwfowmbedy.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_9h-NB-3bSeofDt2PchapIw_me-RTx3z";

        const db =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        const studentId =
            sessionStorage.getItem("studentId");

        const resultData = {
            student_id:
                studentId
                    ? Number(studentId)
                    : null,

            student_name:
                studentName,

            test_name:
                "Test 1",

            test_date:
                new Date().toISOString().split("T")[0],

            reading_score:
                correct,

            is_submitted:
                true
        };

        db
            .from("test_results")
            .insert([resultData])
            .then(function(response) {
                if (response.error) {
                    console.error(
                        "Error saving Reading Test 1 result:",
                        response.error
                    );
                } else {
                    console.log(
                        "Reading Test 1 result saved successfully."
                    );
                }
            });

        document.getElementById("readingScore").textContent =
            correct + " / 40";

        document.getElementById("readingBand").textContent =
            "IELTS Band: " + band;

        document.getElementById("correctAnswers").textContent =
            correct;

        document.getElementById("incorrectAnswers").textContent =
            incorrect;

        document.getElementById("resultMessage").textContent =
            "Your Reading test result has been calculated successfully.";

            const reviewContainer = document.getElementById("reviewContainer");
const savedReview = sessionStorage.getItem("readingAnswerReview");

if (savedReview && reviewContainer) {
    const review = JSON.parse(savedReview);

    for (let i = 1; i <= 40; i++) {
        const item = review["q" + i];

        if (!item) continue;

        const userAnswer = item.userAnswer;
        const correctAnswer = item.correctAnswer;

        let isCorrect = false;

        if (Array.isArray(correctAnswer)) {
            const userAnswers = Array.isArray(userAnswer)
                ? userAnswer
                : [userAnswer];

            isCorrect = userAnswers.some(function(answer) {
                return correctAnswer.some(function(correct) {
                    return String(answer).trim().toLowerCase() ===
                           String(correct).trim().toLowerCase();
                });
            });
        } else {
            isCorrect =
                userAnswer !== null &&
                userAnswer !== undefined &&
                String(userAnswer).trim().toLowerCase() ===
                String(correctAnswer).trim().toLowerCase();
        }

        const reviewItem = document.createElement("div");

        reviewItem.className =
            "answer-review-item " +
            (isCorrect ? "correct" : "wrong");

        const displayedUserAnswer =
            Array.isArray(userAnswer)
                ? userAnswer.join(", ") || "Not answered"
                : userAnswer || "Not answered";

        const displayedCorrectAnswer =
            Array.isArray(correctAnswer)
                ? correctAnswer.join(" / ")
                : correctAnswer;

        reviewItem.innerHTML = `
            <strong>Question ${i}</strong>
            <span class="review-status">
                ${isCorrect ? "✓ Correct" : "✗ Incorrect"}
            </span>
            <p><strong>Your answer:</strong> ${displayedUserAnswer}</p>
            <p><strong>Correct answer:</strong> ${displayedCorrectAnswer}</p>
        `;

        reviewContainer.appendChild(reviewItem);
    }
}
    </script>

</body>
</html>
