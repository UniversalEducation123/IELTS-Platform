<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review Writing Submission</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * *{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#F7F2EB;
    color:#5F6558;
}


/* =====================================
   HEADER
===================================== */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 8%;

    background:rgba(247,242,235,.92);
    backdrop-filter:blur(12px);

    border-bottom:1px solid #E3DCD1;
}

header h1{
    margin:0;
    font-size:22px;
    color:#4C4A46;
}

.back-button{
    padding:10px 18px;

    background:#FFFFFF;
    color:#4C4A46;

    border:1px solid #E3DCD1;
    border-radius:999px;

    font-weight:600;
    cursor:pointer;
    transition:.2s ease;
}

.back-button:hover{
    background:#EAE2D6;
}


/* =====================================
   LAYOUT
===================================== */

.container{
    max-width:1000px;
    margin:36px auto;
    padding:0 20px;
}


/* =====================================
   CARDS
===================================== */

.student-info,
.answer-card,
.review-card{
    background:#FFFFFF;

    border:1px solid #E3DCD1;
    border-radius:18px;

    padding:24px;
    margin-bottom:22px;

    box-shadow:0 8px 22px rgba(76,74,70,.05);
}

.student-info h2,
.answer-card h2,
.review-card h2{
    margin-top:0;
    color:#4C4A46;
    font-size:24px;
}

.student-info p{
    margin:8px 0;
    color:#66635E;
}


/* =====================================
   QUESTION DISPLAY
===================================== */

.question-box{
    background:#F4EFE7;

    border:1px solid #E3DCD1;
    border-radius:14px;

    padding:18px;
    margin-bottom:18px;

    line-height:1.7;
    color:#5F6558;
}

.answer-box{
    background:#FFFFFF;

    border:1px solid #DDD4C8;
    border-radius:12px;

    padding:18px;

    white-space:pre-wrap;
    line-height:1.8;
    min-height:150px;

    color:#5F6558;
}


/* =====================================
   REVIEW GRID
===================================== */

.review-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:22px;
}


/* =====================================
   FORM
===================================== */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;

    color:#4C4A46;
    font-weight:700;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px 14px;

    background:#FCFAF7;

    border:1px solid #D8CFC3;
    border-radius:10px;

    color:#5F6558;
    font-size:15px;
    font-family:inherit;

    transition:.2s ease;
}

.form-group input:focus,
.form-group textarea:focus{
    outline:none;
    border-color:#8B9A6E;
    box-shadow:0 0 0 3px rgba(139,154,110,.15);
    background:#FFFFFF;
}

.form-group textarea{
    min-height:160px;
    resize:vertical;
}


/* =====================================
   SAVE BUTTON
===================================== */

.save-button{
    padding:13px 24px;

    background:#8B9A6E;
    color:#FFFFFF;

    border:none;
    border-radius:10px;

    font-size:15px;
    font-weight:700;

    cursor:pointer;
    transition:.2s ease;
}

.save-button:hover{
    background:#78875D;
}


.message{
    margin-top:15px;
    font-weight:600;
    color:#6F7A63;
}

.loading{
    text-align:center;
    padding:50px;
    color:#7A7E74;
}


/* =====================================
   MOBILE
===================================== */

@media (max-width:700px){

    .review-grid{
        grid-template-columns:1fr;
    }

    header{
        padding:16px 20px;
    }

    header h1{
        font-size:18px;
    }

    .container{
        padding:0 16px;
    }

    .student-info,
    .answer-card,
    .review-card{
        padding:20px;
    }

}   
    </style>
</head>

<body>

<header>
    <h1>Writing Test Review</h1>

    <button
        type="button"
        class="back-button"
        onclick="goBack()">
        ← Back to Students
    </button>
</header>

<div class="container">

    <div id="loadingMessage" class="loading">
        Loading writing submission...
    </div>

    <div id="reviewContent" style="display:none;">

        <div class="student-info">
            <h2 id="studentName">Student</h2>

            <p>
                <strong>Student ID:</strong>
                <span id="studentId"></span>
            </p>

            <p>
                <strong>Submission Date:</strong>
                <span id="submissionDate"></span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="submissionStatus"></span>
            </p>
        </div>


        <!-- TASK 1 -->

        <div class="answer-card">

            <h2>Task 1</h2>

            <div class="question-box">
                Review the student's Task 1 response below.
            </div>

            <h3>Student's Answer</h3>

            <div
                id="task1Answer"
                class="answer-box">
            </div>

        </div>


        <!-- TASK 2 -->

        <div class="answer-card">

            <h2>Task 2</h2>

            <div class="question-box">
                Review the student's Task 2 response below.
            </div>

            <h3>Student's Answer</h3>

            <div
                id="task2Answer"
                class="answer-box">
            </div>

        </div>


        <!-- REVIEW -->

        <div class="review-card">

            <h2>Faculty Review</h2>

            <div class="review-grid">

                <div class="form-group">
                    <label for="task1Score">
                        Task 1 Score
                    </label>

                    <input
                        type="number"
                        id="task1Score"
                        min="0"
                        max="9"
                        step="0.5"
                        placeholder="e.g. 6.5"
                        oninput="calculateOverallScore()">
                </div>


                <div class="form-group">
                    <label for="task2Score">
                        Task 2 Score
                    </label>

                    <input
                        type="number"
                        id="task2Score"
                        min="0"
                        max="9"
                        step="0.5"
                        placeholder="e.g. 6.0"
                        oninput="calculateOverallScore()">
                </div>


                <div class="form-group">
                    <label for="overallScore">
                        Overall Score
                    </label>

                    <input
                        type="number"
                        id="overallScore"
                        min="0"
                        max="9"
                        step="0.5"
                        placeholder="Calculated automatically"
                        readonly>
                </div>

            </div>


            <div class="form-group">

                <label for="facultyFeedback">
                    Faculty Feedback
                </label>

                <textarea
                    id="facultyFeedback"
                    placeholder="Write feedback for the student..."></textarea>

            </div>


            <button
                type="button"
                class="save-button"
                onclick="saveReview()">
                Save Score & Feedback
            </button>

            <div
                id="message"
                class="message">
            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://gehczgguwxqwfowmbedy.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const params =
    new URLSearchParams(window.location.search);

const submissionId =
    params.get("submission");


function goBack() {

    window.location.href =
        "view-students.html";

}


async function loadSubmission() {

    if (!submissionId) {

        document.getElementById("loadingMessage").textContent =
            "No writing submission was selected.";

        return;
    }


    const { data, error } =
        await supabaseClient
            .from("writing_submissions")
            .select("*")
            .eq("id", submissionId)
            .single();


    if (error) {

        console.error(error);

        document.getElementById("loadingMessage").textContent =
            "Error loading submission: " + error.message;

        return;
    }


    document.getElementById("loadingMessage").style.display =
        "none";

    document.getElementById("reviewContent").style.display =
        "block";


    document.getElementById("studentName").textContent =
        data.student_name || "Unknown Student";

    document.getElementById("studentId").textContent =
        data.student_id || "N/A";


    document.getElementById("submissionDate").textContent =
        data.submitted_at
            ? new Date(data.submitted_at).toLocaleString()
            : "N/A";


    document.getElementById("submissionStatus").textContent =
        data.status || "Submitted";


    document.getElementById("task1Answer").textContent =
        data.task1_answer || "No Task 1 answer submitted.";


    document.getElementById("task2Answer").textContent =
        data.task2_answer || "No Task 2 answer submitted.";


    if (data.task1_score !== null &&
        data.task1_score !== undefined) {

        document.getElementById("task1Score").value =
            data.task1_score;
    }


    if (data.task2_score !== null &&
        data.task2_score !== undefined) {

        document.getElementById("task2Score").value =
            data.task2_score;
    }


    if (data.overall_score !== null &&
        data.overall_score !== undefined) {

        document.getElementById("overallScore").value =
            data.overall_score;
    }


    document.getElementById("facultyFeedback").value =
        data.faculty_feedback || "";

}

function calculateOverallScore() {
    const task1Score =
        Number(document.getElementById("task1Score").value);

    const task2Score =
        Number(document.getElementById("task2Score").value);

    if (!task1Score || !task2Score) {
        document.getElementById("overallScore").value = "";
        return;
    }

    const average =
        (task1Score + task2Score) / 2;

    const overall =
        Math.round(average * 2) / 2;

    document.getElementById("overallScore").value =
        overall;
}


async function saveReview() {

    const task1Score =
        document.getElementById("task1Score").value;

    const task2Score =
        document.getElementById("task2Score").value;

    const overallScore =
        document.getElementById("overallScore").value;

    const facultyFeedback =
        document.getElementById("facultyFeedback").value;


    const message =
        document.getElementById("message");


    message.textContent =
        "Saving...";


    const { error } =
        await supabaseClient
            .from("writing_submissions")
            .update({
                task1_score:
                    task1Score === ""
                        ? null
                        : Number(task1Score),

                task2_score:
                    task2Score === ""
                        ? null
                        : Number(task2Score),

                overall_score:
                    overallScore === ""
                        ? null
                        : Number(overallScore),

                faculty_feedback:
                    facultyFeedback,

                status:
                    "reviewed",

                checked_at:
                    new Date().toISOString()
            })
            .eq("id", submissionId);


    if (error) {

        console.error(error);

        message.textContent =
            "Error saving review: " + error.message;

        return;
    }


    message.textContent =
        "Review saved successfully!";

}


loadSubmission();

</script>

</body>
</html>
