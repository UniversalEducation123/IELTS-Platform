<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review Writing Submission</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* *{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#F7F2EB;
    color:#5F6558;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 8%;
    background:rgba(247,242,235,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #E3DCD1;
}

header h1{
    margin:0;
    font-size:22px;
    color:#4C4A46;
}

.back-button{
    padding:10px 18px;
    background:#FFFFFF;
    color:#4C4A46;
    border:1px solid #E3DCD1;
    border-radius:999px;
    font-weight:600;
    cursor:pointer;
    transition:.2s ease;
}

.back-button:hover{
    background:#EAE2D6;
}

.container{
    max-width:1000px;
    margin:36px auto;
    padding:0 20px;
}

.student-info,
.answer-card,
.review-card{
    background:#FFFFFF;
    border:1px solid #E3DCD1;
    border-radius:18px;
    padding:24px;
    margin-bottom:22px;
    box-shadow:0 8px 22px rgba(76,74,70,.05);
}

.student-info h2,
.answer-card h2,
.review-card h2{
    margin-top:0;
    color:#4C4A46;
    font-size:24px;
}

.student-info p{
    margin:8px 0;
    color:#66635E;
}

.question-box{
    background:#F4EFE7;
    border:1px solid #E3DCD1;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    line-height:1.7;
    color:#5F6558;
}

.answer-box{
    background:#FFFFFF;
    border:1px solid #DDD4C8;
    border-radius:12px;
    padding:18px;
    white-space:pre-wrap;
    line-height:1.8;
    min-height:150px;
    color:#5F6558;
}

.review-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:22px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:#4C4A46;
    font-weight:700;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px 14px;

    background:#FCFAF7;
    border:1px solid #D8CFC3;
    border-radius:10px;

    color:#5F6558;
    font-size:15px;
    font-family:inherit;
    transition:.2s ease;
}

.form-group input:focus,
.form-group textarea:focus{
    outline:none;
    border-color:#8B9A6E;
    box-shadow:0 0 0 3px rgba(139,154,110,.15);
    background:#FFFFFF;
}

.form-group textarea{
    min-height:160px;
    resize:vertical;
}

.save-button{
    padding:13px 24px;
    background:#8B9A6E;
    color:#FFFFFF;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
}

.save-button:hover{
    background:#78875D;
}

.review-actions{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.view-checked-pdf-button{
    padding:13px 24px;
    background:#F4F1EA;
    color:#6F7A63;
    border:1px solid #8B9A6E;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
}

.view-checked-pdf-button:hover{
    background:#E9E5DA;
}

.message{
    margin-top:15px;
    font-weight:600;
    color:#6F7A63;
}

.loading{
    text-align:center;
    padding:50px;
    color:#7A7E74;
}

.student-info-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
}

.download-original-btn{
    padding:12px 18px;
    margin-bottom:20px;
    background:#8B9A6E;
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
}

.download-original-btn:hover{
    background:#78875D;
}

@media (max-width:700px){

    .review-grid{
        grid-template-columns:1fr;
    }

    header{
        padding:16px 20px;
    }

    header h1{
        font-size:18px;
    }

    .container{
        padding:0 16px;
    }

    .student-info,
    .answer-card,
    .review-card{
        padding:20px;
    }

    .student-info-header{
        flex-direction:column;
    }

    .download-original-btn{
        width:100%;
    }

}   
    </style>
</head>

<body>

<header>

    <h1>Writing Test Review</h1>

    <button type="button" class="back-button" onclick="goBack()">
        ← Back to Students
    </button>
    
</header>

<div class="container">

    <div id="loadingMessage" class="loading">
        Loading writing submission...
    </div>

    <div id="reviewContent" style="display:none;">

        <div class="student-info">
            <h2 id="studentName">Student</h2>

            <p>
                <strong>Student ID:</strong>
                <span id="studentId"></span>
            </p>

            <p>
                <strong>Submission Date:</strong>
                <span id="submissionDate"></span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="submissionStatus"></span>
            </p>
        </div>

         <button
            id="downloadOriginalBtn"
            class="download-original-btn"
            type="button"
            onclick="downloadOriginalPDF()">
            Download Original PDF
        </button>

        <!-- TASK 1 -->

        <div class="answer-card">

            <h2>Task 1</h2>

            <div class="question-box">
                Review the student's Task 1 response below.
            </div>

            <h3>Student's Answer</h3>

            <div id="task1Answer" class="answer-box"></div>

        </div>


        <!-- TASK 2 -->

        <div class="answer-card">

            <h2>Task 2</h2>

            <div class="question-box">
                Review the student's Task 2 response below.
            </div>

            <h3>Student's Answer</h3>

            <div id="task2Answer" class="answer-box">
            </div>

        </div>


        <!-- REVIEW -->

        <div class="review-card">

            <h2>Faculty Review</h2>

            <div class="review-grid">

                <div class="form-group">
                    <label for="task1Score">
                        Task 1 Score
                    </label>

                    <input
                        type="number"
                        id="task1Score"
                        min="0"
                        max="9"
                        step="0.5"
                        placeholder="e.g. 6.5"
                        oninput="calculateOverallScore()">
                </div>


                <div class="form-group">
                    <label for="task2Score">
                        Task 2 Score
                    </label>

                    <input
                        type="number"
                        id="task2Score"
                        min="0"
                        max="9"
                        step="0.5"
                        placeholder="e.g. 6.0"
                        oninput="calculateOverallScore()">
                </div>


                <div class="form-group">
                    <label for="overallScore">
                        Overall Score
                    </label>

                    <input
                        type="number"
                        id="overallScore"
                        min="0"
                        max="9"
                        step="0.5"
                        placeholder="Calculated automatically"
                        readonly>
                </div>

            </div>


            <div class="form-group">

                <label for="facultyFeedback">
                    Faculty Feedback
                </label>

                <textarea
                    id="facultyFeedback"
                    placeholder="Write feedback for the student..."></textarea>

            </div>

            <div class="form-group">

                <label for="checkedPdf">
                    Upload Checked PDF
                </label>

                <input
                    type="file"
                    id="checkedPdf"
                    accept="application/pdf">

            </div>

           <div class="review-actions">

                <button
                    type="button"
                    class="save-button"
                    onclick="saveReview()">
                    Save Score & Feedback
                </button>

                <button
                    type="button"
                    id="viewCheckedPdfButton"
                    class="view-checked-pdf-button"
                    onclick="viewCheckedPDF()"
                    style="display:none;">
                    View Checked PDF
                </button>

            </div>

        <div
            id="message"
            class="message">
        </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://gehczgguwxqwfowmbedy.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const params = new URLSearchParams(window.location.search);

const submissionId = params.get("submission");
const paperStudentId = params.get("student");
const paperTestId = params.get("test");

let currentSubmission = null;
let isPaperSubmission = false;
let originalPdfPath = "";


function goBack() {

    window.location.href =
        "view-students.html";

}



async function loadSubmission() {
    if (submissionId) {
        const { data, error } = await supabaseClient
            .from("writing_submissions")
            .select("*")
            .eq("id", submissionId)
            .single();

        if (error || !data) {
            console.error(error);
            document.getElementById("loadingMessage").textContent =
                "Error loading submission: " +
                (error?.message || "Submission not found.");
            return;
        }

        currentSubmission = data;
        isPaperSubmission = false;
        displaySubmission(data);
        return;
    }

    if (paperStudentId && paperTestId) {
        isPaperSubmission = true;

        const { data: student, error } = await supabaseClient
            .from("students")
            .select("id, full_name")
            .eq("id", Number(paperStudentId))
            .single();

        if (error || !student) {
            console.error(error);
            document.getElementById("loadingMessage").textContent =
                "Unable to load student information.";
            return;
        }

        const { data: existing, error: existingError } =
            await supabaseClient
                .from("writing_submissions")
                .select("*")
                .eq("student_id", Number(paperStudentId))
                .eq("test_id", paperTestId)
                .maybeSingle();

        if (existingError) {
            console.error(existingError);
            document.getElementById("loadingMessage").textContent =
                "Unable to check existing writing records: " +
                existingError.message;
            return;
        }

        currentSubmission = existing || {
            student_id: student.id,
            student_name: student.full_name,
            test_id: paperTestId,
            task1_answer: "",
            task2_answer: "",
            task1_score: null,
            task2_score: null,
            overall_score: null,
            faculty_feedback: "",
            checked_pdf: null,
            original_pdf: null,
            status: "Paper submission",
            submitted_at: null
        };

        displaySubmission(currentSubmission);
        return;
    }

    document.getElementById("loadingMessage").textContent =
        "No writing submission or student/test was selected.";
}


function displaySubmission(data) {
    document.getElementById("loadingMessage").style.display = "none";
    document.getElementById("reviewContent").style.display = "block";

    document.getElementById("studentName").textContent =
        data.student_name || "Unknown Student";

    document.getElementById("studentId").textContent =
        data.student_id ?? paperStudentId ?? "N/A";

    document.getElementById("submissionDate").textContent =
        data.submitted_at
            ? new Date(data.submitted_at).toLocaleString()
            : "Paper submission";

    document.getElementById("submissionStatus").textContent =
        data.status || "Paper submission";

    originalPdfPath = data.original_pdf || "";

    document.getElementById("downloadOriginalBtn").style.display =
        originalPdfPath ? "inline-block" : "none";

    document.getElementById("task1Answer").textContent =
        data.task1_answer || "Paper submission. No online answer.";

    document.getElementById("task2Answer").textContent =
        data.task2_answer || "Paper submission. No online answer.";

    document.getElementById("task1Score").value =
        data.task1_score ?? "";

    document.getElementById("task2Score").value =
        data.task2_score ?? "";

    document.getElementById("overallScore").value =
        data.overall_score ?? "";

    document.getElementById("facultyFeedback").value =
        data.faculty_feedback || "";

    document.getElementById("viewCheckedPdfButton").style.display =
        data.checked_pdf ? "inline-block" : "none";
}



function calculateOverallScore() {
    const task1Value = document.getElementById("task1Score").value;
    const task2Value = document.getElementById("task2Score").value;
    const overallInput = document.getElementById("overallScore");

    if (task1Value === "" || task2Value === "") {
        overallInput.value = "";
        return;
    }

    const task1Score = Number(task1Value);
    const task2Score = Number(task2Value);

    if (
        !Number.isFinite(task1Score) ||
        !Number.isFinite(task2Score) ||
        task1Score < 0 || task1Score > 9 ||
        task2Score < 0 || task2Score > 9 ||
        task1Score % 0.5 !== 0 ||
        task2Score % 0.5 !== 0
    ) {
        overallInput.value = "";
        return;
    }

    overallInput.value = (task1Score + task2Score).toFixed(1);
}



async function downloadOriginalPDF() {

    if (!originalPdfPath) {
        alert("Original PDF not found.");
        return;
    }

    const { data, error } = await supabaseClient
        .storage
        .from("writing-pdfs")
        .createSignedUrl(originalPdfPath, 60);

    if (error) {
        console.error(error);
        alert("Unable to download the PDF.");
        return;
    }

    const link = document.createElement("a");
    link.href = data.signedUrl;
    link.download = originalPdfPath.split("/").pop();
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}


async function viewCheckedPDF() {

    if (!currentSubmission || !currentSubmission.checked_pdf) {

        alert("Checked PDF not found.");

        return;
    }

    const { data, error } =
        await supabaseClient
            .storage
            .from("checked-writing-pdfs")
            .createSignedUrl(
                currentSubmission.checked_pdf,
                60
            );

    if (error) {

        console.error(error);

        alert(
            "Unable to open the checked PDF."
        );

        return;
    }

    window.open(
        data.signedUrl,
        "_blank"
    );
}


async function saveReview() {

    const task1Score =
        document.getElementById("task1Score").value;

    const task2Score =
        document.getElementById("task2Score").value;

    const overallScore =
        document.getElementById("overallScore").value;

    const facultyFeedback =
        document.getElementById("facultyFeedback").value;


    const message =
        document.getElementById("message");

    const checkedPdf =
        document.getElementById("checkedPdf").files[0];

    let checkedPdfPath = currentSubmission.checked_pdf || null;

    if (checkedPdf) {

        const safeName = currentSubmission.student_name
            .replace(/[^a-zA-Z0-9 ]/g, "")
            .trim()
            .replace(/\s+/g, "_");

        const reviewTestNumber =
            currentSubmission.test_id
                .replace("writing-test-", "");

        checkedPdfPath =
            `${currentSubmission.student_id}/${safeName}_Writing_Test_${reviewTestNumber}_Reviewed.pdf`;

        const { error: uploadError } = await supabaseClient
            .storage
            .from("checked-writing-pdfs")
            .upload(checkedPdfPath, checkedPdf, {
                upsert: true
            });

        if (uploadError) {
            console.error(uploadError);     // keep this
            message.textContent = uploadError.message;
            return;
        }
    }


    message.textContent =
        "Saving...";


    
message.textContent = "Saving...";

    const reviewData = {
        task1_score:
            task1Score === "" ? null : Number(task1Score),

        task2_score:
            task2Score === "" ? null : Number(task2Score),

        overall_score:
            overallScore === "" ? null : Number(overallScore),

        faculty_feedback: facultyFeedback,
        checked_pdf: checkedPdfPath,
        status: "reviewed",
        checked_at: new Date().toISOString()
    };

    let saveError = null;

    if (currentSubmission.id) {
        const { error } = await supabaseClient
            .from("writing_submissions")
            .update(reviewData)
            .eq("id", currentSubmission.id);

        saveError = error;
    } else {
        const { data: inserted, error } = await supabaseClient
            .from("writing_submissions")
            .insert({
                ...reviewData,
                student_id: Number(currentSubmission.student_id),
                student_name: currentSubmission.student_name,
                test_id: currentSubmission.test_id,
                task1_answer: "",
                task2_answer: "",
                original_pdf: null
            })
            .select()
            .single();

        saveError = error;

        if (inserted) {
            currentSubmission = inserted;
        }
    }

    if (saveError) {
        console.error(saveError);
        message.textContent = "Error saving review: " + saveError.message;
        return;
    }

    currentSubmission = {
        ...currentSubmission,
        ...reviewData,
        checked_pdf: checkedPdfPath
    };

    document.getElementById("submissionStatus").textContent = "reviewed";

    if (checkedPdfPath) {
        document.getElementById("viewCheckedPdfButton").style.display =
            "inline-block";
    }



    /* =========================================
    UPDATE FINAL MOCK SCORE
    ========================================= */

    const testName =
        currentSubmission.test_id
            .replace("writing-", "")
            .replace(/-/g, " ")
            .replace(/\b\w/g, c => c.toUpperCase());


    const { data: testResults, error: testResultError } =
        await supabaseClient
            .from("test_results")
            .select("*")
            .eq(
                "student_id",
                Number(currentSubmission.student_id)
            )
            .eq(
                "test_name",
                testName
            );


    if (testResultError) {

        console.error(testResultError);

        message.textContent =
            "Review saved, but Final Mock could not be updated: " +
            testResultError.message;

        return;
    }


    let listeningScore = null;
    let readingScore = null;
    let speakingScore = null;

    (testResults || []).forEach(result => {

        if (
            listeningScore === null &&
            result.listening_score !== null &&
            result.listening_score !== undefined
        ) {
            listeningScore = result.listening_score;
        }

        if (
            readingScore === null &&
            result.reading_score !== null &&
            result.reading_score !== undefined
        ) {
            readingScore = result.reading_score;
        }

        if (
            speakingScore === null &&
            result.speaking_score !== null &&
            result.speaking_score !== undefined
        ) {
            speakingScore = result.speaking_score;
        }

    });


    const finalMockScore =
        calculateFinalMockScore(
            listeningScore,
            readingScore,
            Number(overallScore),
            speakingScore
        );


    if (testResults && testResults.length > 0) {

        const { error: finalMockError } =
            await supabaseClient
                .from("test_results")
                .update({
                    final_mock_score: finalMockScore
                })
                .eq(
                    "student_id",
                    Number(currentSubmission.student_id)
                )
                .eq(
                    "test_name",
                    testName
                );


        if (finalMockError) {

            console.error(finalMockError);

            message.textContent =
                "Review saved, but Final Mock could not be updated: " +
                finalMockError.message;

            return;
        }
    }


    message.textContent =
        "Review saved successfully!";

}

function getListeningBand(score) {

    score = Number(score);

    if (score >= 39) return 9.0;
    if (score >= 37) return 8.5;
    if (score >= 35) return 8.0;
    if (score >= 32) return 7.5;
    if (score >= 30) return 7.0;
    if (score >= 27) return 6.5;
    if (score >= 23) return 6.0;
    if (score >= 20) return 5.5;
    if (score >= 16) return 5.0;
    if (score >= 13) return 4.5;
    if (score >= 10) return 4.0;
    if (score >= 8) return 3.5;
    if (score >= 6) return 3.0;
    if (score >= 4) return 2.5;
    if (score >= 1) return 2.0;

    return 0.0;
}


function getReadingBand(score) {

    score = Number(score);

    if (score >= 39) return 9.0;
    if (score >= 37) return 8.5;
    if (score >= 35) return 8.0;
    if (score >= 33) return 7.5;
    if (score >= 30) return 7.0;
    if (score >= 27) return 6.5;
    if (score >= 23) return 6.0;
    if (score >= 19) return 5.5;
    if (score >= 15) return 5.0;
    if (score >= 13) return 4.5;
    if (score >= 10) return 4.0;
    if (score >= 8) return 3.5;
    if (score >= 6) return 3.0;
    if (score >= 4) return 2.5;
    if (score >= 1) return 2.0;

    return 0.0;
}


function calculateFinalMockScore(
    listeningScore,
    readingScore,
    writingScore,
    speakingScore
) {

    if (
        listeningScore === null ||
        listeningScore === undefined ||

        readingScore === null ||
        readingScore === undefined ||

        writingScore === null ||
        writingScore === undefined ||

        speakingScore === null ||
        speakingScore === undefined
    ) {
        return null;
    }

    const listeningBand =
        getListeningBand(listeningScore);

    const readingBand =
        getReadingBand(readingScore);

    const writingBand =
        Number(writingScore);

    const speakingBand =
        Number(speakingScore);

    if (
        !Number.isFinite(listeningBand) ||
        !Number.isFinite(readingBand) ||
        !Number.isFinite(writingBand) ||
        !Number.isFinite(speakingBand)
    ) {
        return null;
    }

    const average =
        (
            listeningBand +
            readingBand +
            writingBand +
            speakingBand
        ) / 4;

    // IELTS overall rounding:
    // .25 -> next .5
    // .75 -> next whole number

    return Math.round(
        (average + Number.EPSILON) * 2
    ) / 2;
}

loadSubmission();

</script>

</body>
</html>
