/* ===============================
   ANSWER NORMALIZATION
================================ */

function normalizeAnswer(answer) {
    return String(answer || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]/g, "");
}

function isCorrect(studentAnswer, acceptedAnswers) {
    const student = normalizeAnswer(studentAnswer);

    if (!student) {
        return false;
    }

    return acceptedAnswers.some(function (answer) {
        return student === normalizeAnswer(answer);
    });
}

function getPairValues(firstValue, secondValue) {
    let values = [];

    if (Array.isArray(firstValue)) {
        values = values.concat(firstValue);
    } else if (
        firstValue !== undefined &&
        firstValue !== null &&
        String(firstValue).trim() !== ""
    ) {
        values.push(firstValue);
    }

    if (Array.isArray(secondValue)) {
        values = values.concat(secondValue);
    } else if (
        secondValue !== undefined &&
        secondValue !== null &&
        String(secondValue).trim() !== ""
    ) {
        values.push(secondValue);
    }

    return values
        .map(function(value) {
            return String(value).trim().toUpperCase();
        })
        .filter(function(value) {
            return value !== "";
        });
}

function checkTwoAnswers(studentAnswers, correctAnswers) {
    if (!Array.isArray(studentAnswers)) {
        return false;
    }

    if (!Array.isArray(correctAnswers)) {
        return false;
    }

    if (studentAnswers.length !== correctAnswers.length) {
        return false;
    }

    const student = studentAnswers
        .map(normalizeAnswer)
        .sort();

    const correct = correctAnswers
        .map(normalizeAnswer)
        .sort();

    return student.every(function (answer, index) {
        return answer === correct[index];
    });
}


/* ===============================
   BAND SCORE
================================ */

function calculateBand(correctCount) {
    if (correctCount >= 39) return "9.0";
    if (correctCount >= 37) return "8.5";
    if (correctCount >= 35) return "8.0";
    if (correctCount >= 32) return "7.5";
    if (correctCount >= 30) return "7.0";
    if (correctCount >= 26) return "6.5";
    if (correctCount >= 23) return "6.0";
    if (correctCount >= 18) return "5.5";
    if (correctCount >= 16) return "5.0";
    if (correctCount >= 13) return "4.5";
    if (correctCount >= 10) return "4.0";
    if (correctCount >= 8) return "3.5";
    if (correctCount >= 6) return "3.0";
    if (correctCount >= 4) return "2.5";

    return "2.0";
}


/* ===============================
   READ SAVED ANSWERS
================================ */

function readAnswers(storageKey) {
    const raw = sessionStorage.getItem(storageKey);

    console.log(storageKey + ":", raw);

    if (!raw) return {};

    try {
        return JSON.parse(raw);
    } catch (error) {
        console.error("Could not parse " + storageKey, error);
        return {};
    }
}


/* ===============================
   CALCULATE SCORE
================================ */

async function calculateListeningScore() {

    const part1 = readAnswers("listeningPart1Answers");
    const part2 = readAnswers("listeningPart2Answers");
    const part3 = readAnswers("listeningPart3Answers");
    const part4 = readAnswers("listeningPart4Answers");

    let correctCount = 0;


    /* PART 1 */

    const part1AnswerKey = {
        q1: ["13th January", "13 January", "January 13", "January 13th", "13.01", "13.1"],
        q2: ["48"],
        q3: ["pizza"],
        q4: ["India"],
        q5: ["mirror"],
        q6: ["6th April", "6 April", "April 6", "April 6th", "06.04", "6.4"],
        q7: ["natural"],
        q8: ["67.50"],
        q9: ["shirt"],
        q10: ["hammer"]
    };

    for (let i = 1; i <= 10; i++) {
        const question = "q" + i;

        if (isCorrect(part1[question], part1AnswerKey[question])) {
            correctCount++;
        }
    }


    /* PART 2 */

    if (
        checkTwoAnswers(
            getPairValues(part2.q11, part2.q12),
            ["B", "E"]
        )
    ) {
        correctCount += 2;
    }

    if (
        checkTwoAnswers(
            getPairValues(part2.q13, part2.q14),
            ["C", "D"]
        )
    ) {
        correctCount += 2;
    }

    const part2AnswerKey = {
        q15: ["F"],
        q16: ["B"],
        q17: ["D"],
        q18: ["A"],
        q19: ["H"],
        q20: ["E"]
    };

    for (let i = 15; i <= 20; i++) {
        const question = "q" + i;

        if (isCorrect(part2[question], part2AnswerKey[question])) {
            correctCount++;
        }
    }


    /* PART 3 */

    const part3Pairs = [
        ["q21", "q22", ["B", "E"]],
        ["q23", "q24", ["C", "D"]],
        ["q25", "q26", ["A", "C"]]
    ];

    part3Pairs.forEach(function(pair) {
        if (
            checkTwoAnswers(
                getPairValues(part3[pair[0]], part3[pair[1]]),
                pair[2]
            )
        ) {
            correctCount += 2;
        }
    });

    const part3AnswerKey = {
        q27: ["C"],
        q28: ["D"],
        q29: ["F"],
        q30: ["A"]
    };

    for (let i = 27; i <= 30; i++) {
        const question = "q" + i;

        if (isCorrect(part3[question], part3AnswerKey[question])) {
            correctCount++;
        }
    }


    /* PART 4 */

    const part4AnswerKey = {
        q31: ["pollution"],
        q32: ["tax"],
        q33: ["chocolate"],
        q34: ["timing"],
        q35: ["cost"],
        q36: ["rules"],
        q37: ["diving"],
        q38: ["vegan"],
        q39: ["wifi", "wi-fi"],
        q40: ["videos"]
    };

    for (let i = 31; i <= 40; i++) {
        const question = "q" + i;

        if (isCorrect(part4[question], part4AnswerKey[question])) {
            correctCount++;
        }
    }


    /* DISPLAY RESULT */

const wrongCount = 40 - correctCount;
const bandScore = calculateBand(correctCount);

document.getElementById("correctAnswers").textContent = correctCount;
document.getElementById("wrongAnswers").textContent = wrongCount;
document.getElementById("totalScore").textContent =

document.getElementById("bandScore").textContent = bandScore;

/* =====================================
   QUESTION-BY-QUESTION ANSWER REVIEW
===================================== */

const answerReview = document.getElementById("answerReview");

if (answerReview) {
    answerReview.innerHTML = "";

    function addReviewItem(
        questionNumber,
        studentAnswer,
        correctAnswer,
        correct
    ) {
        const reviewItem = document.createElement("div");

        reviewItem.className = correct
            ? "answer-review-item correct"
            : "answer-review-item wrong";

        reviewItem.innerHTML = `
            <strong>Question ${questionNumber}</strong>
            <span class="review-status">
                ${correct ? "✓ Correct" : "✗ Wrong"}
            </span>
            <p>Your answer:
                <strong>${studentAnswer || "Not answered"}</strong>
            </p>
            <p>Correct answer:
                <strong>${correctAnswer}</strong>
            </p>
        `;

        answerReview.appendChild(reviewItem);
    }


    /* PART 1 */

    for (let i = 1; i <= 10; i++) {
        const key = "q" + i;
        const student = part1[key] || "";
        const correctAnswers = part1AnswerKey[key] || [];

        addReviewItem(
            i,
            student,
            correctAnswers.join(" / "),
            isCorrect(student, correctAnswers)
        );
    }


    /* PART 2: QUESTIONS 11–12 */

    const part2Pair1 = getPairValues(part2.q11, part2.q12);

    addReviewItem(
        "11–12",
        part2Pair1.join(", ") || "Not answered",
        "B and E",
        checkTwoAnswers(part2Pair1, ["B", "E"])
    );


    /* PART 2: QUESTIONS 13–14 */

    const part2Pair2 = getPairValues(part2.q13, part2.q14);

    addReviewItem(
        "13–14",
        part2Pair2.join(", ") || "Not answered",
        "C and D",
        checkTwoAnswers(part2Pair2, ["C", "D"])
    );


    /* PART 2: QUESTIONS 15–20 */

    for (let i = 15; i <= 20; i++) {
        const key = "q" + i;
        const student = part2[key] || "";
        const correctAnswers = part2AnswerKey[key] || [];

        addReviewItem(
            i,
            student,
            correctAnswers.join(" / "),
            isCorrect(student, correctAnswers)
        );
    }


    /* PART 3: QUESTIONS 21–22 */

    const part3Pair1 = getPairValues(part3.q21, part3.q22);

    addReviewItem(
        "21–22",
        part3Pair1.join(", ") || "Not answered",
        "B and E",
        checkTwoAnswers(part3Pair1, ["B", "E"])
    );


    /* PART 3: QUESTIONS 23–24 */

    const part3Pair2 = getPairValues(part3.q23, part3.q24);

    addReviewItem(
        "23–24",
        part3Pair2.join(", ") || "Not answered",
        "C and D",
        checkTwoAnswers(part3Pair2, ["C", "D"])
    );


    /* PART 3: QUESTIONS 25–26 */

    const part3Pair3 = getPairValues(part3.q25, part3.q26);

    addReviewItem(
        "25–26",
        part3Pair3.join(", ") || "Not answered",
        "A and C",
        checkTwoAnswers(part3Pair3, ["A", "C"])
    );


    /* PART 3: QUESTIONS 27–30 */

    for (let i = 27; i <= 30; i++) {
        const key = "q" + i;
        const student = part3[key] || "";
        const correctAnswers = part3AnswerKey[key] || [];

        addReviewItem(
            i,
            student,
            correctAnswers.join(" / "),
            isCorrect(student, correctAnswers)
        );
    }


    /* PART 4: QUESTIONS 31–40 */

    for (let i = 31; i <= 40; i++) {
        const key = "q" + i;
        const student = part4[key] || "";
        const correctAnswers = part4AnswerKey[key] || [];

        addReviewItem(
            i,
            student,
            correctAnswers.join(" / "),
            isCorrect(student, correctAnswers)
        );
    }
}

/* ===============================
   SAVE RESULT TO SUPABASE
================================ */

async function saveResultToSupabase(score) {

    if (
        sessionStorage.getItem("listeningTest1ResultSaved") === "true"
    ) {
        console.log("Result already saved.");
        return;
    }

    const studentId = sessionStorage.getItem("studentId");
    const studentName = sessionStorage.getItem("studentName");

    const resultData = {
        student_id: studentId ? Number(studentId) : null,
        student_name: studentName,
        test_name: "Test 1",
        listening_score: score
    };

    console.log("Data being sent to Supabase:", resultData);

    const { error } = await supabaseClient
        .from("test_results")
        .insert(resultData);

    if (error) {
        console.error("Error saving result:", error);
        return;
    }

    sessionStorage.setItem(
        "listeningTest1ResultSaved",
        "true"
    );

    console.log("Result saved successfully.");
}


/* ===============================
   START CALCULATION
================================ */

document.addEventListener("DOMContentLoaded", function() {
    calculateListeningScore();
});
