<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Test Result</title>

    <style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:30px 16px;
    font-family:Arial,sans-serif;

    background:
        radial-gradient(circle at top left,
            rgba(168,101,131,.10),
            transparent 35%),
        radial-gradient(circle at bottom right,
            rgba(111,143,122,.10),
            transparent 35%),
        radial-gradient(circle at top right,
            rgba(142,122,181,.08),
            transparent 30%),
        #F9F8FA;

    color:#4F5E52;
}

/* =====================================
   HEADER
===================================== */

.result-header{
    width:100%;
    height:68px;
    padding:0 24px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,.78);
    backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,.85);
    border-radius:18px;

    box-shadow:0 8px 22px rgba(93,62,80,.05);

    margin:0 auto 22px;
    max-width:980px;
}

.result-logo{
    font-size:20px;
    font-weight:700;
    color:#5D3E50;
}

.result-header-links{
    display:flex;
    gap:22px;
}

.result-header-links a{
    color:#64746B;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.result-header-links a:hover{
    color:#8E7AB5;
}

/* =====================================
   MAIN CARD
===================================== */

.result-card{
    width:100%;
    max-width:760px;
    margin:auto;

    padding:38px 32px;

    background:rgba(255,255,255,.82);
    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,.9);
    border-radius:24px;

    box-shadow:0 14px 34px rgba(93,62,80,.06);
}

h1{
    margin:0 0 32px;
    text-align:center;

    color:#5D3E50;
    font-size:32px;
}

h2{
    margin:40px 0 22px;
    color:#5D3E50;
    font-size:24px;
}

/* =====================================
   SCORE LINES
===================================== */

.result-line{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:16px 4px;

    border-bottom:1px solid #ECE4EA;

    font-size:17px;
    color:#5F6D64;
}

.result-line span{
    font-weight:700;
    color:#8A4F67;
}

.band-line{
    margin-top:12px;
    padding-top:22px;

    border-top:1px solid #E6ECE7;
    border-bottom:none;

    font-size:20px;
}

.band-line span{
    font-size:28px;
    color:#6F8F7A;
}

/* =====================================
   ANSWER REVIEW
===================================== */

.answer-review-section{
    margin-top:34px;
}

.answer-review-item{
    margin-bottom:14px;
    padding:16px 18px;

    border-left:4px solid;
    border-radius:14px;
}

.answer-review-item.correct{
    background:#F3F8F4;
    border-left-color:#7C9A83;
}

.answer-review-item.wrong{
    background:#FCF5F7;
    border-left-color:#B27B92;
}

.review-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
}

.review-status{
    font-weight:700;
    font-size:14px;
}

.correct .review-status{
    color:#6F8F7A;
}

.wrong .review-status{
    color:#A86583;
}

.answer-review-item p{
    margin:6px 0;
    color:#5F6D64;
    line-height:1.6;
}

.answer-review-item strong{
    color:#5D3E50;
}

/* =====================================
   BUTTON
===================================== */

.home-button{
    display:block;
    width:fit-content;

    margin:34px auto 0;
    padding:13px 28px;

    border-radius:999px;

    background:linear-gradient(
        135deg,
        #A86583,
        #8E7AB5
    );

    color:#FFFFFF;
    text-decoration:none;
    font-weight:600;

    transition:.25s ease;
}

.home-button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(168,101,131,.18);
}

/* =====================================
   MOBILE
===================================== */

@media (max-width:600px){

    body{
        padding:18px 12px;
    }

    .result-header{
        height:auto;
        padding:16px;
        flex-direction:column;
        gap:12px;
    }

    .result-card{
        padding:26px 20px;
    }

    h1{
        font-size:28px;
    }

    h2{
        font-size:21px;
    }

    .result-line{
        font-size:16px;
    }

    .review-header{
        flex-direction:column;
        align-items:flex-start;
    }

}
    </style>
</head>

<body>

    <header class="result-header">

        <div class="result-logo">
            IELTS Practice
        </div>

        <div class="result-header-links">

            <a href="../student-dashboard.html">
                Dashboard
            </a>

            <a href="../index.html">
                Logout
            </a>

        </div>

    </header>

    <div class="result-card">

        <h1>Listening Test Result</h1>

        <div class="result-line">
            <strong>Correct Answers:</strong>
            <span id="correctAnswers">0</span>
        </div>

        <div class="result-line">
            <strong>Wrong Answers:</strong>
            <span id="wrongAnswers">0</span>
        </div>

        <div class="result-line">
            <strong>Total Score:</strong>
            <span id="totalScore">0 / 40</span>
        </div>

        <div class="result-line band-line">
            <strong>IELTS Band:</strong>
            <span id="bandScore">2.0</span>
        </div>

        <div class="answer-review-section">
            <h2>Answer Review</h2>
            <div id="answerReview"></div>
        </div>

        <a href="../submitted-tests.html" class="home-button">
            View Submitted Tests
        </a>
        

    </div>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        /* ===============================
           SUPABASE CONNECTION
        =============================== */

        const SUPABASE_URL = "https://gehczgguwxqwfowmbedy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        /* ===============================
           ANSWER NORMALIZATION
        =============================== */

        function normalizeAnswer(answer) {
            return String(answer || "")
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]/g, "");
        }


        function isCorrect(studentAnswer, acceptedAnswers) {
            const student = normalizeAnswer(studentAnswer);

            if (!student) {
                return false;
            }

            return acceptedAnswers.some(function(answer) {
                return student === normalizeAnswer(answer);
            });
        }


        /* Check a pair without depending on order. */

        function scorePair(studentAnswers, correctAnswers) {

            const studentValues = studentAnswers
                .map(function(answer) {
                    return normalizeAnswer(answer);
                })
                .filter(function(answer) {
                    return answer !== "";
                });

            const correctValues = correctAnswers
                .map(function(answer) {
                    return normalizeAnswer(answer);
                });

            let score = 0;
            const usedCorrectIndexes = [];

            studentValues.forEach(function(studentAnswer) {

                for (
                    let i = 0;
                    i < correctValues.length;
                    i++
                ) {

                    if (
                        studentAnswer === correctValues[i] &&
                        !usedCorrectIndexes.includes(i)
                    ) {
                        score++;
                        usedCorrectIndexes.push(i);
                        break;
                    }
                }

            });

            return score;
        }


        /*
         * Check one individual answer from a pair.
         *
         * This is used for the review display.
         */

        function pairAnswerIsCorrect(
            studentAnswer,
            correctAnswers,
            otherStudentAnswer
        ) {

            const student = normalizeAnswer(studentAnswer);

            if (!student) {
                return false;
            }

            const other = normalizeAnswer(otherStudentAnswer);

            const correctValues = correctAnswers.map(function(answer) {
                return normalizeAnswer(answer);
            });

            if (!correctValues.includes(student)) {
                return false;
            }

            /*
             * If both selected answers are the same,
             * only one copy can receive credit.
             */

            if (student === other) {
                return false;
            }

            return true;
        }


        /* ===============================
           BAND SCORE
        =============================== */

        function calculateBand(correctCount) {

            if (correctCount >= 39) return "9.0";
            if (correctCount >= 37) return "8.5";
            if (correctCount >= 35) return "8.0";
            if (correctCount >= 32) return "7.5";
            if (correctCount >= 30) return "7.0";
            if (correctCount >= 26) return "6.5";
            if (correctCount >= 23) return "6.0";
            if (correctCount >= 18) return "5.5";
            if (correctCount >= 16) return "5.0";
            if (correctCount >= 13) return "4.5";
            if (correctCount >= 10) return "4.0";
            if (correctCount >= 8) return "3.5";
            if (correctCount >= 6) return "3.0";
            if (correctCount >= 4) return "2.5";

            return "2.0";
        }


        /* ===============================
           READ SAVED ANSWERS
        =============================== */

        function readAnswers(storageKey) {

            const raw = sessionStorage.getItem(storageKey);

            if (!raw) {
                console.warn(
                    "No saved answers found for:",
                    storageKey
                );

                return {};
            }

            try {
                return JSON.parse(raw);
            } catch (error) {
                console.error(
                    "Could not parse:",
                    storageKey,
                    error
                );

                return {};
            }
        }


        /* ===============================
           ANSWER REVIEW ITEM
        =============================== */

        function addReviewItem(
            questionNumber,
            studentAnswer,
            correctAnswer,
            correct
        ) {

            const answerReview =
                document.getElementById("answerReview");

            if (!answerReview) return;

            const reviewItem =
                document.createElement("div");

            reviewItem.className =
                correct
                    ? "answer-review-item correct"
                    : "answer-review-item wrong";

            const displayedStudentAnswer =
                studentAnswer && String(studentAnswer).trim() !== ""
                    ? studentAnswer
                    : "Not answered";

            reviewItem.innerHTML = `
                <div class="review-header">
                    <strong>Question ${questionNumber}</strong>
                    <span class="review-status">
                        ${correct ? "✓ Correct" : "✗ Wrong"}
                    </span>
                </div>

                <p>
                    Your answer:
                    <strong>${displayedStudentAnswer}</strong>
                </p>

                <p>
                    Correct answer:
                    <strong>${correctAnswer}</strong>
                </p>
            `;

            answerReview.appendChild(reviewItem);
        }


        /* ===============================
           MAIN SCORE CALCULATION
        =============================== */

        async function calculateListeningScore() {

            const part1 =
                readAnswers("listeningPart1Answers");

            const part2 =
                readAnswers("listeningPart2Answers");

            const part3 =
                readAnswers("listeningPart3Answers");

            const part4 =
                readAnswers("listeningPart4Answers");

            let correctCount = 0;


            /* ===============================
               PART 1: QUESTIONS 1–10
            =============================== */

            const part1AnswerKey = {
                q1: ["13th January", "13 January", "January 13", "January 13th", "13.01", "13.1"],
                q2: ["48"],
                q3: ["pizza"],
                q4: ["India"],
                q5: ["mirror"],
                q6: ["6th April", "6 April", "April 6", "April 6th", "06.04", "6.4"],
                q7: ["natural"],
                q8: ["67.50"],
                q9: ["shirt"],
                q10: ["hammer"]
            };

            for (let i = 1; i <= 10; i++) {

                const key = "q" + i;

                const student = part1[key] || "";

                const accepted = part1AnswerKey[key];

                const correct = isCorrect(
                    student,
                    accepted
                );

                if (correct) {
                    correctCount++;
                }

                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );
            }


            /* ===============================
               PART 2: QUESTIONS 11–12
            =============================== */

            const part2Pair1 = [
                part2.q11 || "",
                part2.q12 || ""
            ];

            const part2Pair1CorrectAnswers = ["B", "E"];

            correctCount += scorePair(
                part2Pair1,
                part2Pair1CorrectAnswers
            );

            const part2Pair1Student1Correct =
                isCorrect(
                    part2.q11,
                    part2Pair1CorrectAnswers
                );

            const part2Pair1Student2Correct =
                isCorrect(
                    part2.q12,
                    part2Pair1CorrectAnswers
                );

            addReviewItem(
                11,
                part2.q11,
                "B or E",
                part2Pair1Student1Correct
            );

            addReviewItem(
                12,
                part2.q12,
                "B or E",
                part2Pair1Student2Correct
            );


            /* ===============================
               PART 2: QUESTIONS 13–14
            =============================== */

            const part2Pair2 = [
                part2.q13 || "",
                part2.q14 || ""
            ];

            const part2Pair2CorrectAnswers = ["C", "D"];

            correctCount += scorePair(
                part2Pair2,
                part2Pair2CorrectAnswers
            );

            addReviewItem(
                13,
                part2.q13,
                "C or D",
                isCorrect(
                    part2.q13,
                    part2Pair2CorrectAnswers
                )
            );

            addReviewItem(
                14,
                part2.q14,
                "C or D",
                isCorrect(
                    part2.q14,
                    part2Pair2CorrectAnswers
                )
            );


            /* ===============================
               PART 2: QUESTIONS 15–20
            =============================== */

            const part2AnswerKey = {
                q15: ["F"],
                q16: ["B"],
                q17: ["D"],
                q18: ["A"],
                q19: ["H"],
                q20: ["E"]
            };

            for (let i = 15; i <= 20; i++) {

                const key = "q" + i;

                const student = part2[key] || "";

                const accepted = part2AnswerKey[key];

                const correct = isCorrect(
                    student,
                    accepted
                );

                if (correct) {
                    correctCount++;
                }

                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );
            }


            /* ===============================
               PART 3: QUESTIONS 21–22
            =============================== */

            const part3Pair1 = [
                part3.q21 || "",
                part3.q22 || ""
            ];

            const part3Pair1CorrectAnswers = ["B", "E"];

            correctCount += scorePair(
                part3Pair1,
                part3Pair1CorrectAnswers
            );

            addReviewItem(
                21,
                part3.q21,
                "B or E",
                isCorrect(
                    part3.q21,
                    part3Pair1CorrectAnswers
                )
            );

            addReviewItem(
                22,
                part3.q22,
                "B or E",
                isCorrect(
                    part3.q22,
                    part3Pair1CorrectAnswers
                )
            );


            /* ===============================
               PART 3: QUESTIONS 23–24
            =============================== */

            const part3Pair2 = [
                part3.q23 || "",
                part3.q24 || ""
            ];

            const part3Pair2CorrectAnswers = ["C", "D"];

            correctCount += scorePair(
                part3Pair2,
                part3Pair2CorrectAnswers
            );

            addReviewItem(
                23,
                part3.q23,
                "C or D",
                isCorrect(
                    part3.q23,
                    part3Pair2CorrectAnswers
                )
            );

            addReviewItem(
                24,
                part3.q24,
                "C or D",
                isCorrect(
                    part3.q24,
                    part3Pair2CorrectAnswers
                )
            );


            /* ===============================
               PART 3: QUESTIONS 25–26
            =============================== */

            const part3Pair3 = [
                part3.q25 || "",
                part3.q26 || ""
            ];

            const part3Pair3CorrectAnswers = ["A", "C"];

            correctCount += scorePair(
                part3Pair3,
                part3Pair3CorrectAnswers
            );

            addReviewItem(
                25,
                part3.q25,
                "A or C",
                isCorrect(
                    part3.q25,
                    part3Pair3CorrectAnswers
                )
            );

            addReviewItem(
                26,
                part3.q26,
                "A or C",
                isCorrect(
                    part3.q26,
                    part3Pair3CorrectAnswers
                )
            );


            /* ===============================
               PART 3: QUESTIONS 27–30
            =============================== */

            const part3AnswerKey = {
                q27: ["C"],
                q28: ["D"],
                q29: ["F"],
                q30: ["A"]
            };

            for (let i = 27; i <= 30; i++) {

                const key = "q" + i;

                const student = part3[key] || "";

                const accepted = part3AnswerKey[key];

                const correct = isCorrect(
                    student,
                    accepted
                );

                if (correct) {
                    correctCount++;
                }

                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );
            }


            /* ===============================
               PART 4: QUESTIONS 31–40
            =============================== */

            const part4AnswerKey = {
                q31: ["pollution"],
                q32: ["tax"],
                q33: ["chocolate"],
                q34: ["timing"],
                q35: ["cost"],
                q36: ["rules"],
                q37: ["diving"],
                q38: ["vegan"],
                q39: ["wifi", "wi-fi"],
                q40: ["videos"]
            };

            for (let i = 31; i <= 40; i++) {

                const key = "q" + i;

                const student = part4[key] || "";

                const accepted = part4AnswerKey[key];

                const correct = isCorrect(
                    student,
                    accepted
                );

                if (correct) {
                    correctCount++;
                }

                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );
            }


            /* ===============================
               DISPLAY FINAL SCORE
            =============================== */

            const wrongCount = 40 - correctCount;

            document.getElementById("correctAnswers").textContent =
                correctCount;

            document.getElementById("wrongAnswers").textContent =
                wrongCount;

            document.getElementById("totalScore").textContent =
                correctCount + " / 40";

            document.getElementById("bandScore").textContent =
                calculateBand(correctCount);

            console.log(
                "FINAL LISTENING SCORE:",
                correctCount + " / 40"
            );


            /* ===============================
               SAVE RESULT TO SUPABASE
            =============================== */

            await saveResultToSupabase(correctCount);
        }


        /* ===============================
           SAVE RESULT TO SUPABASE
        =============================== */

        async function saveResultToSupabase(score) {

            if (
                sessionStorage.getItem(
                    "listeningTest1ResultSaved"
                ) === "true"
            ) {
                console.log("Listening result already saved.");
                return;
            }

            const studentId =
                sessionStorage.getItem("studentId");

            const studentName =
                sessionStorage.getItem("studentName");

            const resultData = {
                student_id: studentId
                    ? Number(studentId)
                    : null,

                student_name: studentName,

                test_name: "Test 1",

                test_date: new Date().toISOString().split("T")[0],

                listening_score: score,

                is_submitted: true
            };

            console.log(
                "Data being sent to Supabase:",
                resultData
            );

            const { error } = await supabaseClient
                .from("test_results")
                .insert(resultData);

            if (error) {
                console.error(
                    "Error saving listening result:",
                    error
                );

                return;
            }

            sessionStorage.setItem(
                "listeningTest1ResultSaved",
                "true"
            );

            console.log(
                "Listening result saved successfully."
            );
        }


        /* ===============================
           START CALCULATION
        =============================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {
                calculateListeningScore();
            }
        );

    </script>

</body>
</html>
