<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>IELTS Listening Test 1</title>

  <link rel="stylesheet" href="../css/style.css" />

</head>


<body>

<script>
    (function () {
        const accessKey = "access_listening-test-1";

        if (sessionStorage.getItem(accessKey) !== "true") {
            window.location.replace(
                "../test-access.html?test=listening-test-1"
            );
        }
    })();
</script>

<header class="main-header">

  <div class="logo">IELTS Practice</div>

  <div class="header-right">

    <div class="listening-highlight-controls">

      <button id="listeningHighlightToggle"
              aria-label="Highlight text"
              title="Highlight text">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <g transform="rotate(-35 12 12)">
            <rect x="8" y="2" width="8" height="13" rx="2" fill="#F3D36A"/>
            <rect x="8" y="15" width="8" height="5" fill="#C89B00"/>
            <polygon points="8,20 16,20 12,23" fill="#8B6B00"/>
          </g>
        </svg>
      </button>

      <button id="listeningClearHighlights"
              aria-label="Clear highlights"
              title="Clear highlights">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 16L15 8L20 13L12 21H7L3 17L11 9"
                fill="none"
                stroke="#5F5B55"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"/>
          <path d="M7 21H18"
                stroke="#5F5B55"
                stroke-width="2"
                stroke-linecap="round"/>
        </svg>
      </button>

    </div>

    <div class="header-timer">
      <span>Time Remaining</span>
      <strong id="timer">--:--</strong>
    </div>

    <a href="../student-dashboard.html">Dashboard</a>
    <a href="../index.html">Logout</a>

</div>

</header>


<div class="listening-section-navigation">

  <strong>Go to:</strong>

  <button class="section-jump-button active-section"
          onclick="loadPart(1,this)">
    Part 1
  </button>

  <button class="section-jump-button"
          onclick="loadPart(2,this)">
    Part 2
  </button>

  <button class="section-jump-button"
          onclick="loadPart(3,this)">
    Part 3
  </button>

  <button class="section-jump-button"
          onclick="loadPart(4,this)">
    Part 4
  </button>

</div>


<section class="listening-card audio-section">

  <h2>Listening Audio</h2>

  <div class="audio-player-container">

    <p id="audioStatus" class="audio-status">
      Press Play to begin the listening test
    </p>

    <div class="custom-audio-player">

      <button id="playPauseBtn"
              class="audio-play-btn">
        ▶ Play
      </button>

      <div class="audio-progress-container">
        <div id="audioProgress"
             class="audio-progress">
        </div>
      </div>

      <span id="audioTime"
            class="audio-time">
        0:00
      </span>

    </div>

    <audio id="listeningAudio" preload="auto">
      <source src="../assets/listening-test-1.mp3"
              type="audio/mpeg">
    </audio>

  </div>

</section>


<iframe id="partFrame"
        src="listening-test-1.html"
        style="width:100%; border:none; overflow:hidden;"
        scrolling="no">
</iframe>


<script>

let timeLeft = 30 * 60;
let timerStarted = false;
let timerInterval;

const audio = document.getElementById("listeningAudio");
const timer = document.getElementById("timer");
const playBtn = document.getElementById("playPauseBtn");
const progress = document.getElementById("audioProgress");
const audioTime = document.getElementById("audioTime");
const frame = document.getElementById("partFrame");


function updateTimer(){

    const m = Math.floor(timeLeft/60);
    const s = timeLeft%60;

    timer.textContent =
        String(m).padStart(2,"0")+":"+
        String(s).padStart(2,"0");
}


function startTimer(){

    if(timerStarted) return;

    timerStarted = true;

    updateTimer();

    timerInterval = setInterval(()=>{

        timeLeft--;

        updateTimer();

        if(timeLeft<=0){

            clearInterval(timerInterval);

            audio.pause();

            window.location.href="listening-final.html";

        }

    },1000);

}


playBtn.onclick = ()=>{

    if(timerStarted) return;

    audio.play();

    startTimer();

    playBtn.disabled=true;
    playBtn.textContent="Playing...";

};


audio.addEventListener("timeupdate",()=>{

    if(audio.duration){

        progress.style.width =
            (audio.currentTime/audio.duration)*100+"%";

    }

    const m=Math.floor(audio.currentTime/60);
    const s=Math.floor(audio.currentTime%60);

    audioTime.textContent =
        m+":"+String(s).padStart(2,"0");

});


function resizeFrame() {
    try {
        const doc = frame.contentWindow.document;

        // Reset first so it can shrink
        frame.style.height = "0px";

        requestAnimationFrame(() => {
            const height = Math.max(
                doc.body.scrollHeight,
                doc.documentElement.scrollHeight
            );

            frame.style.height = height + "px";
        });

    } catch (e) {}
}

function loadPart(part, button) {

    document
      .querySelectorAll(".section-jump-button")
      .forEach(btn => btn.classList.remove("active-section"));

    button.classList.add("active-section");

    frame.src = `listening-test-${part}.html`;
}

frame.addEventListener("load", function () {
    resizeFrame();

    // keep resizing in case images/fonts finish loading
    setTimeout(resizeFrame, 100);
    setTimeout(resizeFrame, 300);
    setTimeout(resizeFrame, 600);
});

// initial resize
window.addEventListener("load", resizeFrame);
window.addEventListener("resize", resizeFrame);

</script>

</body>
</html>
