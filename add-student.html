<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - IELTS Practice</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">IELTS Practice</div>

        <nav>
            <a href="faculty-dashboard.html">Dashboard</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main class="login-page">

        <div class="login-container">

            <p class="small-heading">STUDENT MANAGEMENT</p>

            <h1>Add Student</h1>

            <p class="login-subtitle">
                Create login credentials for a new student.
            </p>

            <form class="auth-form">

                <label for="student-name">Student Name</label>
                <input
                    type="text"
                    id="student-name"
                    placeholder="Enter student's full name"
                    required
                >

                <label for="student-username">Student ID / Username</label>
                <input
                    type="text"
                    id="student-username"
                    placeholder="Create a student username"
                    required
                >

                <label for="student-password">Password</label>
                <input
                    type="password"
                    id="student-password"
                    placeholder="Create a password"
                    required
                >

                <button type="submit" class="primary-btn">
                    Create Student Account
                </button>

            </form>

        </div>

    </main>

</body>
</html>
