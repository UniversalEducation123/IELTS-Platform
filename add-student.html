<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - IELTS Practice</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const facultyId = sessionStorage.getItem("facultyId");

    if (!facultyId) {
        window.location.href = "faculty-login.html";
    }
</script>
</head>
<body>

    <header class="navbar">
        <div class="logo">IELTS Practice</div>

        <nav>
            <a href="faculty-dashboard.html">Dashboard</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main class="login-page">

        <div class="login-container">

            <p class="small-heading">STUDENT MANAGEMENT</p>

            <h1>Add Student</h1>

            <p class="login-subtitle">
                Create login credentials for a new student.
            </p>

            <form class="auth-form" id="addStudentForm">

                <label for="student-name">Student Name</label>
                <input
                    type="text"
                    id="student-name"
                    placeholder="Enter student's full name"
                    required
                >

                <label for="student-username">Student ID / Username</label>
                <input
                    type="text"
                    id="student-username"
                    placeholder="Create a student username"
                    required
                >

                <label for="student-password">Password</label>
                <input
                    type="password"
                    id="student-password"
                    placeholder="Create a password"
                    required
                >

                <button type="submit" class="primary-btn">
                    Create Student Account
                </button>

                <p id="studentMessage"></p>

            </form>

        </div>

    </main>

    <script>
        const SUPABASE_URL = "https://gehczgguwxqwfowmbedy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        const addStudentForm =
            document.getElementById("addStudentForm");

        const studentMessage =
            document.getElementById("studentMessage");

        addStudentForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const full_name =
                document.getElementById("student-name").value.trim();

            const username =
                document.getElementById("student-username").value.trim();

            const password =
                document.getElementById("student-password").value.trim();

            studentMessage.textContent = "Creating student account...";
            studentMessage.style.color = "green";

            const { error } = await supabaseClient
                .from("students")
                .insert([
                    {
                        full_name: full_name,
                        username: username,
                        password: password
                    }
                ]);

            if (error) {
                console.error("Add student error:", error);
                studentMessage.textContent =
                    "Error: " + error.message;
                studentMessage.style.color = "red";
                return;
            }

            studentMessage.textContent =
                "Student account created successfully!";
            studentMessage.style.color = "green";

            addStudentForm.reset();
        });
    </script>

</body>
</html>
