<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students - IELTS Practice</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const facultyId = sessionStorage.getItem("facultyId");

    if (!facultyId) {
        window.location.href = "faculty-login.html";
    }
</script>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
    <img src="assets/logo.png" alt="Universal Education Logo">
</a>

        <nav>
            <a href="faculty-dashboard.html">Dashboard</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main class="dashboard-page">

        <div class="dashboard-container">

            <p class="small-heading">STUDENT MANAGEMENT</p>

            <h1>View Students</h1>

            <p class="dashboard-subtitle">
                View student accounts and their test scores.
            </p>

            <!-- Test filter buttons -->
<div class="test-filter-buttons">

    <button
        type="button"
        class="test-filter-button active"
        onclick="showTestResults('Test 1', this)">
        Test 1
    </button>

    <button
        type="button"
        class="test-filter-button"
        onclick="showTestResults('Test 2', this)">
        Test 2
    </button>

    <button
        type="button"
        class="test-filter-button"
        onclick="showTestResults('Test 3', this)">
        Test 3
    </button>

    <button
        type="button"
        class="test-filter-button"
        onclick="showTestResults('ALL', this)">
        All Tests
    </button>

</div>

<div id="loadingMessage">
    Loading students...
</div>

<div class="student-list" id="studentList"></div>

        </div>

    </main>

    <script>
        const SUPABASE_URL = "https://gehczgguwxqwfowmbedy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

        const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

let allStudents = [];
let allResults = [];
let allWritingSubmissions = [];
let selectedTest = "Test 1";


// Load students and test results
async function loadStudentsAndResults() {
    const loadingMessage = document.getElementById("loadingMessage");
    const studentList = document.getElementById("studentList");

    loadingMessage.style.display = "block";
    studentList.innerHTML = "";

    const { data: students, error: studentsError } =
        await supabaseClient
            .from("students")
            .select("*")
            .order("id", { ascending: true });

    if (studentsError) {
        loadingMessage.textContent =
            "Error loading students: " + studentsError.message;
        return;
    }

    const { data: results, error: resultsError } =
        await supabaseClient
            .from("test_results")
            .select("*")
            .eq("is_submitted", true)
            .order("id", { ascending: true });

    if (resultsError) {
        loadingMessage.textContent =
            "Error loading test results: " + resultsError.message;
        return;
    }

    const { data: writingSubmissions, error: writingError } =
        await supabaseClient
            .from("writing_submissions")
            .select("*")
            .order("submitted_at", { ascending: false });

    if (writingError) {
        loadingMessage.textContent =
            "Error loading writing submissions: " + writingError.message;
        return;
    }

allWritingSubmissions = writingSubmissions || [];

    allStudents = students || [];
    allResults = results || [];

    loadingMessage.style.display = "none";

    showTestResults(selectedTest);
}


// Show results according to selected test
function showTestResults(testName, clickedButton = null) {

    selectedTest = testName;

    /* =================================
       UPDATE ACTIVE FILTER BUTTON
    ================================= */

    document.querySelectorAll(".test-filter-button").forEach(button => {
        button.classList.remove("active");
    });

    if (clickedButton) {

        clickedButton.classList.add("active");

    } else {

        const firstButton = document.querySelector(
            `.test-filter-button[onclick*="'${testName}'"]`
        );

        if (firstButton) {
            firstButton.classList.add("active");
        }

    }


    const studentList =
        document.getElementById("studentList");


    /* =================================
       FILTER RESULTS
    ================================= */

    let filteredResults;

    if (testName === "ALL") {

        filteredResults = allResults;

    } else {

        filteredResults =
            allResults.filter(result =>
                result.test_name === testName
            );

    }


    /* =================================
       GROUP BY STUDENT + TEST
       
       This combines separate Listening
       and Reading rows into ONE card.
    ================================= */

    const groupedResults = {};

    filteredResults.forEach(result => {

        const studentId =
            String(result.student_id);

        const currentTest =
            result.test_name || "Unnamed Test";

        const groupKey =
            studentId + "_" + currentTest;


        if (!groupedResults[groupKey]) {

            groupedResults[groupKey] = {

                student_id:
                    result.student_id,

                student_name:
                    result.student_name,

                test_name:
                    currentTest,

                test_date:
                    result.test_date || null,

                listening_score:
                    null,

                reading_score:
                    null,

                writing_score:
                    null

            };

        }


        const grouped =
            groupedResults[groupKey];


        /* =========================
           KEEP THE TEST DATE
        ========================= */

        if (
            !grouped.test_date &&
            result.test_date
        ) {

            grouped.test_date =
                result.test_date;

        }


        /* =========================
           COMBINE LISTENING
        ========================= */

        if (
            result.listening_score !== null &&
            result.listening_score !== undefined
        ) {

            grouped.listening_score =
                result.listening_score;

        }


        /* =========================
           COMBINE READING
        ========================= */

        if (
            result.reading_score !== null &&
            result.reading_score !== undefined
        ) {

            grouped.reading_score =
                result.reading_score;

        }


        /* =========================
           KEEP WRITING SCORE
        ========================= */

        if (
            result.writing_score !== null &&
            result.writing_score !== undefined
        ) {

            grouped.writing_score =
                result.writing_score;

        }

    });


    const groupedResultList =
        Object.values(groupedResults);


    /* =================================
       NO RESULTS
    ================================= */

    if (groupedResultList.length === 0) {

        studentList.innerHTML = `

            <div class="no-students-message">

                No results found for
                ${
                    testName === "ALL"
                        ? "any test"
                        : testName
                }.

            </div>

        `;

        return;

    }


    studentList.innerHTML = "";


    /* =================================
       CREATE ONE CARD PER TEST
    ================================= */

    groupedResultList.forEach(result => {


        /* =============================
           FIND STUDENT
        ============================= */

        const student =
            allStudents.find(
                student =>
                    Number(student.id) ===
                    Number(result.student_id)
            );


        /* =============================
           MATCH CORRECT WRITING TEST
        ============================= */

        const writingTestId =
            "writing-" +
            String(result.test_name || "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, "-");


        const writingSubmission =
            allWritingSubmissions.find(
                submission =>

                    String(submission.student_id) ===
                        String(result.student_id)

                    &&

                    String(submission.test_id) ===
                        writingTestId
            );


        /* =============================
           STUDENT DETAILS
        ============================= */

        const studentName =
            result.student_name ||
            (
                student
                    ? student.full_name
                    : "Unknown Student"
            );


        const username =
            student && student.username
                ? student.username
                : "N/A";


        /* =============================
           SCORES
        ============================= */

        const listeningScore =
            result.listening_score;

        const readingScore =
            result.reading_score;

        const writingScore =
            result.writing_score;


        /* =============================
           BANDS
        ============================= */

        const listeningBand =
            listeningScore !== null &&
            listeningScore !== undefined

                ? getListeningBand(listeningScore)

                : "Not submitted";


        const readingBand =
            readingScore !== null &&
            readingScore !== undefined

                ? getReadingBand(readingScore)

                : "Not submitted";


        /* =============================
           CREATE CARD
        ============================= */

        const studentCard =
            document.createElement("div");


        studentCard.className =
            "student-card";


        studentCard.innerHTML = `

            <div class="student-card-header">

                <div>

                    <h2>
                        ${escapeHTML(studentName)}
                    </h2>

                    <p>
                        Username:
                        ${escapeHTML(username)}
                    </p>

                    <p>
                        Student ID:
                        ${result.student_id}
                    </p>

                </div>


                <button
                    type="button"
                    class="delete-test-button"
                    onclick="
                        deleteTestResult(
                            ${result.student_id},
                            '${escapeHTML(result.test_name)}'
                        )
                    "
                >
                    Delete This Test
                </button>

            </div>


            <div class="test-result-card">

                <h3>
                    ${escapeHTML(
                        result.test_name ||
                        "Unnamed Test"
                    )}
                </h3>


                <p class="test-date">

                    Test Date:

                    ${
                        result.test_date

                            ? new Date(
                                result.test_date +
                                "T00:00:00"
                            ).toLocaleDateString()

                            : "Not available"
                    }

                </p>


                <div class="score-grid">


                    <!-- =====================
                         LISTENING
                    ====================== -->

                    <div class="score-item">

                        <strong>
                            Listening
                        </strong>


                        <span>

                            ${
                                listeningScore !== null &&
                                listeningScore !== undefined

                                    ? listeningScore + " / 40"

                                    : "Not submitted"
                            }

                        </span>


                        <small>

                            Band:
                            ${listeningBand}

                        </small>

                    </div>


                    <!-- =====================
                         READING
                    ====================== -->

                    <div class="score-item">

                        <strong>
                            Reading
                        </strong>


                        <span>

                            ${
                                readingScore !== null &&
                                readingScore !== undefined

                                    ? readingScore + " / 40"

                                    : "Not submitted"
                            }

                        </span>


                        <small>

                            Band:
                            ${readingBand}

                        </small>

                    </div>


                    <!-- =====================
                         WRITING
                    ====================== -->

                    <div class="score-item">

                        <strong>
                            Writing
                        </strong>


                        <span>

                            ${
                                writingSubmission
                                    ? "Submitted"
                                    : "Not submitted"
                            }

                        </span>


                        <small>

                            ${
                                writingSubmission

                                    ? (
                                        writingSubmission.status ===
                                        "reviewed"

                                            ? "Review submitted"

                                            : "Ready for review"
                                      )

                                    : "No submission"
                            }

                        </small>


                        ${
                            writingSubmission &&
                            writingSubmission.status !==
                                "reviewed"

                                ? `

                                    <button
                                        type="button"
                                        class="review-writing-button"
                                        onclick="
                                            reviewWriting(
                                                '${writingSubmission.id}'
                                            )
                                        "
                                    >
                                        Review Writing
                                    </button>

                                `

                                : ""
                        }


                    </div>


                </div>


            </div>

        `;


        studentList.appendChild(
            studentCard
        );

    });

}

function reviewWriting(submissionId) {
    window.location.href =
        `faculty-writing-review.html?submission=${encodeURIComponent(submissionId)}`;
}

// Delete only the selected student's selected test result
async function deleteTestResult(studentId, testName) {
    const confirmed = confirm(
        `Delete ${testName} result for this student? This will not delete the student account.`
    );

    if (!confirmed) {
        return;
    }

    const { error } = await supabaseClient
        .from("test_results")
        .delete()
        .eq("student_id", Number(studentId))
        .eq("test_name", testName);

    if (error) {
        alert("Error deleting test result: " + error.message);
        return;
    }

    alert(`${testName} result deleted successfully.`);

    await loadStudentsAndResults();
}


// Listening score to IELTS band
function getListeningBand(score) {
    score = Number(score);

    if (score >= 39) return "9.0";
    if (score >= 37) return "8.5";
    if (score >= 35) return "8.0";
    if (score >= 32) return "7.5";
    if (score >= 30) return "7.0";
    if (score >= 27) return "6.5";
    if (score >= 23) return "6.0";
    if (score >= 20) return "5.5";
    if (score >= 16) return "5.0";
    if (score >= 13) return "4.5";
    if (score >= 10) return "4.0";
    if (score >= 8) return "3.5";
    if (score >= 6) return "3.0";
    if (score >= 4) return "2.5";
    if (score >= 1) return "2.0";

    return "0.0";
}


// Reading score to IELTS band
function getReadingBand(score) {
    score = Number(score);

    if (score >= 39) return "9.0";
    if (score >= 37) return "8.5";
    if (score >= 35) return "8.0";
    if (score >= 33) return "7.5";
    if (score >= 30) return "7.0";
    if (score >= 27) return "6.5";
    if (score >= 23) return "6.0";
    if (score >= 19) return "5.5";
    if (score >= 15) return "5.0";
    if (score >= 13) return "4.5";
    if (score >= 10) return "4.0";
    if (score >= 8) return "3.5";
    if (score >= 6) return "3.0";
    if (score >= 4) return "2.5";
    if (score >= 1) return "2.0";

    return "0.0";
}


// Prevent HTML injection in student names
function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// Start loading
loadStudentsAndResults();
</script>

</body>
</html>
