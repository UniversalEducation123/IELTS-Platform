    <script>
        const SUPABASE_URL = "https://gehczgguwxqwfowmbedy.supabase.co";

let allStudents = [];
let allResults = [];

// Load students and test results
async function loadStudentsAndResults() {
    const loadingMessage = document.getElementById("loadingMessage");
    const studentList = document.getElementById("studentList");

    loadingMessage.style.display = "block";
    studentList.innerHTML = "";

    const { data: students, error: studentsError } =
        await supabaseClient
            .from("students")
            .select("*")
            .order("id", { ascending: true });

    if (studentsError) {
        loadingMessage.textContent =
            "Error loading students: " + studentsError.message;
        return;
    }

    const { data: results, error: resultsError } =
        await supabaseClient
            .from("test_results")
            .select("*")
            .eq("is_submitted", true)
            .order("id", { ascending: true });

    if (resultsError) {
        loadingMessage.textContent =
            "Error loading test results: " + resultsError.message;
        return;
    }

    const { data: writingSubmissions, error: writingError } =
        await supabaseClient
            .from("writing_submissions")
            .select("*")
            .order("submitted_at", { ascending: false });

    if (writingError) {
        loadingMessage.textContent =
            "Error loading writing submissions: " + writingError.message;
        return;
    }

allWritingSubmissions = writingSubmissions || [];

    allStudents = students || [];
    allResults = results || [];

    loadingMessage.style.display = "none";

    showTestResults(selectedTest);
}


// Show results according to selected test
function showTestResults(testName, clickedButton = null) {

    selectedTest = testName;

    /* =================================
       UPDATE ACTIVE FILTER BUTTON
    ================================= */

    document.querySelectorAll(".test-filter-button").forEach(button => {
        button.classList.remove("active");
    });

    if (clickedButton) {

        clickedButton.classList.add("active");

    } else {

        const firstButton = document.querySelector(
            `.test-filter-button[onclick*="'${testName}'"]`
        );

        if (firstButton) {
            firstButton.classList.add("active");
        }

    }


    const studentList =
        document.getElementById("studentList");


    /* =================================
       FILTER RESULTS
    ================================= */

    let filteredResults;

    if (testName === "ALL") {

        filteredResults = allResults;

    } else {

        filteredResults =
            allResults.filter(result =>
                result.test_name === testName
            );

    }


    /* =================================
   GROUP BY STUDENT + TEST

   Combines Listening, Reading and
   Writing into ONE card.
================================= */

const groupedResults = {};

/* ---------- Listening & Reading ---------- */

filteredResults.forEach(result => {

    const studentId = String(result.student_id);
    const currentTest = result.test_name || "Unnamed Test";
    const groupKey = studentId + "_" + currentTest;

    if (!groupedResults[groupKey]) {

        groupedResults[groupKey] = {
            student_id: result.student_id,
            student_name: result.student_name,
            test_name: currentTest,
            test_date: result.test_date || null,
            listening_score: null,
            reading_score: null,
            writing_score: null,
            speaking_score: null,
            final_mock_score: null
        };

    }

    const grouped = groupedResults[groupKey];

    if (!grouped.test_date && result.test_date) {
        grouped.test_date = result.test_date;
    }

    if (result.listening_score != null) {
        grouped.listening_score = result.listening_score;
    }

    if (result.reading_score != null) {
        grouped.reading_score = result.reading_score;
    }

    if (result.speaking_score != null) {
        grouped.speaking_score =
            result.speaking_score;
    }

    if (result.final_mock_score != null) {
        grouped.final_mock_score =
            result.final_mock_score;
    }

});

/* ---------- Merge Writing submissions ---------- */

allWritingSubmissions.forEach(submission => {

    const currentTest =
        submission.test_id
            .replace("writing-", "")
            .replace(/-/g, " ")
            .replace(/\b\w/g, c => c.toUpperCase());

    if (testName !== "ALL" && currentTest !== testName) {
        return;
    }

    const groupKey =
        String(submission.student_id) + "_" + currentTest;

    if (!groupedResults[groupKey]) {

        groupedResults[groupKey] = {
            student_id: submission.student_id,
            student_name: submission.student_name,
            test_name: currentTest,
            test_date: submission.submitted_at
                ? submission.submitted_at.substring(0, 10)
                : null,
            listening_score: null,
            reading_score: null,
            writing_score: null,
            speaking_score: null,
            final_mock_score: null
        };

    }

    groupedResults[groupKey].writing_score =
        submission.overall_score;

});

const groupedResultList = Object.values(groupedResults);


/* =========================================
   CALCULATE FINAL MOCK FROM CURRENT SCORES
========================================= */

groupedResultList.forEach(result => {

    result.final_mock_score =
        calculateFinalMockScore(
            result.listening_score,
            result.reading_score,
            result.writing_score,
            result.speaking_score
        );

});


/* =================================
   NO RESULTS
================================= */

if (groupedResultList.length === 0) {

            No results found for
            ${

                    : testName

        </div>

}

studentList.innerHTML = "";

    /* =================================

        /* =============================

        const readingScore =
            result.reading_score;

        const writingScore =
            result.writing_score;

        const speakingScore =
            result.speaking_score;

        const finalMockScore =
            result.final_mock_score;


        /* =============================
           BANDS
        ============================= */

        const listeningBand =
            listeningScore !== null &&

                ? getListeningBand(listeningScore)

                : "Not submitted";


        const readingBand =
            readingScore !== null &&

        /* =============================

        const studentCard =

            <div class="test-result-card">

                </h3>


                <p class="test-date">

                </p>

    <!-- LISTENING -->

        <strong>

        </span>

        <small>

    </div>


    <!-- WRITING -->

<div class="score-item">

                : writingSubmission &&

    </small>

            `

            : `
                <button
                    type="button"

                >
                    No Writing
                </button>
            `
    }

</div>

    <!-- SPEAKING -->

    <div class="score-item">

        <strong>
            Speaking
        </strong>

        ${
            speakingScore !== null &&
            speakingScore !== undefined

                ? `
                    <span>
                        ${Number(speakingScore).toFixed(1)}
                    </span>

                    <small>
                        Score entered
                    </small>
                `

                : `
                    <span>
                        Pending
                    </span>

                    <small>
                        Enter manually
                    </small>
                `
        }

        <input
            type="number"

            placeholder="e.g. 6.0"

        <button

            onclick="
                saveSpeakingScore(

        >

    </div>

</div>


<!-- FINAL MOCK -->

">

    <span style="

            finalMockScore !== undefined

</div>

        studentList.appendChild(

}

function reviewWriting(submissionId) {
    window.location.href =
        `faculty-writing-review.html?submission=${encodeURIComponent(submissionId)}`;
}

// Delete only the selected student's selected test result
async function deleteTestResult(studentId, testName) {

    const confirmed = confirm(
        `Delete ${testName} result for this student? This will delete all section results for this test, including the Writing submission.`
    );

    if (!confirmed) {
        return;
    }

    /* =========================================
       DELETE LISTENING / READING / SPEAKING
       ========================================= */

    const { error: resultsError } =
        await supabaseClient
            .from("test_results")
            .delete()
            .eq("student_id", Number(studentId))
            .eq("test_name", testName);

    if (resultsError) {

        console.error(resultsError);

        alert(
            "Error deleting test result: " +
            resultsError.message
        );

        return;
    }


    /* =========================================
       DELETE WRITING SUBMISSION
       ========================================= */

    const writingTestId =
        "writing-" +
        String(testName)
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "-");


    const { error: writingError } =
        await supabaseClient
            .from("writing_submissions")
            .delete()
            .eq("student_id", Number(studentId))
            .eq("test_id", writingTestId);


    if (writingError) {

        console.error(writingError);

        alert(
            "The test result was deleted, but the Writing submission could not be deleted: " +
            writingError.message
        );

        return;
    }


    /* =========================================
       RELOAD EVERYTHING
       ========================================= */

    alert(
        `${testName} deleted successfully.`
    );

    await loadStudentsAndResults();
}


// Listening score to IELTS band
function getListeningBand(score) {
    score = Number(score);

    if (score >= 39) return "9.0";
    if (score >= 37) return "8.5";
    if (score >= 35) return "8.0";
    if (score >= 32) return "7.5";
    if (score >= 30) return "7.0";
    if (score >= 27) return "6.5";
    if (score >= 23) return "6.0";
    if (score >= 20) return "5.5";
    if (score >= 16) return "5.0";
    if (score >= 13) return "4.5";
    if (score >= 10) return "4.0";
    if (score >= 8) return "3.5";
    if (score >= 6) return "3.0";
    if (score >= 4) return "2.5";
    if (score >= 1) return "2.0";

    return "0.0";
}


// Reading score to IELTS band
function getReadingBand(score) {
    score = Number(score);

    if (score >= 39) return "9.0";
    if (score >= 37) return "8.5";
    if (score >= 35) return "8.0";
    if (score >= 33) return "7.5";
    if (score >= 30) return "7.0";
    if (score >= 27) return "6.5";
    if (score >= 23) return "6.0";
    if (score >= 19) return "5.5";
    if (score >= 15) return "5.0";
    if (score >= 13) return "4.5";
    if (score >= 10) return "4.0";
    if (score >= 8) return "3.5";
    if (score >= 6) return "3.0";
    if (score >= 4) return "2.5";
    if (score >= 1) return "2.0";

    return "0.0";
}

// Speaking score is entered directly as an IELTS band.
function getSpeakingBand(score) {
    if (score === null || score === undefined || score === "") {
        return null;
    }

    const value = Number(score);

    if (!Number.isFinite(value)) {
        return null;
    }

    return value.toFixed(1);
}


// Calculate IELTS overall band from the four section bands.
function calculateFinalMockScore(
    listeningScore,
    readingScore,
    writingScore,
    speakingScore
) {

    const values = [
        listeningScore,
        readingScore,
        writingScore,
        speakingScore
    ];

    // All four scores must exist
    if (
        values.some(value =>
            value === null ||
            value === undefined ||
            value === ""
        )
    ) {
        return null;
    }

    const listeningBand =
        Number(getListeningBand(listeningScore));

    const readingBand =
        Number(getReadingBand(readingScore));

    const writingBand =
        Number(writingScore);

    const speakingBand =
        Number(speakingScore);

    const bands = [
        listeningBand,
        readingBand,
        writingBand,
        speakingBand
    ];

    // Every component must be a valid band from 1.0 to 9.0
    if (
        bands.some(
            band =>
                !Number.isFinite(band) ||
                band < 1 ||
                band > 9
        )
    ) {
        return null;
    }

    const average =
        (
            listeningBand +
            readingBand +
            writingBand +
            speakingBand
        ) / 4;

    /*
     * IELTS rounding:
     * .25 → next .5
     * .75 → next whole
     *
     * Math.round to the nearest half band handles
     * .0, .25, .5 and .75 correctly.
     */

    const rounded =
        Math.round(
            (average + Number.EPSILON) * 2
        ) / 2;

    return Number(rounded.toFixed(1));
}

// Save the faculty-entered Speaking score.
async function saveSpeakingScore(
    studentId,
    testName
) {

    const input =
        document.getElementById(
            `speaking-${studentId}-${testName.replace(/\s+/g, "-")}`
        );

    if (!input) {
        return;
    }

    const speakingValue =
        input.value.trim();

    if (speakingValue === "") {
        alert("Please enter the Speaking score.");
        return;
    }

    const speakingScore =
        Number(speakingValue);

    if (
        !Number.isFinite(speakingScore) ||
        speakingScore < 1 ||
        speakingScore > 9 ||
        speakingScore % 0.5 !== 0
    ) {
        alert(
            "Speaking score must be between 1 and 9 in 0.5 increments."
        );
        return;
    }


    /* =========================================
       GET ALL TEST RESULT ROWS
    ========================================= */

    const matchingResults =
        allResults.filter(result =>
            String(result.student_id) === String(studentId) &&
            result.test_name === testName
        );

    if (matchingResults.length === 0) {

        alert(
            "The student does not have a test result row yet."
        );

        return;
    }


    /* =========================================
       MERGE LISTENING + READING FROM ALL ROWS
    ========================================= */

    let listeningScore = null;
    let readingScore = null;

    matchingResults.forEach(result => {

        if (
            listeningScore === null &&
            result.listening_score !== null &&
            result.listening_score !== undefined
        ) {
            listeningScore =
                result.listening_score;
        }

        if (
            readingScore === null &&
            result.reading_score !== null &&
            result.reading_score !== undefined
        ) {
            readingScore =
                result.reading_score;
        }

    });


    /* =========================================
       FIND WRITING SCORE
    ========================================= */

    const writingSubmission =
        allWritingSubmissions.find(submission =>
            String(submission.student_id) === String(studentId) &&
            submission.test_id ===
                (
                    "writing-" +
                    testName
                        .trim()
                        .toLowerCase()
                        .replace(/\s+/g, "-")
                )
        );

    const writingScore =
        writingSubmission
            ? writingSubmission.overall_score
            : null;


    /* =========================================
       CALCULATE FINAL MOCK
    ========================================= */

    const finalMockScore =
        calculateFinalMockScore(
            listeningScore,
            readingScore,
            writingScore,
            speakingScore
        );


    /* =========================================
       UPDATE ALL MATCHING TEST RESULT ROWS
    ========================================= */

    const { error } =
        await supabaseClient
            .from("test_results")
            .update({
                speaking_score:
                    speakingScore,

                final_mock_score:
                    finalMockScore
            })
            .eq("student_id", Number(studentId))
            .eq("test_name", testName);


    if (error) {

        console.error(error);

        alert(
            "Error saving Speaking score: " +
            error.message
        );

        return;
    }


    alert(
        finalMockScore !== null
            ? "Speaking score saved. Final Mock score updated."
            : "Speaking score saved. Final Mock remains pending until all four scores are available."
    );


    await loadStudentsAndResults();
}

// Prevent HTML injection in student names
function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// Start loading
loadStudentsAndResults();
