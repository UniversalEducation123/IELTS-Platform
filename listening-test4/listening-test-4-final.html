<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Test 4 Result</title>

    <style>
    *{
    box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            padding:30px 16px;
            font-family:Arial,sans-serif;
            color:#4C4A46;

            background:
                radial-gradient(circle at top left,
                    rgba(139,154,110,.12), transparent 35%),
                radial-gradient(circle at bottom right,
                    rgba(234,226,214,.55), transparent 35%),
                #F7F2EB;
        }

        .result-header{
            width:100%;
            max-width:980px;
            height:68px;
            margin:0 auto 22px;
            padding:0 24px;

            display:flex;
            justify-content:space-between;
            align-items:center;
            background:rgba(255,255,255,.72);
            backdrop-filter:blur(16px);

            border:1px solid rgba(224,216,203,.9);
            border-radius:18px;
            box-shadow:0 8px 22px rgba(76,74,70,.05);
        }

        .result-logo{
            font-size:20px;
            font-weight:700;
            color:#4C4A46;
        }

        .result-header-links{
            display:flex;
            gap:22px;
        }

        .result-header-links a{
            color:#6B6A66;
            text-decoration:none;
            font-size:14px;
            font-weight:600;
            transition:.2s ease;
        }

        .result-header-links a:hover{
            color:#8B9A6E;
        }

        .result-card{
            width:100%;
            max-width:760px;
            margin:auto;

            padding:38px 32px;
            background:rgba(255,255,255,.82);
            backdrop-filter:blur(14px);

            border:1px solid rgba(231,225,214,.9);
            border-radius:24px;
            box-shadow:0 14px 34px rgba(76,74,70,.06);
        }

        h1{
            margin:0 0 32px;
            text-align:center;
            color:#4C4A46;
            font-size:32px;
        }

        h2{
            margin:40px 0 22px;
            color:#4C4A46;
            font-size:24px;
        }

        .result-line{
            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:16px 4px;
            border-bottom:1px solid #E7DFD3;
            font-size:17px;
            color:#5F5B55;
        }

        .result-line span{
            font-weight:700;
            color:#6F7B57;
        }

        .band-line{
            margin-top:12px;
            padding-top:22px;

            border-top:1px solid #DDD5C8;
            border-bottom:none;
            font-size:20px;
        }

        .band-line span{
            font-size:28px;
            color:#8B9A6E;
        }

        .answer-review-section{
            margin-top:34px;
        }

        .answer-review-item{
            margin-bottom:14px;
            padding:16px 18px;
            border-left:4px solid;
            border-radius:14px;
        }

        .answer-review-item.correct{
            background:#F4F6F1;
            border-left-color:#8B9A6E;
        }

        .answer-review-item.wrong{
            background:#FBF8F4;
            border-left-color:#B09A7D;
        }
        
        .answer-review-item.partial{
            background:#F8F5EE;
            border-left-color:#B09A7D;
        }

        .partial .review-status{
            color:#9B8568;
        }

        .review-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            margin-bottom:8px;
        }

        .review-status{
            font-weight:700;
            font-size:14px;
        }

        .correct .review-status{
            color:#6F7B57;
        }

        .wrong .review-status{
            color:#9B8568;
        }

        .answer-review-item p{
            margin:6px 0;
            color:#5F5B55;
            line-height:1.6;
        }

        .answer-review-item strong{
            color:#4C4A46;
        }

        .home-button{
            display:block;
            width:fit-content;
            margin:34px auto 0;
            padding:13px 28px;

            border-radius:999px;
            border:1px solid #8B9A6E;
            background:#8B9A6E;
            color:#FFFFFF;

            text-decoration:none;
            font-weight:600;
            transition:.25s ease;
        }

        .home-button:hover{
            background:#78855F;
            transform:translateY(-2px);
            box-shadow:0 10px 22px rgba(139,154,110,.18);
        }

        @media (max-width:600px){

            body{
                padding:18px 12px;
            }

            .result-header{
                height:auto;
                padding:16px;
                flex-direction:column;
                gap:12px;
            }

            .result-card{
                padding:26px 20px;
            }

            h1{
                font-size:28px;
            }

            h2{
                font-size:21px;
            }

            .result-line{
                font-size:16px;
            }

            .review-header{
                flex-direction:column;
                align-items:flex-start;
            }

        }
    </style>
</head>

<body>

    <header class="result-header">

        <div class="result-logo">
            IELTS Practice
        </div>

        <div class="result-header-links">

            <a href="../student-dashboard.html">
                Dashboard
            </a>

            <a href="../index.html">
                Logout
            </a>

        </div>

    </header>


    <div class="result-card">

        <h1>Listening Test 4 Result</h1>

        <div class="result-line">
            <strong>Correct Answers:</strong>
            <span id="correctAnswers">0</span>
        </div>

        <div class="result-line">
            <strong>Wrong Answers:</strong>
            <span id="wrongAnswers">0</span>
        </div>

        <div class="result-line">
            <strong>Total Score:</strong>
            <span id="totalScore">0 / 40</span>
        </div>

        <div class="result-line band-line">
            <strong>IELTS Band:</strong>
            <span id="bandScore">2.0</span>
        </div>

        <div class="answer-review-section">

            <h2>Answer Review</h2>

            <div id="answerReview"></div>

        </div>

        <a href="../submitted-tests.html" class="home-button">
            View Submitted Tests
        </a>

    </div>


    <!-- Supabase Library -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* ===============================
           SUPABASE CONNECTION
        =============================== */

        const SUPABASE_URL =
            "https://gehczgguwxqwfowmbedy.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* ===============================
           ANSWER NORMALIZATION
        =============================== */

        function normalizeAnswer(answer) {

            return String(answer || "")
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]/g, "");

        }


        function isCorrect(
            studentAnswer,
            acceptedAnswers
        ) {

            const student =
                normalizeAnswer(studentAnswer);

            if (!student) {
                return false;
            }

            return acceptedAnswers.some(
                function(answer) {

                    return student ===
                        normalizeAnswer(answer);

                }
            );

        }


        /* ===============================
           BAND SCORE
           LISTENING
        =============================== */

        function calculateBand(correctCount) {

            if (correctCount >= 39) return "9.0";
            if (correctCount >= 37) return "8.5";
            if (correctCount >= 35) return "8.0";
            if (correctCount >= 32) return "7.5";
            if (correctCount >= 30) return "7.0";
            if (correctCount >= 26) return "6.5";
            if (correctCount >= 23) return "6.0";
            if (correctCount >= 18) return "5.5";
            if (correctCount >= 16) return "5.0";
            if (correctCount >= 13) return "4.5";
            if (correctCount >= 10) return "4.0";
            if (correctCount >= 8) return "3.5";
            if (correctCount >= 6) return "3.0";
            if (correctCount >= 4) return "2.5";

            return "2.0";

        }


        /* ===============================
           READ TEST 4 ANSWER
        =============================== */

        function readTest4Answer(questionNumber) {

            const storageKey =
                "listeningTest4_q" +
                questionNumber;

            const raw =
                sessionStorage.getItem(storageKey);

            if (!raw) {
                return [];
            }

            try {

                const parsed =
                    JSON.parse(raw);

                if (Array.isArray(parsed)) {
                    return parsed;
                }

                return [parsed];

            } catch (error) {

                console.error(
                    "Could not read:",
                    storageKey,
                    error
                );

                return [];

            }

        }


        /* ===============================
           GET SINGLE ANSWER
        =============================== */

        function getSingleAnswer(questionNumber) {

            const answers =
                readTest4Answer(questionNumber);

            if (!answers.length) {
                return "";
            }

            return answers[0];

        }


        /* ===============================
           ANSWER REVIEW ITEM
        =============================== */

        function addReviewItem(
            questionNumber,
            studentAnswer,
            correctAnswer,
            correct
        ) {

            const answerReview =
                document.getElementById(
                    "answerReview"
                );

            if (!answerReview) return;


            const reviewItem =
                document.createElement("div");


            reviewItem.className =
                correct
                    ? "answer-review-item correct"
                    : "answer-review-item wrong";


            const displayedStudentAnswer =
                studentAnswer &&
                String(studentAnswer).trim() !== ""
                    ? studentAnswer
                    : "Not answered";


            reviewItem.innerHTML = `

                <div class="review-header">

                    <strong>
                        Question ${questionNumber}
                    </strong>

                    <span class="review-status">

                        ${correct
                            ? "✓ Correct"
                            : "✗ Wrong"}

                    </span>

                </div>


                <p>
                    Your answer:
                    <strong>
                        ${displayedStudentAnswer}
                    </strong>
                </p>


                <p>
                    Correct answer:
                    <strong>
                        ${correctAnswer}
                    </strong>
                </p>

            `;


            answerReview.appendChild(
                reviewItem
            );

        }


        /* ===============================
           GROUP REVIEW
           QUESTIONS 5–7
        =============================== */

        function addGroupReview(
            questionLabel,
            studentAnswers,
            correctAnswers,
            score,
            total
        ) {

            const answerReview =
                document.getElementById(
                    "answerReview"
                );


            const correct =
                score === total;

            const partial =
                score > 0 && score < total;


            const reviewItem =
                document.createElement("div");


            reviewItem.className =
                correct
                    ? "answer-review-item correct"
                    : partial
                        ? "answer-review-item partial"
                        : "answer-review-item wrong";


            const displayedStudentAnswer =
                studentAnswers.length
                    ? studentAnswers.join(", ")
                    : "Not answered";


            reviewItem.innerHTML = `

                <div class="review-header">

                    <strong>
                        ${questionLabel}
                    </strong>

                    <span class="review-status">

                        ${correct
                        ? "✓ Correct"
                        : partial
                            ? "◐ Partially correct"
                            : "✗ Wrong"}

                    </span>

                </div>


                <p>
                    Your answers:
                    <strong>
                        ${displayedStudentAnswer}
                    </strong>
                </p>


                <p>
                    Correct answers:
                    <strong>
                        ${correctAnswers.join(", ")}
                    </strong>
                </p>

            `;


            answerReview.appendChild(
                reviewItem
            );

        }


        /* ===============================
           PAIR REVIEW
           QUESTIONS 11–12
        =============================== */

        function addPairReviewItem(
            questionNumber,
            studentAnswers,
            correctAnswers,
            correct
        ) {

            const answerReview =
                document.getElementById(
                    "answerReview"
                );


            const reviewItem =
                document.createElement("div");


            reviewItem.className =
                correct
                    ? "answer-review-item correct"
                    : "answer-review-item wrong";


            const displayedStudentAnswers =
                studentAnswers.length
                    ? studentAnswers.join(", ")
                    : "Not answered";


            reviewItem.innerHTML = `

                <div class="review-header">

                    <strong>
                        Question ${questionNumber}
                    </strong>

                    <span class="review-status">

                        ${correct
                            ? "✓ Correct"
                            : "✗ Wrong"}

                    </span>

                </div>


                <p>
                    Your answers:
                    <strong>
                        ${displayedStudentAnswers}
                    </strong>
                </p>


                <p>
                    Correct answers:
                    <strong>
                        ${correctAnswers.join(", ")}
                    </strong>
                </p>

            `;


            answerReview.appendChild(
                reviewItem
            );

        }


        /* ===============================
           CHECK TWO-ANSWER QUESTION
        =============================== */

        function checkPair(
            studentAnswers,
            correctAnswers
        ) {

            const student =
                studentAnswers
                    .map(function(answer) {
                        return normalizeAnswer(answer);
                    })
                    .filter(function(answer) {
                        return answer !== "";
                    })
                    .sort();


            const correct =
                correctAnswers
                    .map(function(answer) {
                        return normalizeAnswer(answer);
                    })
                    .sort();


            if (student.length !== 2) {
                return false;
            }


            return (
                student[0] === correct[0] &&
                student[1] === correct[1]
            );

        }


        /* ===============================
           MAIN SCORE CALCULATION
        =============================== */

        async function calculateListeningScore() {

            let correctCount = 0;


            /* ===============================
               ANSWER KEY
            =============================== */

            const answerKey = {

                q1: ["90"],

                q2: [
                    "6 months",
                    "6 month",
                ],

                q3: [
                    "4 pm",
                    "4pm"
                ],

                q4: [
                    "internet"
                ],

                q8: ["B"],

                q9: ["H"],

                q10: ["E"],


                q13: [
                    "28th August",
                    "28 August"
                ],

                q14: [
                    "People at Work"
                ],

                q15: [
                    "careers advice"
                ],

                q16: [
                    "Land from Air"
                ],

                q17: [
                    "balloon trip"
                ],


                q18: ["B"],

                q19: ["E"],

                q20: ["C"],


                q21: ["B"],

                q22: ["C"],

                q23: ["C"],

                q24: ["A"],

                q25: ["A"],

                q26: ["C"],

                q27: ["C"],

                q28: ["B"],

                q29: ["C"],

                q30: ["A"],


                q31: ["Norway"],

                q32: ["organic"],

                q33: ["disease"],

                q34: ["plastic"],

                q35: ["mass manufacturing"],

                q36: ["packaging"],

                q37: ["disposable goods"],


                q38: ["C"],

                q39: ["E"],

                q40: ["D"]

            };


            /* ===============================
               QUESTIONS 1–4
            =============================== */

            for (
                let i = 1;
                i <= 4;
                i++
            ) {

                const student =
                    getSingleAnswer(i);

                const accepted =
                    answerKey["q" + i];

                const correct =
                    isCorrect(
                        student,
                        accepted
                    );


                if (correct) {
                    correctCount++;
                }


                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );

            }


            /* ===============================
               QUESTIONS 5–7
            =============================== */

            const selected5to7 =
                readTest4Answer(5);


            const correct5to7 =
                ["B", "F", "G"];


            let score5to7 = 0;


            correct5to7.forEach(
                function(correctAnswer) {

                    const found =
                        selected5to7.some(
                            function(studentAnswer) {

                                return normalizeAnswer(
                                    studentAnswer
                                ) === normalizeAnswer(
                                    correctAnswer
                                );

                            }
                        );


                    if (found) {
                        score5to7++;
                    }

                }
            );


            correctCount += score5to7;


            addGroupReview(
                "Questions 5–7",
                selected5to7,
                correct5to7,
                score5to7,
                3
            );


            /* ===============================
               QUESTIONS 8–10
            =============================== */

            for (
                let i = 8;
                i <= 10;
                i++
            ) {

                const student =
                    getSingleAnswer(i);

                const accepted =
                    answerKey["q" + i];

                const correct =
                    isCorrect(
                        student,
                        accepted
                    );


                if (correct) {
                    correctCount++;
                }


                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );

            }


            /* ===============================
               QUESTION 11
               CORRECT: A + C
            =============================== */

            const student11 =
                readTest4Answer(11);


            const correct11 =
                ["A", "C"];


            const question11Correct =
                checkPair(
                    student11,
                    correct11
                );


            if (question11Correct) {
                correctCount++;
            }


            addPairReviewItem(
                11,
                student11,
                correct11,
                question11Correct
            );


            /* ===============================
               QUESTION 12
               CORRECT: B + D
            =============================== */

            const student12 =
                readTest4Answer(12);


            const correct12 =
                ["B", "D"];


            const question12Correct =
                checkPair(
                    student12,
                    correct12
                );


            if (question12Correct) {
                correctCount++;
            }


            addPairReviewItem(
                12,
                student12,
                correct12,
                question12Correct
            );


            /* ===============================
               QUESTIONS 13–17
            =============================== */

            for (
                let i = 13;
                i <= 17;
                i++
            ) {

                const student =
                    getSingleAnswer(i);

                const accepted =
                    answerKey["q" + i];

                const correct =
                    isCorrect(
                        student,
                        accepted
                    );


                if (correct) {
                    correctCount++;
                }


                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );

            }


            /* ===============================
               QUESTIONS 18–20
            =============================== */

            for (
                let i = 18;
                i <= 20;
                i++
            ) {

                const student =
                    getSingleAnswer(i);

                const accepted =
                    answerKey["q" + i];

                const correct =
                    isCorrect(
                        student,
                        accepted
                    );


                if (correct) {
                    correctCount++;
                }


                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );

            }


            /* ===============================
               QUESTIONS 21–30
            =============================== */

            for (
                let i = 21;
                i <= 30;
                i++
            ) {

                const student =
                    getSingleAnswer(i);

                const accepted =
                    answerKey["q" + i];

                const correct =
                    isCorrect(
                        student,
                        accepted
                    );


                if (correct) {
                    correctCount++;
                }


                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );

            }


            /* ===============================
               QUESTIONS 31–37
            =============================== */

            for (
                let i = 31;
                i <= 37;
                i++
            ) {

                const student =
                    getSingleAnswer(i);

                const accepted =
                    answerKey["q" + i];

                const correct =
                    isCorrect(
                        student,
                        accepted
                    );


                if (correct) {
                    correctCount++;
                }


                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );

            }


            /* ===============================
               QUESTIONS 38–40
            =============================== */

            for (
                let i = 38;
                i <= 40;
                i++
            ) {

                const student =
                    getSingleAnswer(i);

                const accepted =
                    answerKey["q" + i];

                const correct =
                    isCorrect(
                        student,
                        accepted
                    );


                if (correct) {
                    correctCount++;
                }


                addReviewItem(
                    i,
                    student,
                    accepted.join(" / "),
                    correct
                );

            }


            /* ===============================
               DISPLAY FINAL SCORE
            =============================== */

            const wrongCount =
                40 - correctCount;


            document.getElementById(
                "correctAnswers"
            ).textContent =
                correctCount;


            document.getElementById(
                "wrongAnswers"
            ).textContent =
                wrongCount;


            document.getElementById(
                "totalScore"
            ).textContent =
                correctCount + " / 40";


            document.getElementById(
                "bandScore"
            ).textContent =
                calculateBand(
                    correctCount
                );


            console.log(
                "FINAL LISTENING TEST 4 SCORE:",
                correctCount + " / 40"
            );


            /* ===============================
               SAVE RESULT TO SUPABASE
            =============================== */

            await saveResultToSupabase(
                correctCount
            );

        }


        /* ===============================
           SAVE RESULT TO SUPABASE
        =============================== */

        async function saveResultToSupabase(
            score
        ) {

            if (
                sessionStorage.getItem(
                    "listeningTest4ResultSaved"
                ) === "true"
            ) {

                console.log(
                    "Listening Test 4 result already saved."
                );

                return;

            }


            const studentId =
                sessionStorage.getItem(
                    "studentId"
                );


            const studentName =
                sessionStorage.getItem(
                    "studentName"
                );


            const resultData = {

                student_id:
                    studentId
                        ? Number(studentId)
                        : null,

                student_name:
                    studentName,

                test_name:
                    "Test 4",

                test_date:
                    new Date()
                        .toISOString()
                        .split("T")[0],

                listening_score:
                    score,

                is_submitted:
                    true

            };


            console.log(
                "Test 4 data being sent to Supabase:",
                resultData
            );


            const { error } =
                await supabaseClient
                    .from("test_results")
                    .insert(
                        resultData
                    );


            if (error) {

                console.error(
                    "Error saving Test 4 listening result:",
                    error
                );

                return;

            }


            sessionStorage.setItem(
                "listeningTest4ResultSaved",
                "true"
            );


            console.log(
                "Test 4 listening result saved successfully."
            );

        }


        /* ===============================
           START CALCULATION
        =============================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                calculateListeningScore();

            }
        );

    </script>

</body>
</html>
