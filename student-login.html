<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - IELTS Practice</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
    <img src="assets/logo.png" alt="Universal Education Logo">
</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Back to Login</a>
        </nav>
    </header>

    <main class="login-page">

        <div class="login-container">

            <p class="small-heading">STUDENT PORTAL</p>

            <h1>Student Login</h1>

            <p class="login-subtitle">
                Sign in to access your IELTS practice dashboard.
            </p>

            <form class="auth-form" id="studentLoginForm">

    <label for="username">Student ID / Username</label>
    <input
        type="text"
        id="username"
        placeholder="Enter your student ID or username"
        required
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
    >

    <button type="submit" class="primary-btn">
        Login
    </button>

    <p id="loginMessage"></p>

</form>

        </div>

    </main>

    <script>
    const SUPABASE_URL = "https://gehczgguwxqwfowmbedy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_9-hNB-3bSeofDt2PchapIw_me-RTx3z";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const loginForm = document.getElementById("studentLoginForm");
    const loginMessage = document.getElementById("loginMessage");

    loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        loginMessage.textContent = "Checking login...";
        loginMessage.style.color = "green";

        const { data, error } = await supabaseClient
            .from("students")
            .select("*")
            .eq("username", username)
            .eq("password", password)
            .single();

        if (error) {
    console.error("Supabase login error:", error);

    loginMessage.textContent =
        "Database error: " + error.message;

    loginMessage.style.color = "red";
    return;
}

if (!data) {
    loginMessage.textContent = "Invalid username or password.";
    loginMessage.style.color = "red";
    return;
}

        sessionStorage.setItem("studentId", data.id);
        sessionStorage.setItem("studentName", data.full_name);
        sessionStorage.setItem("studentUsername", data.username);

        window.location.href = "test-1.html";;
    });
</script>

</body>
</html>
