<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - IELTS Practice</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">IELTS Practice</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Back to Login</a>
        </nav>
    </header>

    <main class="login-page">

        <div class="login-container">

            <p class="small-heading">STUDENT PORTAL</p>

            <h1>Student Login</h1>

            <p class="login-subtitle">
                Sign in to access your IELTS practice dashboard.
            </p>

            <form class="auth-form">

    <label for="username">Student ID / Username</label>
    <input
        type="text"
        id="username"
        placeholder="Enter your student ID or username"
        required
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
    >

    <button type="submit" class="primary-btn">
        Login
    </button>

</form>

        </div>

    </main>

</body>
</html>
